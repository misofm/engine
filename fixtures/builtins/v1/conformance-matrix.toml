fixture_schema = 1
launch_rates_hz = [44100, 48000, 88200, 96000]
quanta_frames = [1, 127, 128, 255, 1024]

[response]
sections = ["high_pass", "low_pass"]
cutoff_hz = [10, 20, 100, 1000, "min(20000,0.1*Fs)", "0.45*Fs"]
probe_targets = ["0.25*f", "f", "4*f", "0.2*Fs", "0.45*Fs"]
analytic_extra_probes = ["exact_cutoff", "0.49*Fs"]
cascade = "100-Hz HPF followed by 1-kHz LPF"
oracle = "independent f64 RBJ/state-space and impulse/sustained references"

[meter]
taps = ["input", "post_input_builtins", "post_simd1", "post_dynamic", "post_simd2_pre_fader", "post_fader", "post_matrix"]
cases = ["partial_window", "multiple_windows", "queue_wrap", "queue_full_drop", "drain", "discontinuity", "full_reset", "sanitization"]
exact_fields = ["peak", "energy", "rms", "sample_time", "held_peak", "clip_count", "sanitized_count", "drop_count"]

[resources]
track_counts = [1, 4, 65537]
meter_streams = [0, 1, 7]
queue_capacities = [1, 4]
expected = "success within supplied limits or typed builtin.resource.limit only"
