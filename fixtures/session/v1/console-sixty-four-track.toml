# Issue #149 item 3: the standing 64-track qualification session.
#
# The baseline this replaces is a ragged nine-track EQ-only session. Nine tracks is one full
# eight-lane bank plus a one-track scalar tail, which is the *worst* shape a bank can be asked to
# render and is not what a mixing session looks like. Sixty-four tracks at the launch eight-lane
# width is exactly eight full banks and no tail, so the per-track cost this fixture reports is the
# cost of a full bank rather than the cost of a remainder.
#
# Every track carries the channel strip a real session carries: input trim/HPF/LPF, a parametric
# EQ in SIMD rack 1, a compressor in the dynamic rack, a fader and a pan matrix, and one
# post-matrix route to the main output. No two tracks share a coefficient set -- identical strips
# would let the measurement collapse work a real console cannot collapse.
#
# `limits.memory_bytes` is raised from the nine-track fixture's 16 MiB because sixty-four prepared
# strips with two effects each do not fit inside it.
schema_version = 1
session_id = "console-sixty-four-track"
revision = 1
sample_rate_hz = 48000
quantum_frames = 128
render_profile = { id = "native", mode = "single_thread" }
output_profile = { id = "main", channels = 2, sample_format = "f32_planar" }
limits = { pcm_ring_frames = 1024, control_queue_messages = 256, memory_bytes = 268435456 }
sources = [
  { id = "fixture-source", sample_rate_hz = 48000, content = { identity = "sha256:console-sixty-four-track", locator = "host:console-sixty-four-track" }, mapping = { channel_count = 2, region = { start_sample = 0, length_samples = 48000 } } },
]
