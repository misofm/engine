# Issue #143 P3: one track, one compressor, in the **dynamic** rack.
#
# One track cannot fill a bank cohort, so the planner leaves this instance on the per-node scalar
# path — `graph::runtime::NodeKind::ConsoleEffect`. That is a different publish site from the
# banked one (`ConsoleEffectBankStage`), and a fixture that only ever banks would leave it ungated.
schema_version = 1
session_id = "compressor-dynamic-observation"
revision = 1
sample_rate_hz = 48000
quantum_frames = 128
render_profile = { id = "native", mode = "single_thread" }
output_profile = { id = "main", channels = 2, sample_format = "f32_planar" }
limits = { pcm_ring_frames = 1024, control_queue_messages = 64, memory_bytes = 16777216 }
sources = [
  { id = "fixture-source", sample_rate_hz = 48000, content = { identity = "sha256:compressor-dynamic-observation", locator = "host:compressor-dynamic-observation" }, mapping = { channel_count = 2, region = { start_sample = 0, length_samples = 48000 } } },
]
submixes = []
outputs = [{ id = "main-out" }]
routes = [
  { id = "comp0-main", source = { kind = "track", track_id = "comp0", tap = "post_matrix" }, destination = { kind = "output_input", output_id = "main-out" }, channel_matrix = { ll = 1.0, lr = 0.0, rl = 0.0, rr = 1.0 }, gain_db = 0.0 },
]
automation = []

[[tracks]]
id = "comp0"
source_id = "fixture-source"
left_source_channel = 0
right_source_channel = 1
builtins = { left = { polarity_invert = false, trim_db = 0.0, hpf_hz = 0.0, lpf_hz = 0.0, delay_samples = 0 }, right = { polarity_invert = false, trim_db = 0.0, hpf_hz = 0.0, lpf_hz = 0.0, delay_samples = 0 } }
simd1 = { effects = [] }
dynamic = { effects = [{ id = "comp", identity = { kind = "native", effect_id = "miso.compressor" }, quality = "normal", bypass = false, link_mode = "dual_mono", params = [{ parameter_id = 1, channel = "both", unit = "db", value = 0.0 }, { parameter_id = 2, channel = "both", unit = "ratio", value = 4.0 }, { parameter_id = 3, channel = "both", unit = "db", value = 6.0 }, { parameter_id = 4, channel = "both", unit = "milliseconds", value = 10.0 }, { parameter_id = 5, channel = "both", unit = "milliseconds", value = 100.0 }, { parameter_id = 6, channel = "both", unit = "db", value = 0.0 }, { parameter_id = 7, channel = "both", unit = "linear", value = 1.0 }, { parameter_id = 8, channel = "both", unit = "milliseconds", value = 5.0 }], sidechain = { kind = "none" } }] }
simd2 = { effects = [] }
fader = { left_db = 0.0, right_db = 0.0, left_mute = false, right_mute = false }
pan = { left = -1.0, right = 1.0, smoothing_samples = 0 }
