# Issue #163 phase 1b: the `compressor-bank-observation` fixture with every compressor moved from
# SIMD-1 into the **dynamic** rack, and nothing else changed.
#
# Same eight tracks, same identity builtins, same eight thresholds, same routes. Both racks the
# compressor is not in are empty, so the two fixtures describe the same signal chain -- which is
# what makes `observation_is_identical_across_rack_placement` a bit comparison rather than an
# approximation.
#
# Before phase 1b this session banked nothing: `rack_location` mapped the dynamic rack to `None`,
# so eight identical bankable compressors ran per node purely because of where they sat. It now
# forms the same homogeneous bank the SIMD-1 twin forms, and the #143 observation taps must resolve
# and meter identically through the banked publish site (`ConsoleEffectBankStage`).
#
schema_version = 1
session_id = "compressor-dynamic-bank-observation"
revision = 1
sample_rate_hz = 48000
quantum_frames = 128
render_profile = { id = "native", mode = "single_thread" }
output_profile = { id = "main", channels = 2, sample_format = "f32_planar" }
limits = { pcm_ring_frames = 1024, control_queue_messages = 64, memory_bytes = 16777216 }
sources = [
  { id = "fixture-source", sample_rate_hz = 48000, content = { identity = "sha256:compressor-dynamic-bank-observation", locator = "host:compressor-dynamic-bank-observation" }, mapping = { channel_count = 2, region = { start_sample = 0, length_samples = 48000 } } },
]
submixes = []
outputs = [{ id = "main-out" }]
routes = [
  { id = "comp0-main", source = { kind = "track", track_id = "comp0", tap = "post_matrix" }, destination = { kind = "output_input", output_id = "main-out" }, channel_matrix = { ll = 1.0, lr = 0.0, rl = 0.0, rr = 1.0 }, gain_db = 0.0 },
  { id = "comp1-main", source = { kind = "track", track_id = "comp1", tap = "post_matrix" }, destination = { kind = "output_input", output_id = "main-out" }, channel_matrix = { ll = 1.0, lr = 0.0, rl = 0.0, rr = 1.0 }, gain_db = 0.0 },
  { id = "comp2-main", source = { kind = "track", track_id = "comp2", tap = "post_matrix" }, destination = { kind = "output_input", output_id = "main-out" }, channel_matrix = { ll = 1.0, lr = 0.0, rl = 0.0, rr = 1.0 }, gain_db = 0.0 },
  { id = "comp3-main", source = { kind = "track", track_id = "comp3", tap = "post_matrix" }, destination = { kind = "output_input", output_id = "main-out" }, channel_matrix = { ll = 1.0, lr = 0.0, rl = 0.0, rr = 1.0 }, gain_db = 0.0 },
  { id = "comp4-main", source = { kind = "track", track_id = "comp4", tap = "post_matrix" }, destination = { kind = "output_input", output_id = "main-out" }, channel_matrix = { ll = 1.0, lr = 0.0, rl = 0.0, rr = 1.0 }, gain_db = 0.0 },
  { id = "comp5-main", source = { kind = "track", track_id = "comp5", tap = "post_matrix" }, destination = { kind = "output_input", output_id = "main-out" }, channel_matrix = { ll = 1.0, lr = 0.0, rl = 0.0, rr = 1.0 }, gain_db = 0.0 },
  { id = "comp6-main", source = { kind = "track", track_id = "comp6", tap = "post_matrix" }, destination = { kind = "output_input", output_id = "main-out" }, channel_matrix = { ll = 1.0, lr = 0.0, rl = 0.0, rr = 1.0 }, gain_db = 0.0 },
  { id = "comp7-main", source = { kind = "track", track_id = "comp7", tap = "post_matrix" }, destination = { kind = "output_input", output_id = "main-out" }, channel_matrix = { ll = 1.0, lr = 0.0, rl = 0.0, rr = 1.0 }, gain_db = 0.0 },
]
automation = []

