version = 1

[[rules]]
id = 'fusion'
scan_description = 'fusion source scan'
forbidden_regex = 'mul_add|_mm256_fmadd|_mm256_fmsub|_mm256_fnmadd|_mm_fmadd|vfmaq|vfmsq|wide::'
glob = '*.rs'
roots = ['crates', 'hosts', 'tools', 'sidecars']
exclude_description = 'fusion source exclusions'
exclude_regex = '^crates/lane/src/|^crates/lane/tests/|^crates/dsp-reference/|^tools/audit/src/unfused_fma\.rs:|^tools/wasm-gates/tests/g5_native_corpus\.rs:'
failure_diagnostic = 'fused multiply-add and the SIMD vocabulary belong to crates/lane (D3, D4)'

[[rules]]
id = 'relaxed'
scan_description = 'relaxed SIMD source scan'
forbidden_regex = 'f32x4_relaxed|f64x2_relaxed|relaxed_madd|relaxed_nmadd|relaxed_dot|i8x16_relaxed'
glob = '*.rs'
roots = ['crates', 'hosts', 'tools', 'sidecars']
failure_diagnostic = 'relaxed SIMD is forbidden on every target (D3)'

[[rules]]
id = 'architecture'
scan_description = 'architecture source scan'
forbidden_regex = '(core|std)::arch::'
glob = '*.rs'
roots = ['crates', 'hosts', 'tools', 'sidecars']
exclude_description = 'architecture source exclusions'
exclude_regex = '^crates/lane/src/softfma\.rs:|^crates/lane/src/fpenv\.rs:'
failure_diagnostic = 'raw architecture intrinsics belong to crates/lane/src/{softfma,fpenv}.rs'

[[rules]]
id = 'detection'
scan_description = 'detection source scan'
forbidden_regex = 'is_x86_feature_detected|is_aarch64_feature_detected'
glob = '*.rs'
roots = ['crates', 'hosts', 'tools', 'sidecars']
exclude_description = 'detection source exclusions'
exclude_regex = '^crates/lane/src/backend\.rs:|^crates/lane/src/lib\.rs:'
failure_diagnostic = 'runtime SIMD detection is forbidden outside the enumerated legacy sites (D4)'
