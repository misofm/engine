[package]
name = "console-workload"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# An `rlib`, for the reason `wasm-gate-corpus` is one: the native bench links this
# subject directly, and the `cdylib` wasm guest links the very same code. A subject that existed
# twice would be two subjects, and their ratio would measure the transcription.
[lib]
name = "console_workload"
path = "src/lib.rs"

# Every dependency here builds for `wasm32-unknown-unknown` unchanged, which is the finding that
# made this port a tooling change rather than a crate change. None of them is target-conditional.
[dependencies]
bench-support.workspace = true
builtins.workspace = true
builtins-compiler.workspace = true
engine = { workspace = true, features = ["realtime-audit"] }
effect-compiler.workspace = true
effect-contract.workspace = true
graph.workspace = true
graph-compiler.workspace = true
lane.workspace = true
session.workspace = true

[lints]
workspace = true
