[package]
name = "bench"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "bench"
path = "src/main.rs"

[dependencies]
bench-support.workspace = true
builtins.workspace = true
builtins-compiler.workspace = true
conformance.workspace = true
# The swap subject (#1286): sessions prepared, successors prepared warm and published through
# host-core, as the C ABI prepares them.
controls.workspace = true
# The console subject itself. It lives in its own crate so the wasm console arm's guest can link
# the identical code (#163 phase 2 step 1); this crate holds the clock, the percentiles and the
# records, which is everything the guest cannot have.
console-workload.workspace = true
engine = { workspace = true, features = ["realtime-audit"] }
effect-compiler.workspace = true
effect-contract.workspace = true
graph.workspace = true
graph-compiler.workspace = true
# `control-provider`: `publish_primed`, the production publication of a warm candidate (#1403).
host-core = { workspace = true, features = ["control-provider"] }
lane.workspace = true
session.workspace = true
sha2.workspace = true

# Issue #938: the bench pins its render thread and the live row's producer thread. Linux-only, as
# thread pinning is; rustix's affinity calls are safe wrappers, so the bench owns no `unsafe`.
# Already in `Cargo.lock` at this version.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.4", default-features = false, features = ["std", "thread"] }

[features]
default = []

[lints]
workspace = true
