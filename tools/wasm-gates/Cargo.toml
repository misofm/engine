[package]
name = "wasm-gates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "wasm_gates"

[[bin]]
name = "wasm_gates"
path = "src/main.rs"

[dependencies]
# The one shared bench harness (#104 F4): the nearest-rank percentile and the timed region the
# #163 phase 0b timing arm reports through. `scripts/check-bench-policy.sh` fails if a second copy
# of either reappears under `tools/`, so this edge is what keeps this crate from growing one.
bench-support.workspace = true
builtins.workspace = true
compressor.workspace = true
effect-runtime.workspace = true
gate-expander.workspace = true
lane.workspace = true
math = { workspace = true, features = ["lane"] }
parametric-eq.workspace = true
soft-clip.workspace = true
true-peak-limiter.workspace = true
wasm-gate-corpus.workspace = true
# Gate G5's WebAssembly runtime. Apache-2.0 WITH LLVM-exception (wasmtime and the Cranelift
# backend it embeds). Pinned exactly: a runtime upgrade may change which relaxed or post-MVP
# proposals validate, and this gate's whole job is to reject a module that uses one.
#
# This dependency belongs to this dev/tooling crate alone. No engine crate, host or fixture may
# reach a WebAssembly runtime (master plan §3.6, and AGENTS.md: the render callback never invokes
# a general-purpose Wasm runtime).
wasmtime = { version = "=47.0.3", default-features = false, features = ["runtime", "cranelift", "std"] }

[lints]
workspace = true
