[package]
name = "audit"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "audit"
path = "src/main.rs"

[dependencies]
bench-support.workspace = true
builtins.workspace = true
builtins-compiler.workspace = true
capi.workspace = true
compressor.workspace = true
conformance.workspace = true
de-esser.workspace = true
engine = { workspace = true, features = ["realtime-audit"] }
delay.workspace = true
dsp-reference.workspace = true
dynamic-eq.workspace = true
# `test-support`: the builtins-graph and fixture audits admit the conformance delay as a console
# slot through `prepare_native_session_effects_with_console_eligibility` (#1093 verdict L2).
effect-compiler = { workspace = true, features = ["test-support"] }
effect-contract.workspace = true
gate-expander.workspace = true
graph = { workspace = true, features = ["test-support"] }
graph-compiler.workspace = true
lane.workspace = true
parametric-eq.workspace = true
protocol = { workspace = true, features = ["test-support"] }
session.workspace = true
sha2.workspace = true
# #2205: the C ABI leg submits a session seek's runway, sized by the engine's one formula.
source.workspace = true

[features]
default = []

[lints]
workspace = true
