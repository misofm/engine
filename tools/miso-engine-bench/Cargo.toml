[package]
name = "miso-engine-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "miso_engine_bench"
path = "src/main.rs"

[dependencies]
flatbuffers = "=25.12.19" # Comparison tool only; no engine/runtime target dependency.
miso-engine-bench-support.workspace = true
miso-engine-protocol.workspace = true
miso-engine-session.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
miso-engine-builtins.workspace = true
miso-engine-builtins-compiler.workspace = true
miso-engine-conformance.workspace = true
miso-engine-core = { workspace = true, features = ["realtime-audit"] }
miso-engine-effect-compiler.workspace = true
miso-engine-effect-contract.workspace = true
miso-engine-effect-package.workspace = true
miso-engine-graph = { workspace = true, features = ["test-support"] }
miso-engine-graph-compiler.workspace = true
miso-engine-lane.workspace = true
miso-engine-rack.workspace = true
sha2.workspace = true

[features]
default = []

[lints]
workspace = true
