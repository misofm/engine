[package]
name = "miso-engine-parameter-metadata"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
# The crate gained a second binary (`lattice_oracle`) with issue #243, which makes a bare
# `cargo run -p miso-engine-parameter-metadata` ambiguous. Every existing call site --
# `scripts/build-web-audioworklet.sh`, `check-web-audioworklet.sh`, `test-web-audioworklet.sh` --
# means the metadata generator, so it stays the default and the oracle is opt-in by `--bin`.
default-run = "miso_engine_parameter_metadata"

[lib]
name = "miso_engine_parameter_metadata"
path = "src/lib.rs"

[[bin]]
name = "miso_engine_parameter_metadata"
path = "src/main.rs"

# The SDK's agent-ops cross-check driver. It is a bin rather than an example because it is a tool
# a person runs to answer a question, not a demonstration of the library.
[[bin]]
name = "lattice_oracle"
path = "src/bin/lattice_oracle.rs"

[dependencies]
miso-engine-bench-support.workspace = true
miso-engine-builtins.workspace = true
miso-engine-effect-compiler.workspace = true
miso-engine-effect-contract.workspace = true
miso-engine-host-web.workspace = true

[dependencies.sha2]
workspace = true

[dev-dependencies]
miso-engine-host-core.workspace = true

[lints]
workspace = true
