[package]
name = "parameter-metadata"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
# The crate gained a second binary (`lattice_oracle`) with issue #243, which makes a bare
# `cargo run -p parameter-metadata` ambiguous. Every existing call site --
# `scripts/build-web-audioworklet.sh`, `check-web-audioworklet.sh`, `test-web-audioworklet.sh` --
# means the metadata generator, so it stays the default and the oracle is opt-in by `--bin`.
default-run = "parameter_metadata"

[lib]
name = "parameter_metadata"
path = "src/lib.rs"

[[bin]]
name = "parameter_metadata"
path = "src/main.rs"

# The SDK's agent-ops cross-check driver. It is a bin rather than an example because it is a tool
# a person runs to answer a question, not a demonstration of the library.
[[bin]]
name = "parameter_metadata_lattice_oracle"
path = "src/bin/lattice_oracle.rs"

[dependencies]
bench-support.workspace = true
builtins.workspace = true
controls.workspace = true
effect-compiler.workspace = true
effect-contract.workspace = true
host-core.workspace = true
host-web.workspace = true
session.workspace = true
# The canonical writer corpus manifest is read as data.
serde_json = "=1.0.151"

[dependencies.sha2]
workspace = true

[dev-dependencies]
# Test-only (#1615): `tests/control_command_heap.rs` drives host-web's control command with
# `protocol` frames and measures its peak heap with `bench_support::alloc`. It lives here because
# `scripts/check-bench-policy.sh` keeps `bench-support` out of every `hosts/` package, dev
# dependencies included, and this tool already links both host-web and bench-support.
protocol.workspace = true
# Test-only: `host_core::verify_stages(false)` turns off the debug stage oracle, so the heap numbers
# are the release path's.
host-core = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
