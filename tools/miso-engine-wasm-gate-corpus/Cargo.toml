[package]
name = "miso-engine-wasm-gate-corpus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# An `rlib`, deliberately: this crate is linked by both legs of gate G5 -- natively into
# `miso-engine-wasm-gates`, and through `miso-engine-wasm-gate-guest` into the `wasm32` module.
# The `cdylib` lives in the guest, because a lib target that emits one is compiled with the
# release profile's `panic = "abort"` and could then not be linked into an unwinding test harness.
[lib]
name = "miso_engine_wasm_gate_corpus"

[dependencies]
miso-engine-builtins.workspace = true
miso-engine-delay.workspace = true
miso-engine-effect-runtime.workspace = true
miso-engine-gate-expander.workspace = true
miso-engine-lane.workspace = true
miso-engine-math = { workspace = true, features = ["lane"] }
# The wave-2 effect crates whose corpora this gate replays; their pins live in those crates,
# so the wasm leg replays the gate rather than a copy of it.
miso-engine-multiband-compressor.workspace = true
miso-engine-parametric-eq.workspace = true
miso-engine-soft-clip.workspace = true
miso-engine-transient-shaper.workspace = true
sha2.workspace = true

[lints]
workspace = true
