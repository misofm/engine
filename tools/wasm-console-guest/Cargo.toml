[package]
name = "wasm-console-guest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# `cdylib` only, exactly as `wasm-gate-guest` is: this is the artifact
# `wasm32-unknown-unknown` links into the module wasmtime instantiates. The subject it drives lives
# in `console-workload`, an `rlib`, so the native leg of the comparison links the
# identical code rather than a transcription of it.
[lib]
name = "wasm_console_guest"
crate-type = ["cdylib"]

[dependencies]
bench-support.workspace = true
console-workload.workspace = true
lane.workspace = true

[lints]
workspace = true
