[package]
name = "miso-engine-graph-audit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "miso_engine_graph_audit"
path = "src/main.rs"

[[bin]]
name = "miso_engine_graph_audit_parametric_eq"
path = "src/parametric_eq_main.rs"

[[bin]]
name = "miso_engine_graph_audit_delay"
path = "src/delay_main.rs"

[[bin]]
name = "miso_engine_graph_audit_gate_expander"
path = "src/gate_expander_main.rs"

# Issue #88 E10: the compressor's allocation audit. A separate binary because each one installs its
# own global allocator.
[[bin]]
name = "miso_engine_graph_audit_compressor"
path = "src/compressor_main.rs"

[dependencies]
miso-engine-bench-support.workspace = true
miso-engine-lane.workspace = true
miso-engine-compressor.workspace = true
miso-engine-core = { workspace = true, features = ["realtime-audit"] }
miso-engine-delay.workspace = true
miso-engine-effect-contract.workspace = true
miso-engine-gate-expander.workspace = true
miso-engine-graph.workspace = true
miso-engine-parametric-eq.workspace = true

[lints]
workspace = true
