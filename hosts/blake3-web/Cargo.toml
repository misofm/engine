[package]
name = "blake3-web"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Issue #2111: the browser's WebAssembly SIMD BLAKE3-256 for the stem identities. `cdylib` only:
# `scripts/build-web-audioworklet.sh` builds it for `wasm32-unknown-unknown` on the
# `[browser-artifact]` nightly with `+simd128` and ships it as `miso-engine-v1-blake3.simd128.wasm`
# beside `stem-store/incremental-blake3.js`, which loads it. Nothing links it as a Rust library.
[lib]
name = "blake3_web"
crate-type = ["cdylib"]

[dependencies]
blake3.workspace = true

[lints]
workspace = true
