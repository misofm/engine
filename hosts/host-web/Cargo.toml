[package]
name = "host-web"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "host_web"
crate-type = ["rlib", "cdylib"]

# The compile pipeline lives in `host-core` (#103); this crate keeps only the render
# types it names in its own ABI and the facade. `builtins-compiler`,
# `-effect-compiler`, `-graph`, `-graph-compiler`, `-session`, `-source` and `-target-smoke` were
# direct dependencies of the deleted second copy of that pipeline (#106 F1).
# `-builtins` and `-builtins-compiler` came back as direct dependencies with issue #137: the live
# controls' record types (`Matrix2x2`, `TrackControlRecord`, `MeterSnapshot`) are named by this
# crate's own ABI, exactly as the render types are. The compile pipeline still lives entirely in
# `host-core`.
# `-effect-contract` joins them for the same reason with issue #140: `EffectControlRecord` and
# the parameter descriptors an effect-addressed command is validated against are named by this
# crate's ABI. It is the *contract* crate, not the effect compiler -- `EffectControlProducer` is
# re-exported by `host-core`, so the compile pipeline stays where #106 F1 put it.
[dependencies]
builtins.workspace = true
builtins-compiler.workspace = true
controls.workspace = true
engine.workspace = true
effect-contract.workspace = true
host-core.workspace = true
session.workspace = true
# Issue #143 R4: the one linear-to-decibel conversion the design permits, on the control plane.
math.workspace = true

[dev-dependencies]
# Dev-only (#1364 gate 3): `tests/control_smoothing_parity.rs` links the C ABI beside this host and
# feeds both the same session and the same edits with no per-edit length, encoded with `protocol`
# (below). Never linked into the browser artifact: a dev-dependency does not reach `-p host-web`'s
# release build.
capi.workspace = true
# Dev-only: `tests/retained_ceilings.rs` picks each budget by the native lane width (#1060).
lane.workspace = true
# Dev-only: `tests/strip_cells_cross_host.rs` drives the control plane the C ABI embeds beside the
# browser host, to prove the two admissions and drains agree (#1399). The control plane's command
# frames are encoded with `protocol`. Neither is linked into the browser artifact.
control-plane.workspace = true
protocol.workspace = true
# Dev-only: the native leg of the #106 F4 native<->simd128 session parity gate digests its rendered
# PCM the same way the raw-Wasm oracle does. Never linked into the browser artifact.
sha2.workspace = true
serde_json = "=1.0.151"

[features]
default = []
test-support = ["builtins-compiler/test-support", "host-core/test-support"]

[lints]
workspace = true
