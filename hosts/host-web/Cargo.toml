[package]
name = "host-web"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "host_web"
crate-type = ["rlib", "cdylib"]

# The compile pipeline lives in `host-core` (#103); this crate keeps only the render
# types it names in its own ABI and the facade. `builtins-compiler`,
# `-effect-compiler`, `-graph`, `-graph-compiler`, `-session`, `-source` and `-target-smoke` were
# direct dependencies of the deleted second copy of that pipeline (#106 F1).
# `-builtins` and `-builtins-compiler` came back as direct dependencies with issue #137: the live
# controls' record types (`Matrix2x2`, `TrackControlRecord`, `MeterSnapshot`) are named by this
# crate's own ABI, exactly as the render types are. The compile pipeline still lives entirely in
# `host-core`.
# `-effect-contract` joins them for the same reason with issue #140: `EffectControlRecord` and
# the parameter descriptors an effect-addressed command is validated against are named by this
# crate's ABI. It is the *contract* crate, not the effect compiler -- `EffectControlProducer` is
# re-exported by `host-core`, so the compile pipeline stays where #106 F1 put it.
# The browser's preparer implements `control_plane::RuntimePreparer` (#1400 D5), so this crate names
# the control plane's trait and its bound-cache type.
[dependencies]
builtins.workspace = true
builtins-compiler.workspace = true
control-plane.workspace = true
controls.workspace = true
engine.workspace = true
effect-contract.workspace = true
host-core.workspace = true
session.workspace = true
# Issue #143 R4: the one linear-to-decibel conversion the design permits, on the control plane.
math.workspace = true

[dev-dependencies]
# Dev-only (#1560): `tests/control_parity.rs` links the C ABI beside this host and feeds both the
# same session and the same control edits, encoded with `protocol` (below); it absorbed #1364's
# `control_smoothing_parity.rs`. Never linked into the browser artifact: a dev-dependency does not
# reach `-p host-web`'s release build.
capi.workspace = true
# The tests name `protocol` directly: its command frames drive the control plane the C ABI embeds
# beside the browser host (`tests/control_parity.rs`, #1560, which absorbed #1399's
# `strip_cells_cross_host.rs`). The browser artifact links `protocol` already, through the control
# plane (a normal dependency above, #1400 D5), so this line adds nothing to it.
protocol.workspace = true
# Dev-only: the native leg of the #106 F4 native<->simd128 session parity gate digests its rendered
# PCM the same way the raw-Wasm oracle does. Never linked into the browser artifact.
sha2.workspace = true
serde_json = "=1.0.151"
# Issue #2219: the dense gate shape's one builder (`session::test_support::dense_document`), for
# `tests/boot_transient_budget.rs` and `examples/dense_document.rs`. Dev-only: the browser artifact
# never links it.
session = { workspace = true, features = ["test-support"] }

[features]
default = []
# `control-plane/test-support` and `engine/test-support` let the timeline test reader reach the
# active plan (`PlanState::test_owner_mut`, `RealtimePlanOwner::active_plan_mut`, #1643).
test-support = [
    "builtins-compiler/test-support",
    "control-plane/test-support",
    "engine/test-support",
    "host-core/test-support",
]
# Issue #1529: the render-lock probe export, the positive control of the render-allocation gates.
# Off by default and never in a shipped build: `build-web-audioworklet.sh --render-lock-probe`
# builds a separately named, never-delivered module with it, and the native leg below needs it.
render-lock-probe = []

[[test]]
name = "render_locked_positive_control"
required-features = ["render-lock-probe"]

[lints]
workspace = true
