[package]
name = "miso-engine-host-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "miso_engine_host_web"
crate-type = ["rlib", "cdylib"]

# The compile pipeline lives in `miso-engine-host-core` (#103); this crate keeps only the render
# types it names in its own ABI and the facade. `miso-engine-builtins-compiler`,
# `-effect-compiler`, `-graph`, `-graph-compiler`, `-session`, `-source` and `-target-smoke` were
# direct dependencies of the deleted second copy of that pipeline (#106 F1).
# `-builtins` and `-builtins-compiler` came back as direct dependencies with issue #137: the live
# console's record types (`Matrix2x2`, `TrackControlRecord`, `MeterSnapshot`) are named by this
# crate's own ABI, exactly as the render types are. The compile pipeline still lives entirely in
# `miso-engine-host-core`.
# `-effect-contract` joins them for the same reason with issue #140: `EffectControlRecord` and
# the parameter descriptors an effect-addressed command is validated against are named by this
# crate's ABI. It is the *contract* crate, not the effect compiler -- `EffectControlProducer` is
# re-exported by `miso-engine-host-core`, so the compile pipeline stays where #106 F1 put it.
[dependencies]
miso-engine-builtins.workspace = true
miso-engine-builtins-compiler.workspace = true
miso-engine-core.workspace = true
miso-engine-effect-contract.workspace = true
miso-engine-host-core.workspace = true
miso-engine-session.workspace = true
# Issue #143 R4: the one linear-to-decibel conversion the design permits, on the control plane.
miso-engine-math.workspace = true

[dev-dependencies]
# Dev-only: the native leg of the #106 F4 native<->simd128 session parity gate digests its rendered
# PCM the same way the raw-Wasm oracle does. Never linked into the browser artifact.
sha2.workspace = true

[features]
default = []

[lints]
workspace = true
