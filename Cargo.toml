[workspace]
members = [
    "crates/miso-engine-core",
    "crates/miso-engine-session",
    "crates/miso-engine-effect-contract",
    "crates/miso-engine-effect-compiler",
    "crates/miso-engine-effect-package",
    "crates/miso-engine-builtins",
    "crates/miso-engine-builtins-compiler",
    "crates/miso-engine-graph",
    "crates/miso-engine-graph-compiler",
    "crates/miso-engine-protocol",
    "crates/miso-engine-capi",
    "crates/miso-engine-target-smoke",
    "crates/miso-engine-dsp-reference",
    "crates/miso-engine-conformance",
    "hosts/miso-engine-host-native",
    "hosts/miso-engine-host-mobile",
    "hosts/miso-engine-host-web",
    "tools/miso-engine-bootstrap-bench",
    "tools/miso-engine-conformance-bench",
    "tools/miso-engine-realtime-audit",
    "tools/miso-engine-protocol-audit",
    "tools/miso-engine-protocol-bench",
    "tools/miso-engine-session-bench",
    "tools/miso-engine-effect-contract-bench",
    "tools/miso-engine-graph-audit",
    "tools/miso-engine-graph-bench",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
publish = false
version = "0.1.0"

[workspace.dependencies]
miso-engine-core = { path = "crates/miso-engine-core", version = "0.1.0" }
miso-engine-target-smoke = { path = "crates/miso-engine-target-smoke", version = "0.1.0" }
miso-engine-dsp-reference = { path = "crates/miso-engine-dsp-reference", version = "0.1.0" }
miso-engine-conformance = { path = "crates/miso-engine-conformance", version = "0.1.0" }
miso-engine-session = { path = "crates/miso-engine-session", version = "0.1.0" }
miso-engine-protocol = { path = "crates/miso-engine-protocol", version = "0.1.0" }
miso-engine-effect-contract = { path = "crates/miso-engine-effect-contract", version = "0.1.0" }
miso-engine-effect-compiler = { path = "crates/miso-engine-effect-compiler", version = "0.1.0" }
miso-engine-effect-package = { path = "crates/miso-engine-effect-package", version = "0.1.0" }
miso-engine-builtins = { path = "crates/miso-engine-builtins", version = "0.1.0" }
miso-engine-builtins-compiler = { path = "crates/miso-engine-builtins-compiler", version = "0.1.0" }
miso-engine-graph = { path = "crates/miso-engine-graph", version = "0.1.0" }
miso-engine-graph-compiler = { path = "crates/miso-engine-graph-compiler", version = "0.1.0" }
sha2 = { version = "=0.11.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"
unreachable_pub = "deny"
unused_must_use = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[workspace.lints.clippy]
all = "deny"
correctness = "deny"
suspicious = "deny"
perf = "deny"
undocumented_unsafe_blocks = "deny"
