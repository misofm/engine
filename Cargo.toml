    "crates/lane",
    "crates/math",
    "crates/session",
    "crates/source",
    "crates/effect-contract",
    "crates/effect-runtime",
    "crates/parametric-eq",
    "crates/compressor",
    "crates/multiband-compressor",
    "crates/gate-expander",
    "crates/true-peak-limiter",
    "crates/soft-clip",
    "crates/transient-shaper",
    "crates/delay",
    "crates/effect-compiler",
    "crates/rack",
    "crates/rack-compiler",
    "crates/effect-package",
    "crates/builtins",
    "crates/builtins-compiler",
    "crates/graph",
    "crates/graph-compiler",
    "crates/host-core",
    "crates/protocol",
    "crates/capi",
    "crates/target-smoke",
    "crates/dsp-reference",
    "crates/conformance",
    "hosts/host-native",
    "hosts/host-mobile",
    "hosts/host-web",
    "tools/bench-support",
    "tools/bench",
    "tools/console-workload",
    "tools/audit",
    "tools/native-pcm-runner",
    "tools/stem-hasher",
    "tools/stem-publisher",
    "tools/catalog-migrate",
    "tools/wasm-gate-corpus",
    "tools/wasm-gate-guest",
    "tools/wasm-console-guest",
    "tools/wasm-console",
    "tools/parameter-metadata",
    "tools/session-validator",
    "tools/wasm-gates",
    "sidecars/flac-decoder",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
publish = false
version = "0.1.0"

[workspace.dependencies]
engine = { path = "crates/engine", version = "0.1.0" }
lane = { path = "crates/lane", version = "0.1.0" }
math = { path = "crates/math", version = "0.1.0" }
target-smoke = { path = "crates/target-smoke", version = "0.1.0" }
dsp-reference = { path = "crates/dsp-reference", version = "0.1.0" }
conformance = { path = "crates/conformance", version = "0.1.0" }
flac-decoder = { path = "sidecars/flac-decoder", version = "0.1.0" }
session = { path = "crates/session", version = "0.1.0" }
source = { path = "crates/source", version = "0.1.0" }
protocol = { path = "crates/protocol", version = "0.1.0" }
capi = { path = "crates/capi", version = "0.1.0" }
effect-contract = { path = "crates/effect-contract", version = "0.1.0" }
effect-runtime = { path = "crates/effect-runtime", version = "0.1.0" }
parametric-eq = { path = "crates/parametric-eq", version = "0.1.0" }
compressor = { path = "crates/compressor", version = "0.1.0" }
multiband-compressor = { path = "crates/multiband-compressor", version = "0.1.0" }
gate-expander = { path = "crates/gate-expander", version = "0.1.0" }
true-peak-limiter = { path = "crates/true-peak-limiter", version = "0.1.0" }
soft-clip = { path = "crates/soft-clip", version = "0.1.0" }
transient-shaper = { path = "crates/transient-shaper", version = "0.1.0" }
delay = { path = "crates/delay", version = "0.1.0" }
effect-compiler = { path = "crates/effect-compiler", version = "0.1.0" }
rack = { path = "crates/rack", version = "0.1.0" }
rack-compiler = { path = "crates/rack-compiler", version = "0.1.0" }
effect-package = { path = "crates/effect-package", version = "0.1.0" }
builtins = { path = "crates/builtins", version = "0.1.0" }
builtins-compiler = { path = "crates/builtins-compiler", version = "0.1.0" }
graph = { path = "crates/graph", version = "0.1.0" }
graph-compiler = { path = "crates/graph-compiler", version = "0.1.0" }
host-core = { path = "crates/host-core", version = "0.1.0" }
host-web = { path = "hosts/host-web", version = "0.1.0" }
bench-support = { path = "tools/bench-support", version = "0.1.0" }
console-workload = { path = "tools/console-workload", version = "0.1.0" }
wasm-gate-corpus = { path = "tools/wasm-gate-corpus", version = "0.1.0" }
wasm-gate-guest = { path = "tools/wasm-gate-guest", version = "0.1.0" }
stem-hasher = { path = "tools/stem-hasher", version = "0.1.0" }
flacenc = { version = "=0.5.1", default-features = false }
sha2 = { version = "=0.11.0", default-features = false }
symphonia = { version = "=0.6.1", default-features = false, features = ["flac"] }
wide = { version = "=1.6.1", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "deny"
unreachable_pub = "deny"
unused_must_use = "deny"
# `miso_wasm_simd8` is issue #183's eight-lane wasm measurement build (see
# `crates/lane/src/backend.rs`). Declaring it here is what keeps a typo in the flag a
# warning rather than a silent W4 run reported as a W8 number.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)', 'cfg(miso_wasm_simd8)'] }

[workspace.lints.clippy]
all = "deny"
correctness = "deny"
suspicious = "deny"
perf = "deny"
undocumented_unsafe_blocks = "deny"

# Master plan #83 D12. One release profile for every artifact the engine ships, so a benchmark, a
# CI probe and a shipped host all measure and execute the same code.
#
# `lto = "fat"` and `codegen-units = 1` exist for one reason: the block kernels of
# `crates/lane` are `#[inline(always)]` generic bodies that a consumer instantiates at
# its own lane width. They only become the intended straight-line loop when the optimizer can see
# across crate boundaries. `debug = 1` keeps line tables so a profile or a core dump names a
# kernel, and costs build time and artifact size, never speed.
#
# `panic = "abort"` is the audible decision: a panic on a render thread has no recovery worth the
# unwinding machinery, and an unwind through a C or Wasm frame is not defined by either ABI. It
# changes what `catch_unwind` does in release builds -- see docs/REALTIME_DEPENDENCY_POLICY.md,
# "Panic behaviour by profile". Cargo ignores this setting when it builds a test or benchmark
# harness, so `cargo test --release` still unwinds and `#[should_panic]` still works.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 1

# Benchmarks measure the shipped profile, never a separately tuned one.
[profile.bench]
inherits = "release"
