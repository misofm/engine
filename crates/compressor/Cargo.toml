[package]
name = "compressor"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "compressor"

[dependencies]
effect-contract.workspace = true
effect-runtime.workspace = true
lane.workspace = true
math = { workspace = true, features = ["lane"] }

[dev-dependencies]
# Issue #105 phase 2: the workspace's one audited global allocator (#104 phase B). It is what
# makes the conformance harness's `process.allocation` gate a real measurement; the harness
# refuses to run without it.
bench-support.workspace = true
# The independent f64 oracle is test-only and never reachable from production code.
dsp-reference.workspace = true
# Frozen SplitMix64 fixture generator for the timing example and the eval corpora.
conformance = { workspace = true, features = ["realtime-audit"] }
# Cross-target digest gate (E4). Never a production dependency.
sha2.workspace = true

[lints]
workspace = true
