[package]
name = "dynamic-eq"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "dynamic_eq"

[dependencies]
effect-contract.workspace = true
effect-runtime.workspace = true
# `parametric_eq::design_svf` takes the rate as `engine::SampleRateHz`.
engine.workspace = true
lane.workspace = true
math = { workspace = true, features = ["lane"] }
# Each band's pole words are the EQ's own bell design at the static gain (issue #17 S1).
parametric-eq.workspace = true

[dev-dependencies]
# The workspace's one audited global allocator: it makes the conformance harness's
# `process.allocation` gate a real measurement; the harness refuses to run without it.
bench-support.workspace = true
conformance = { workspace = true, features = ["realtime-audit"] }
# The independent f64 oracle is test-only and never reachable from production code.
dsp-reference.workspace = true

[lints]
workspace = true
