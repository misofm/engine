[package]
name = "control-plane"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "control_plane"

[features]
default = []
# Observers and fault hooks for the adapters' own tests (#1309 D8). Never enabled by a product
# build: capi turns it on from its `[dev-dependencies]` only.
test-support = ["host-core/test-support"]

[dependencies]
controls.workspace = true
engine.workspace = true
effect-contract.workspace = true
host-core = { workspace = true, features = ["control-provider"] }
# #1709 D1: every control entry composes level values in `lane::CanonicalFpEnv`.
lane.workspace = true
# #2115: the session's output loudness meter and its dBTP conversion.
loudness.workspace = true
math.workspace = true
protocol.workspace = true
session.workspace = true
# #1386 D3: the `SESSION_REPLACE` document digest.
sha2.workspace = true
source.workspace = true

[dev-dependencies]
# #1685 gate 3: the admission allocation count, by the audited allocator's thread counters.
bench-support.workspace = true
# Issue #2219: the dense gate shape's one builder, for `tests/session_replace.rs`.
session = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
