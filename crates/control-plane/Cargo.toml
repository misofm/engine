[package]
name = "control-plane"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "control_plane"

[features]
default = []
# Observers and fault hooks for the adapters' own tests (#1309 D8). Never enabled by a product
# build: capi turns it on from its `[dev-dependencies]` only.
test-support = ["host-core/test-support"]

[dependencies]
controls.workspace = true
engine.workspace = true
effect-contract.workspace = true
host-core = { workspace = true, features = ["control-provider"] }
# TBD48 D1: every control entry composes level values in `lane::CanonicalFpEnv`.
lane.workspace = true
protocol.workspace = true
session.workspace = true
source.workspace = true

[dev-dependencies]
# #1685 gate 3: the admission allocation count, by the audited allocator's thread counters.
bench-support.workspace = true

[lints]
workspace = true
