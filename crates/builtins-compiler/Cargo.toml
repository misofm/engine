[package]
name = "builtins-compiler"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "builtins_compiler"

[dependencies]
# #1646: stored fader automation is compiled into a cell program at preparation.
automation.workspace = true
controls.workspace = true
lane.workspace = true
engine.workspace = true
session.workspace = true
graph.workspace = true
builtins.workspace = true
rack.workspace = true
rack-compiler.workspace = true
effect-contract.workspace = true
sha2.workspace = true

[dev-dependencies]
# Issue #1765: the builtin lane-swap chain test counts the swap's allocations with the audited
# allocator's thread counters.
bench-support.workspace = true
# Issue #1059: this crate's own tests drive the whole-plan scalar oracle, which needs
# `Backend::Scalar` and the graph's scalar pairing passes; both are test-support only.
lane = { workspace = true, features = ["test-support"] }
graph = { workspace = true, features = ["test-support"] }

[features]
# `lane/test-support` because the per-node strip owners this feature compiles exist for the
# test-only `Backend::Scalar` oracle (issue #1059), and `graph/test-support` because they reach
# the graph's scalar pairing passes.
test-support = ["builtins/test-support", "graph/test-support", "lane/test-support"]

[lints]
workspace = true
