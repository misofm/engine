[package]
name = "protocol"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "protocol"

[features]
default = []
test-support = []

[dependencies]
controls.workspace = true
engine.workspace = true
session.workspace = true

[dev-dependencies]
conformance.workspace = true
# The integration tests name the row-by-name helpers (`control_core::row_address` and the edit
# lists), which only `test-support` builds.
protocol = { workspace = true, features = ["test-support"] }

# Issue #2359: the token lease model (`token_lease_loom`) runs under `--cfg loom`, in this crate's
# own test build alone (`cfg(all(loom, test))`); a dependent's loom build keeps `std`'s atomics.
[target.'cfg(loom)'.dev-dependencies]
loom = "=0.7.2"

[lints]
workspace = true
