[package]
name = "miso-engine-conformance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "miso_engine_conformance"

[dependencies]
miso-engine-lane.workspace = true
miso-engine-core.workspace = true
miso-engine-dsp-reference.workspace = true
miso-engine-effect-contract.workspace = true

[features]
default = []
# #84 phase D: forwarding opt-in. A regular dependent of this crate never receives core's
# render-audit instrumentation unless it asks; `scripts/check-realtime-audit-leak.sh` proves the
# default graphs of every shippable package stay clean.
realtime-audit = ["miso-engine-core/realtime-audit"]

[dev-dependencies]
# This crate's own tests assert that fault probes are DETECTED, so they need the real hooks.
miso-engine-core = { workspace = true, features = ["realtime-audit"] }
# Issue #105 phase 2: the workspace's one audited global allocator (#104 phase B). The harness's
# allocation gate is a `GlobalAlloc` measurement, so the test binary that exercises it has to
# install one. Test-only: `check-conformance-boundaries.sh` still pins `[dependencies]` exactly.
miso-engine-bench-support.workspace = true

[lints]
workspace = true
