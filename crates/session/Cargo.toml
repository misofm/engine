[package]
name = "session"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "session"

[features]
default = []
# Issue #2219: the dense gate shape (`test_support::dense_document`), one builder for the tests and
# the example that boot or replace it. Dev-only: only `[dev-dependencies]` turn it on.
test-support = []

[dependencies]
# The segment time bound: one constant, `automation::TIME_LIMIT`, for the validator and the builder.
automation.workspace = true
engine.workspace = true
json-syntax = { version = "=0.12.5", default-features = false }

[dev-dependencies]
# #1696: the audited allocator's thread-scoped live bytes, for the edit-ramp ceiling test only.
bench-support.workspace = true
jsonschema = { version = "=0.33.0", default-features = false }
serde_json = "=1.0.151"

[lints]
workspace = true
