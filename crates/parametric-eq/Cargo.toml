[package]
name = "parametric-eq"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "parametric_eq"

[dependencies]
engine.workspace = true
effect-contract.workspace = true
effect-runtime.workspace = true
lane.workspace = true
math.workspace = true

[dev-dependencies]
# Issue #105 phase 2: the workspace's one audited global allocator (#104 phase B). It is what
# makes the conformance harness's `process.allocation` gate a real measurement; the harness
# refuses to run without it.
bench-support.workspace = true
# Test-only independent f64 oracle; production code has no dependency on this crate.
dsp-reference.workspace = true
# Issue #95 eval E6: the shared effect-contract conformance harness, run against a real effect.
conformance = { workspace = true, features = ["realtime-audit"] }
lane.workspace = true
sha2.workspace = true

[lints]
workspace = true
