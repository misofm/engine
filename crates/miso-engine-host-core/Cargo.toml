[package]
name = "miso-engine-host-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "miso_engine_host_core"
crate-type = ["rlib"]

[dependencies]
miso-engine-builtins.workspace = true
miso-engine-builtins-compiler.workspace = true
miso-engine-core.workspace = true
miso-engine-effect-compiler.workspace = true
miso-engine-effect-contract.workspace = true
miso-engine-graph.workspace = true
miso-engine-graph-compiler.workspace = true
# Issue #146: the canonical floating-point environment guard and the render-thread attestation.
# The lane crate is already in every host's link graph; naming it here is what lets the facade own
# the one started-session handle instead of each host re-deriving the pin.
miso-engine-lane.workspace = true
miso-engine-session.workspace = true
miso-engine-source.workspace = true

[dev-dependencies]
miso-engine-builtins.workspace = true
miso-engine-builtins-compiler.workspace = true
# Issue #143 E2: the observation eval compares a bank lane's published reduction against an
# independently prepared scalar instance of the same effect. A dev-dependency only: nothing in the
# facade's own source knows a concrete effect crate.
miso-engine-compressor.workspace = true
miso-engine-source.workspace = true

[lints]
workspace = true
