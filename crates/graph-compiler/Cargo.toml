[package]
name = "graph-compiler"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "graph_compiler"

[dependencies]
# `Backend` is this crate's compile input and is re-exported (#84 phase A).
lane.workspace = true
engine.workspace = true
session.workspace = true
effect-contract.workspace = true
effect-compiler.workspace = true
graph.workspace = true
math.workspace = true
builtins.workspace = true
builtins-compiler.workspace = true
rack.workspace = true
rack-compiler.workspace = true
sha2.workspace = true

[dev-dependencies]
# Issue #1100: `tests/bypass_resources.rs` measures what a session bypass retains and what its
# render allocates with the workspace's one audited allocator. Test-only, as the bench policy allows.
bench-support.workspace = true
builtins-compiler = { workspace = true, features = ["test-support"] }
conformance = { workspace = true, features = ["realtime-audit"] }
# Test-only: `prepare_native_session_effects_with_console_eligibility` lets the conformance delay
# occupy a lowered console rack in the unit and `compile_shapes` suites (#1093 verdict L2).
effect-compiler = { workspace = true, features = ["test-support"] }
parametric-eq.workspace = true
# Test-only: `softfma::fma_f32_via_f64` is the independent oracle for the graph's folded route
# (master plan #83 D3/G3). The compiler itself never fuses.
lane.workspace = true

[lints]
workspace = true
