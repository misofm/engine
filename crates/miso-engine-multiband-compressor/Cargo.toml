[package]
name = "miso-engine-multiband-compressor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "miso_engine_multiband_compressor"

[dependencies]
miso-engine-effect-contract.workspace = true
miso-engine-effect-runtime.workspace = true
miso-engine-lane.workspace = true
miso-engine-math = { workspace = true, features = ["lane"] }

[dev-dependencies]
# Issue #105 phase 2: the workspace's one audited global allocator (#104 phase B). It is what
# makes the conformance harness's `process.allocation` gate a real measurement; the harness
# refuses to run without it.
miso-engine-bench-support.workspace = true
# Issue #105 phase 2: effect-contract conformance harness against the production factory.
miso-engine-conformance = { workspace = true, features = ["realtime-audit"] }
# Test-only independent f64 crossover oracle; production never links or calls it.
miso-engine-dsp-reference.workspace = true
sha2.workspace = true

[lints]
workspace = true
