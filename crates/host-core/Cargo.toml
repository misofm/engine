[package]
name = "host-core"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "host_core"
crate-type = ["rlib"]

[features]
default = []
control-provider = ["dep:protocol"]
test-support = [
  "effect-compiler/test-support",
  "builtins-compiler/test-support",
  "graph/test-support",
]

[dependencies]
builtins.workspace = true
builtins-compiler.workspace = true
controls.workspace = true
engine.workspace = true
effect-compiler.workspace = true
effect-contract.workspace = true
graph.workspace = true
graph-compiler.workspace = true
# Issue #146: the canonical floating-point environment guard and the render-thread attestation.
# The lane crate is already in every host's link graph; naming it here is what lets the facade own
# the one started-session handle instead of each host re-deriving the pin.
lane.workspace = true
math.workspace = true
microfft.workspace = true
protocol = { workspace = true, optional = true }
session.workspace = true
source.workspace = true

[dev-dependencies]
# #1646 D2 and #1709: `lane::fpenv::under_hostile_fp_env`, the hostile caller environment.
lane = { workspace = true, features = ["test-support"] }
# #1646 gate 2: the program builder's byte report is the charge a fader automation adds.
automation.workspace = true
bench-support.workspace = true
builtins.workspace = true
builtins-compiler = { workspace = true, features = ["test-support"] }
dsp-reference.workspace = true
# Issue #1609: the spectrum handoff model (`spectrum_handoff_loom`) runs under `--cfg loom`. Test and
# model-checking only; it is not reachable from production, Wasm, or render.
loom = "=0.7.2"
# Issue #143 E2: the observation eval compares a bank lane's published reduction against an
# independently prepared scalar instance of the same effect. A dev-dependency only: nothing in the
# facade's own source knows a concrete effect crate.
compressor.workspace = true
parametric-eq.workspace = true
source.workspace = true

[lints]
workspace = true
