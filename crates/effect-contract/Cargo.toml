[package]
name = "effect-contract"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "effect_contract"

[features]
default = []
# Issue #1469 D6: a process-global count of `tail_and_rest` evaluations in
# `NativeEffectRegistry::new`, read by host-core's `launch_registry_once` test.
test-support = []

[dependencies]
engine.workspace = true
lane.workspace = true
# Decision D6: no `f32`/`f64` transcendental method outside `math`. The contract's
# logarithmic parameter mapping and its `OnePole99` coefficient are the last four sites (issue #95
# finding F5). Default features only: the lane-wide layer is not needed here and would drag the
# AVX2-pinned lane crate into every control-plane consumer of the contract.
math.workspace = true

[dev-dependencies]
# Issue #1059: the backend-to-width test pins `for_backend(Backend::Scalar) == None`, and the
# scalar backend exists only with `lane/test-support`.
lane = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
