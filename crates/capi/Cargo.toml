[package]
name = "capi"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "capi"
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
default = []

[dependencies]
control-plane.workspace = true
engine.workspace = true
effect-contract.workspace = true
# #1400: `CapiPreparer` calls the two host-core preparation entries.
host-core.workspace = true
lane.workspace = true

[dev-dependencies]
bench-support.workspace = true
# #1556: the design-bound counters, for the input-design-bounds test only.
builtins = { workspace = true, features = ["test-support"] }
# #1309 D8: the control plane's observers and fault hooks, for capi's tests only. A dev-dependency
# feature never reaches the release `capi` build (`scripts/check-capi-abi.sh` builds `-p capi`).
control-plane = { workspace = true, features = ["test-support"] }
# TBD48: `lane::fpenv::under_hostile_fp_env`, the hostile caller environment of the live gate.
lane = { workspace = true, features = ["test-support"] }
# B16-R8: `RealtimePlanOwner::active_plan_mut`, so the #1642 gates read the active plan's
# timeline. A dev-dependency feature never reaches the release `capi` build.
engine = { workspace = true, features = ["test-support"] }
# #1639: the block's held jump lengths (`graph::test_only_block_jump_lengths`), for capi's tests only.
graph = { workspace = true, features = ["test-support"] }
# The tests write control values by row name (`control_core::{row_address, fader_edits, ...}`).
protocol = { workspace = true, features = ["test-support"] }
session.workspace = true
source.workspace = true

[lints]
workspace = true
