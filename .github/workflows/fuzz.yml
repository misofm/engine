name: fuzz

# The two bounded fuzz jobs (10,000 libFuzzer executions per target: a smoke test that the session
# and protocol decoders still refuse garbage the same way). Run by hand:
# `gh workflow run fuzz.yml --ref <branch>`. Nothing runs it on a pull request, a push or a schedule
# (docs/RELEASE.md). `nightly.yml`'s `deep-fuzz` job, also manual, runs every target with a far
# larger budget.
#
# The fuzz binaries link exactly the workspace crates engine, protocol and session
# (`fuzz/Cargo.toml` depends on session -> engine and protocol -> engine, session), so a change
# outside those crates, `fuzz/**`, `fixtures/session/v1/canonical.json`,
# `scripts/run-protocol-fuzz.sh`, the root manifest and the toolchain pin cannot change a fuzz
# outcome.

on:
  workflow_dispatch:

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.99.1

jobs:
  session-fuzz:
    name: bounded session parser and compiler fuzzing
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup toolchain install nightly-2026-08-20 --profile minimal
          cargo +1.99.1 install cargo-fuzz --locked --version 0.13.2
      - name: Build both fuzz targets
        run: cargo check --locked --manifest-path fuzz/Cargo.toml --bins
      - name: Run bounded parser fuzz target
        run: |
          mkdir -p target/ci/session-fuzz/parse
          export RUSTFLAGS='-C target-feature=+avx2,+fma'  # lane D4 guard; cargo-fuzz prepends this to its sanitizer flags
          cargo +nightly-2026-08-20 fuzz run session_parse target/ci/session-fuzz/parse -- -runs=10000 -seed=557074001 -seed_inputs=fixtures/session/v1/canonical.json
      - name: Run bounded compiler fuzz target
        run: |
          mkdir -p target/ci/session-fuzz/compile
          export RUSTFLAGS='-C target-feature=+avx2,+fma'
          cargo +nightly-2026-08-20 fuzz run session_compile target/ci/session-fuzz/compile -- -runs=10000 -seed=557074002 -seed_inputs=fixtures/session/v1/canonical.json

  protocol-fuzz:
    name: bounded issue-005 protocol decoder fuzzing
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust and cargo-fuzz toolchains
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup toolchain install nightly-2026-08-20 --profile minimal
          cargo +1.99.1 install cargo-fuzz --locked --version 0.13.2
      - name: Build bounded protocol fuzz targets
        run: cargo check --locked --manifest-path fuzz/Cargo.toml --bins
      - name: Run fixed-count native sanitizer fuzzing
        run: bash scripts/run-protocol-fuzz.sh
      - name: Upload protocol fuzz evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: protocol-fuzz-evidence
          path: target/ci/protocol-fuzz/evidence.json
