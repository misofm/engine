name: Release @misofm/engine

# One dispatch releases (docs/RELEASE.md): build the shipped AudioWorklet closure once, run the
# checks that guard what ships against exactly those bytes, pack one tarball from them, publish
# that tarball with npm provenance, verify the registry serves it, then record the release as the
# GitHub Release `v<version>` on the source commit.
#
#   gh workflow run npm-publish.yml -f version=patch                 # or minor, major, X.Y.Z
#   gh workflow run npm-publish.yml -f version=patch -f dry_run=true # everything but publishing
#
# The version is not committed: `sdk/package.json` carries 0.0.0-development and the package job
# stamps the release version into the tree it packs. The tag names the source commit, so a
# rebuild is `git checkout v<version>` plus the same stamp.
#
# Security: the npm trusted publisher (`npm trust`) is this file, `npm-publish.yml`, in
# misofm/engine. Only the `publish` job holds `id-token: write`, and only on `main`; only `record`
# holds `contents: write`, and it checks out and runs no repository code. No npm token is read.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "patch, minor, major, or an exact X.Y.Z above npm's latest"
        required: true
        default: patch
        type: string
      dry_run:
        description: "Run every check and `npm publish --dry-run`; publish nothing, tag nothing"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ inputs.dry_run && github.ref || 'publish' }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: "1.99.1"
  PACKAGE_NAME: "@misofm/engine"
  NPM_VERSION: "11.19.0"
  NPM_CONFIG_REGISTRY: "https://registry.npmjs.org"

jobs:
  prepare:
    name: resolve the release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Refuse a real release from anywhere but main
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" != true && "$GITHUB_REF" != refs/heads/main ]]; then
            echo "a release must be dispatched on main; use dry_run=true on $GITHUB_REF" >&2
            exit 1
          fi
      - id: version
        name: Resolve the version against the registry
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          set -euo pipefail
          npm view "$PACKAGE_NAME" versions --json > "$RUNNER_TEMP/versions.json"
          latest=$(npm view "$PACKAGE_NAME" dist-tags.latest)
          version=$(node - "$REQUESTED" "$latest" "$RUNNER_TEMP/versions.json" <<'NODE'
          const fs = require("node:fs");
          const [requested, latest, versionsPath] = process.argv.slice(2);
          const SEMVER = /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/;
          const parse = (text, what) => {
            const match = SEMVER.exec(text);
            if (!match) throw new Error(`${what} is not X.Y.Z: ${JSON.stringify(text)}`);
            return match.slice(1).map(Number);
          };
          const [major, minor, patch] = parse(latest, "npm's latest");
          const next = { patch: [major, minor, patch + 1], minor: [major, minor + 1, 0], major: [major + 1, 0, 0] }[requested]
            ?? parse(requested, "the version input");
          const order = (a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2];
          if (order(next, [major, minor, patch]) <= 0) throw new Error(`${next.join(".")} is not above npm's latest ${latest}`);
          const version = next.join(".");
          const published = JSON.parse(fs.readFileSync(versionsPath, "utf8"));
          if ((Array.isArray(published) ? published : [published]).includes(version)) throw new Error(`${version} is already on npm`);
          process.stdout.write(version);
          NODE
          )
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing \`$PACKAGE_NAME@$version\` from \`$GITHUB_SHA\` (npm latest: \`$latest\`)" >> "$GITHUB_STEP_SUMMARY"

  # Built exactly once. Every job below downloads it and checks it against this job's digests, and
  # the package job stages exactly these bytes into the tarball that is published.
  artifact:
    name: shipped AudioWorklet artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      sha256: ${{ steps.build.outputs.sha256 }}
      blake3_sha256: ${{ steps.build.outputs.blake3_sha256 }}
      named_sha256: ${{ steps.build.outputs.named_sha256 }}
      closure_sha256: ${{ steps.build.outputs.closure_sha256 }}
      toolchain: ${{ steps.build.outputs.toolchain }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: artifact
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install pinned Rust toolchain and Wasm standard library
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup target add --toolchain 1.99.1 wasm32-unknown-unknown
          channel="$(bash scripts/build-web-audioworklet.sh --print-toolchain)"
          rustup toolchain install "$channel" --profile minimal --component rust-src
      - name: Build the exact shipped artifact and its named twin
        id: build
        run: |
          set -euo pipefail
          rm -rf target/release-artifacts target/release-named-twin
          mkdir -p target/release-artifacts target/release-named-twin
          bash scripts/build-web-audioworklet.sh --named-twin target/release-named-twin target/release-artifacts
          sha256="$(sha256sum target/release-artifacts/miso-engine-v1-audio-worklet.simd128.wasm | awk '{print $1}')"
          blake3_sha256="$(sha256sum target/release-artifacts/miso-engine-v1-blake3.simd128.wasm | awk '{print $1}')"
          named_sha256="$(sha256sum target/release-named-twin/miso-engine-v1-audio-worklet.simd128.named.wasm | awk '{print $1}')"
          closure="$(cd target/release-artifacts && find . -type f -printf '%P\0' | LC_ALL=C sort -z | xargs -0 sha256sum -- | sha256sum | awk '{print $1}')"
          toolchain="$(bash scripts/build-web-audioworklet.sh --print-toolchain)"
          {
            echo "sha256=$sha256"
            echo "blake3_sha256=$blake3_sha256"
            echo "named_sha256=$named_sha256"
            echo "closure_sha256=$closure"
            echo "toolchain=$toolchain"
          } >> "$GITHUB_OUTPUT"
          echo "AudioWorklet module \`$sha256\`, BLAKE3 module \`$blake3_sha256\`, built with \`$toolchain\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Check the shipped modules name the browser artifact toolchain's compiler
        env:
          TOOLCHAIN: ${{ steps.build.outputs.toolchain }}
        run: |
          python3 -B scripts/check-wasm-producers.py --self-test
          python3 -B scripts/check-wasm-producers.py target/release-artifacts/miso-engine-v1-audio-worklet.simd128.wasm --toolchain "$TOOLCHAIN"
          python3 -B scripts/check-wasm-producers.py target/release-artifacts/miso-engine-v1-blake3.simd128.wasm --toolchain "$TOOLCHAIN"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: audioworklet
          path: target/release-artifacts/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: audioworklet-named
          path: target/release-named-twin/
          if-no-files-found: error

  # The Rust tests of the crate that is the shipped module (host-web, with its parity against the C
  # ABI) and of the two contracts the SDK speaks (session JSON and the control protocol). Output
  # changes in every other crate reach the native-parity and expected-resource digests the artifact
  # gates and browser legs check; the whole workspace suite is qualification.yml, run by hand.
  core-tests:
    name: host-web, session and protocol tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: core-tests
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: host-web, session and protocol tests
        run: cargo test --locked -p host-web -p session -p protocol --features host-web/test-support,protocol/test-support,session/test-support

  package:
    name: SDK package and generated surface
    needs: [prepare, artifact]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: sdk
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - name: Pin npm
        run: |
          npm install --global "npm@$NPM_VERSION"
          [[ "$(npm --version)" == "$NPM_VERSION" ]]
      - name: Install pinned Rust toolchain and Wasm standard library
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup target add --toolchain 1.99.1 wasm32-unknown-unknown
      - name: Install locked SDK dependencies
        working-directory: sdk
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: audioworklet
          path: target/release-artifacts
      - name: Verify the download against the artifact job's digests
        env:
          BUILT: ${{ needs.artifact.outputs.sha256 }}
          CLOSURE: ${{ needs.artifact.outputs.closure_sha256 }}
        run: |
          set -euo pipefail
          actual="$(sha256sum target/release-artifacts/miso-engine-v1-audio-worklet.simd128.wasm | awk '{print $1}')"
          [[ "$BUILT" =~ ^[0-9a-f]{64}$ && "$actual" == "$BUILT" ]] || { echo "artifact sha256 mismatch: built $BUILT, got $actual" >&2; exit 1; }
          closure="$(cd target/release-artifacts && find . -type f -printf '%P\0' | LC_ALL=C sort -z | xargs -0 sha256sum -- | sha256sum | awk '{print $1}')"
          [[ "$CLOSURE" =~ ^[0-9a-f]{64}$ && "$closure" == "$CLOSURE" ]] || { echo "artifact closure mismatch: built $CLOSURE, got $closure" >&2; exit 1; }
      # The output-contract test runs the real builder with only cargo mocked; the builder asks the
      # browser artifact toolchain for its sysroot.
      - name: Install the browser artifact toolchain
        run: |
          channel="$(bash scripts/build-web-audioworklet.sh --print-toolchain)"
          rustup toolchain install "$channel" --profile minimal --component rust-src
      - name: Stamp the release version
        working-directory: sdk
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          npm version "$VERSION" --no-git-tag-version --ignore-scripts
          [[ "$(node -p "require('./package.json').version")" == "$VERSION" ]]
          [[ "$(node -p "require('./package-lock.json').version")" == "$VERSION" ]]
      - name: Generated surface, types, headless evals, and package build
        run: |
          set -euo pipefail
          bash scripts/test-sdk-artifact-builder-output-contract.sh
          bash scripts/check-sdk-generated.sh target/release-artifacts
          python3 -B scripts/check-sdk-deletions.py
          bash scripts/check-sdk-types.sh
          bash scripts/check-sdk-headless.sh target/release-artifacts
          bash scripts/sdk-package.sh build target/release-artifacts
      - name: Check the source-only SDK assets are current
        run: cargo test --locked -p parameter-metadata --test response_frame --test session_keys
      - id: pack
        name: Pack exactly one tarball, check it carries the built modules, smoke it, dry-run publish it
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          BUILT: ${{ needs.artifact.outputs.sha256 }}
          BLAKE3: ${{ needs.artifact.outputs.blake3_sha256 }}
        run: |
          set -euo pipefail
          pack=target/release-pack
          rm -rf "$pack" && mkdir -p "$pack/unpacked"
          (cd sdk && npm pack --ignore-scripts --json --pack-destination "../$pack" > "../$pack/npm-pack.json")
          shopt -s nullglob
          archives=("$pack"/*.tgz)
          [[ ${#archives[@]} == 1 ]] || { echo "expected exactly one packed archive" >&2; exit 1; }
          archive=./${archives[0]}
          tar -xzf "$archive" -C "$pack/unpacked"
          [[ "$(node -p "require('./$pack/unpacked/package/package.json').version")" == "$VERSION" ]]
          [[ "$(sha256sum "$pack/unpacked/package/dist/assets/miso-engine-v1-audio-worklet.simd128.wasm" | awk '{print $1}')" == "$BUILT" ]]
          [[ "$(sha256sum "$pack/unpacked/package/dist/assets/miso-engine-v1-blake3.simd128.wasm" | awk '{print $1}')" == "$BLAKE3" ]]
          node sdk/test/package-tarball-smoke.mjs "$pack/unpacked/package"
          npm publish --dry-run --ignore-scripts "$archive"
          echo "tarball=$(basename "$archive")" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$archive" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-tarball
          path: target/release-pack/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error

  artifact-gates:
    name: AudioWorklet artifact gates and native parity
    needs: artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: artifact-gates
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install pinned Rust toolchain and wabt
        run: |
          rustup toolchain install 1.99.1 --profile minimal
          rustup target add --toolchain 1.99.1 wasm32-unknown-unknown
          sudo apt-get update
          sudo apt-get install -y ripgrep wabt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: audioworklet
          path: target/release-artifacts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: audioworklet-named
          path: target/release-named-twin
      - name: Verify the downloads against the artifact job's digests and the twin against the module
        env:
          BUILT: ${{ needs.artifact.outputs.sha256 }}
          CLOSURE: ${{ needs.artifact.outputs.closure_sha256 }}
          NAMED: ${{ needs.artifact.outputs.named_sha256 }}
        run: |
          set -euo pipefail
          actual="$(sha256sum target/release-artifacts/miso-engine-v1-audio-worklet.simd128.wasm | awk '{print $1}')"
          [[ "$BUILT" =~ ^[0-9a-f]{64}$ && "$actual" == "$BUILT" ]] || { echo "artifact sha256 mismatch: built $BUILT, got $actual" >&2; exit 1; }
          closure="$(cd target/release-artifacts && find . -type f -printf '%P\0' | LC_ALL=C sort -z | xargs -0 sha256sum -- | sha256sum | awk '{print $1}')"
          [[ "$CLOSURE" =~ ^[0-9a-f]{64}$ && "$closure" == "$CLOSURE" ]] || { echo "artifact closure mismatch: built $CLOSURE, got $closure" >&2; exit 1; }
          named="$(sha256sum target/release-named-twin/miso-engine-v1-audio-worklet.simd128.named.wasm | awk '{print $1}')"
          [[ "$NAMED" =~ ^[0-9a-f]{64}$ && "$named" == "$NAMED" ]] || { echo "named twin sha256 mismatch: built $NAMED, got $named" >&2; exit 1; }
          python3 -B scripts/strip-wasm-names.py check target/release-named-twin/miso-engine-v1-audio-worklet.simd128.named.wasm target/release-artifacts/miso-engine-v1-audio-worklet.simd128.wasm
      - name: Install the browser artifact toolchain
        run: |
          channel="$(bash scripts/build-web-audioworklet.sh --print-toolchain)"
          rustup toolchain install "$channel" --profile minimal --component rust-src
      # The frozen export set and single shared-memory import, no relaxed SIMD, the render export's
      # allocation-free and trap-free closure, the vector-kernel ratchet, and native<->simd128
      # digest parity over the expected-resource corpus.
      - name: Browser AudioWorklet artifact gates and native parity
        run: |
          bash scripts/check-web-audioworklet.sh --without-metadata-regeneration target/release-artifacts target/release-named-twin/miso-engine-v1-audio-worklet.simd128.named.wasm
          python3 -B scripts/check-browser-expected-resources.py --artifacts target/release-artifacts
      - name: Shipped module contains no whole-plan scalar path
        run: python3 -B scripts/check-scalar-oracle-absent.py --wasm target/release-named-twin/miso-engine-v1-audio-worklet.simd128.named.wasm
      - name: Hermetic browser host and worklet tests
        run: bash scripts/test-web-audioworklet.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2
      - name: V8 spill gate over the shipped module's EQ cascade loops
        run: python3 -B scripts/check-web-audioworklet-v8-spill.py target/release-named-twin/miso-engine-v1-audio-worklet.simd128.named.wasm

  # `single` is a page without cross-origin isolation (and also runs the BLAKE3 Worker and the
  # suspended PCM feed rows); `worker` is an isolated page with a control Worker beside the
  # render-only worklet. Each renders the shipped module in a real AudioContext.
  browser:
    name: ${{ matrix.browser }} ${{ matrix.leg }} browser gates
    needs: artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        leg: [single, worker]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hosts/host-web/qualification/package-lock.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: audioworklet
          path: target/release-artifacts
      - name: Verify the download against the artifact job's digests
        env:
          BUILT: ${{ needs.artifact.outputs.sha256 }}
          CLOSURE: ${{ needs.artifact.outputs.closure_sha256 }}
        run: |
          set -euo pipefail
          actual="$(sha256sum target/release-artifacts/miso-engine-v1-audio-worklet.simd128.wasm | awk '{print $1}')"
          [[ "$BUILT" =~ ^[0-9a-f]{64}$ && "$actual" == "$BUILT" ]] || { echo "artifact sha256 mismatch: built $BUILT, got $actual" >&2; exit 1; }
          closure="$(cd target/release-artifacts && find . -type f -printf '%P\0' | LC_ALL=C sort -z | xargs -0 sha256sum -- | sha256sum | awk '{print $1}')"
          [[ "$CLOSURE" =~ ^[0-9a-f]{64}$ && "$closure" == "$CLOSURE" ]] || { echo "artifact closure mismatch: built $CLOSURE, got $closure" >&2; exit 1; }
      - name: Install SDK dependencies for the response Worker bundle
        working-directory: sdk
        run: npm ci --no-audit --no-fund --prefer-offline
      - name: Cache Playwright browser binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('hosts/host-web/qualification/package-lock.json') }}-${{ matrix.browser }}-${{ runner.os }}
      - name: Install pinned browser
        working-directory: hosts/host-web/qualification
        run: |
          npm ci
          npx playwright install "${{ matrix.browser }}"
          # Prefer the runner's official archives; Azure downloads hit the job budget (#1161).
          printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\n' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          npx playwright install-deps "${{ matrix.browser }}"
          sudo apt-get install -y --no-install-recommends pulseaudio pulseaudio-utils
      - name: ${{ matrix.browser }} ${{ matrix.leg }} attestation, AudioWorklet, native digest, and stall gates
        working-directory: hosts/host-web/qualification
        run: |
          # A real AudioContext needs an output device even on a headless runner: a private null
          # PulseAudio sink, on a short socket path (a UNIX socket path stays under 108 bytes).
          qualification_audio_dir="$(mktemp -d "$RUNNER_TEMP/qualification-audio.XXXXXX")"
          export PULSE_SERVER="unix:$qualification_audio_dir/native"
          DBUS_SESSION_BUS_ADDRESS="unix:path=$qualification_audio_dir/no-session-bus" \
          pulseaudio --daemonize=no --exit-idle-time=-1 --use-pid-file=no --disable-shm=yes -n \
            --load="module-native-protocol-unix socket=$qualification_audio_dir/native auth-anonymous=1" \
            --load="module-null-sink sink_name=qualification rate=48000 channels=2" \
            --log-target="file:$qualification_audio_dir/pulse.log" &
          qualification_audio_pid=$!
          trap 'kill "$qualification_audio_pid" 2>/dev/null || true; wait "$qualification_audio_pid" 2>/dev/null || true; cat "$qualification_audio_dir/pulse.log"' EXIT
          for attempt in {1..50}; do
            [[ -S "$qualification_audio_dir/native" ]] && break
            sleep 0.1
          done
          [[ -S "$qualification_audio_dir/native" ]]
          pactl -s "$PULSE_SERVER" info
          npm run qualify -- --artifacts "$GITHUB_WORKSPACE/target/release-artifacts" --sdk-root "$GITHUB_WORKSPACE/sdk" --browser "${{ matrix.browser }}" --leg "${{ matrix.leg }}" --check-matrix --self-test-mutations

  publish:
    name: ${{ inputs.dry_run && 'dry-run publish' || 'publish' }} @misofm/engine ${{ needs.prepare.outputs.version }}
    needs: [prepare, artifact, core-tests, package, artifact-gates, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    outputs:
      integrity: ${{ steps.publish.outputs.integrity }}
      shasum: ${{ steps.publish.outputs.shasum }}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Pin npm (trusted publishing needs npm 11.5 or later)
        run: |
          npm install --global "npm@$NPM_VERSION"
          [[ "$(npm --version)" == "$NPM_VERSION" ]]
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-tarball
          path: release
      - id: publish
        name: ${{ inputs.dry_run && 'Dry-run publish the tested tarball' || 'Publish the tested tarball through OIDC with provenance' }}
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          TARBALL: ${{ needs.package.outputs.tarball }}
          TARBALL_SHA256: ${{ needs.package.outputs.sha256 }}
        run: |
          set -euo pipefail
          # A leading ./ keeps npm from reading `release/<file>` as a GitHub `user/repo` spec.
          archive="./release/$TARBALL"
          [[ "$(sha256sum "$archive" | awk '{print $1}')" == "$TARBALL_SHA256" ]] || { echo "tarball differs from the one the package job tested" >&2; exit 1; }
          node - "$archive" >> "$GITHUB_OUTPUT" <<'NODE'
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const bytes = fs.readFileSync(process.argv[2]);
          console.log(`shasum=${crypto.createHash("sha1").update(bytes).digest("hex")}`);
          console.log(`integrity=sha512-${crypto.createHash("sha512").update(bytes).digest("base64")}`);
          NODE
          if [[ "$DRY_RUN" == true ]]; then
            npm publish --dry-run --ignore-scripts --access public --tag latest "$archive"
            echo "Dry run: \`$PACKAGE_NAME@$VERSION\` passed every check; nothing was published." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo "refusing to publish from $GITHUB_REF" >&2; exit 1; }
          for fallback in NODE_AUTH_TOKEN NPM_TOKEN NPM_CONFIG__AUTH_TOKEN; do
            [[ -z "${!fallback:-}" ]] || { echo "refusing a populated npm token fallback: $fallback" >&2; exit 1; }
          done
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/npmrc-oidc-only"
          : > "$NPM_CONFIG_USERCONFIG"
          # npm versions are immutable: a non-zero exit is checked against the registry below, never retried.
          npm publish "$archive" --provenance --access public --tag latest --ignore-scripts \
            || echo "npm publish exited non-zero; verifying the registry instead of retrying" >&2
      - name: Verify the registry serves the tested tarball as latest, public
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SHASUM: ${{ steps.publish.outputs.shasum }}
          INTEGRITY: ${{ steps.publish.outputs.integrity }}
        run: |
          set -euo pipefail
          # #2212: the registry served recent versions 97-311 s after publish returned; poll about 15 minutes.
          for attempt in $(seq 1 60); do
            if [[ "$(npm view "$PACKAGE_NAME@$VERSION" dist.shasum 2>/dev/null)" == "$SHASUM" \
              && "$(npm view "$PACKAGE_NAME@$VERSION" dist.integrity 2>/dev/null)" == "$INTEGRITY" \
              && "$(npm view "$PACKAGE_NAME" dist-tags.latest 2>/dev/null)" == "$VERSION" \
              && "$(npm access get status "$PACKAGE_NAME" --json 2>/dev/null | node -e 'const r=JSON.parse(require("fs").readFileSync(0,"utf8"));process.stdout.write(typeof r==="string"?r:(r[process.argv[1]]??r.status??""))' "$PACKAGE_NAME")" == public ]]; then
              echo "registry serves $PACKAGE_NAME@$VERSION (attempt $attempt)"
              exit 0
            fi
            sleep 15
          done
          echo "the registry did not converge on the tested tarball; recheck by hand, never publish again" >&2
          exit 1
      - name: Fresh install imports every entry, runs enginectl, and verifies provenance binds this commit
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          consumer=$(mktemp -d)
          cd "$consumer"
          npm install --ignore-scripts "$PACKAGE_NAME@$VERSION"
          node --input-type=module -e 'await import("@misofm/engine"); await import("@misofm/engine/headless"); await import("@misofm/engine/browser"); await import("@misofm/engine/assets")'
          [[ "$(./node_modules/.bin/enginectl --version)" == "$VERSION" ]]
          # The attestation endpoint can answer 404 for minutes after the version is served (0.10.5).
          for attempt in $(seq 1 40); do
            npm audit signatures --json --include-attestations > audit.json 2> audit.err && break
            [[ "$attempt" == 40 ]] && { cat audit.err >&2; exit 1; }
            sleep 15
          done
          node - audit.json <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const { PACKAGE_NAME: name, VERSION: version, GITHUB_SHA: sha, GITHUB_REPOSITORY: repository } = process.env;
          const target = (entry) => entry && entry.name === name && entry.version === version;
          const verified = (report.verified ?? []).filter(target);
          const rejected = ["invalid", "missing", "unverified"].flatMap((key) => (report[key] ?? []).filter(target));
          if (verified.length !== 1 || rejected.length !== 0) throw new Error("npm did not verify exactly one signature for the package");
          const bundles = (verified[0].attestationBundles ?? []).filter((bundle) => bundle?.predicateType === "https://slsa.dev/provenance/v1");
          if (bundles.length !== 1) throw new Error("expected exactly one verified SLSA v1 provenance bundle");
          const statement = JSON.parse(Buffer.from(bundles[0].bundle.dsseEnvelope.payload, "base64").toString("utf8"));
          const workflow = statement?.predicate?.buildDefinition?.externalParameters?.workflow;
          if (workflow?.repository !== `https://github.com/${repository}` || workflow?.path !== ".github/workflows/npm-publish.yml" || workflow?.ref !== "refs/heads/main") throw new Error("provenance names another workflow");
          const commits = (statement?.predicate?.buildDefinition?.resolvedDependencies ?? []).filter((dependency) => dependency?.digest?.gitCommit === sha);
          if (commits.length !== 1) throw new Error("provenance does not bind this run's commit");
          NODE

  # Writes only the tag and the GitHub Release; checks out nothing, runs no repository code.
  record:
    name: record v${{ needs.prepare.outputs.version }} as a GitHub Release
    needs: [prepare, artifact, package, publish]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-tarball
          path: release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: audioworklet-named
          path: release
      - name: Create the tag and the release with the shipped digests
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          WORKLET: ${{ needs.artifact.outputs.sha256 }}
          BLAKE3: ${{ needs.artifact.outputs.blake3_sha256 }}
          NAMED: ${{ needs.artifact.outputs.named_sha256 }}
          TOOLCHAIN: ${{ needs.artifact.outputs.toolchain }}
          TARBALL_SHA256: ${{ needs.package.outputs.sha256 }}
          INTEGRITY: ${{ needs.publish.outputs.integrity }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$WORKLET" =~ ^[0-9a-f]{64}$ && "$BLAKE3" =~ ^[0-9a-f]{64}$ ]]
          cat > notes.md <<EOF
          \`npm install $PACKAGE_NAME@$VERSION\` ([npm](https://www.npmjs.com/package/$PACKAGE_NAME/v/$VERSION), [run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID))

          | | sha256 |
          | --- | --- |
          | \`miso-engine-v1-audio-worklet.simd128.wasm\` | \`$WORKLET\` |
          | \`miso-engine-v1-blake3.simd128.wasm\` | \`$BLAKE3\` |
          | named twin (attached, not shipped) | \`$NAMED\` |
          | npm tarball | \`$TARBALL_SHA256\` |

          Built from \`$GITHUB_SHA\` with \`$TOOLCHAIN\`. npm integrity \`$INTEGRITY\`.
          EOF
          start=()
          previous=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '[.[] | select(.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")) | .tag_name][0] // empty')
          [[ -z "$previous" ]] || start=(--generate-notes --notes-start-tag "$previous")
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$PACKAGE_NAME $VERSION" --notes-file notes.md "${start[@]}" --latest \
            release/*.tgz release/miso-engine-v1-audio-worklet.simd128.named.wasm
