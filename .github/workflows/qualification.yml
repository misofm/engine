name: Easy3 one-off independent evidence
on: [workflow_dispatch]
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.99.1
  CARGO_BUILD_JOBS: 2
  RUST_TEST_THREADS: 1
jobs:
  evidence:
    name: Official ITU, held meter and frozen limiter A/B proof
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: wasm-guests
          save-if: false
      - name: Install pinned native and browser toolchains
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.99.1 --profile minimal
          rustup target add --toolchain 1.99.1 wasm32-unknown-unknown
          channel="$(bash scripts/build-web-audioworklet.sh --print-toolchain)"
          rustup toolchain install "$channel" --profile minimal --component rust-src
          sudo apt-get update
          sudo apt-get install -y ripgrep wabt binutils
      - name: Materialize frozen source-only evidence bundle
        shell: bash
        run: |
          python3 - <<'PY_BUNDLE'
          import base64, json, os, pathlib
          bundle=pathlib.Path(os.environ['RUNNER_TEMP'])/'easy3-bundle'
          bundle.mkdir(exist_ok=False)
          files=json.loads(base64.b64decode(''))
          for name,text in files.items():
              assert pathlib.Path(name).name==name
              (bundle/name).write_text(text)
          PY_BUNDLE
      - name: Sequential explicit proofs and exactly one A/B invocation
        shell: bash
        run: bash "$RUNNER_TEMP/easy3-bundle/run-evidence.sh"
      - name: Preserve source-only bundle, logs and raw evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: easy3-independent-evidence
          path: |
            ${{ runner.temp }}/easy3-proof
            ${{ runner.temp }}/easy3-bundle
          if-no-files-found: error
