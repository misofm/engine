name: Issue 1670 one-off native Arm evidence
on: [workflow_dispatch]
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.99.1
  CARGO_BUILD_JOBS: 2
  RUST_TEST_THREADS: 1
  RUSTFLAGS: -D warnings
jobs:
  evidence:
    name: Native Arm controls and one-ulp proof (debug then release)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Install pinned Rust and ripgrep
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install 1.99.1 --profile minimal
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: aarch64-release
          save-if: false
      - name: Four existing pins and mutation of both actual Arm legs
        shell: bash
        run: |
          set -euo pipefail
          [[ $(uname -m) == aarch64 || $(uname -m) == arm64 ]]
          proof_dir="$RUNNER_TEMP/issue-1670-arm-proof"
          mkdir -p "$proof_dir"
          uname -a | tee "$proof_dir/architecture.txt"
          rustc -vV | tee "$proof_dir/rustc.txt"
          git rev-parse HEAD | tee "$proof_dir/proof-commit.txt"
          printf '%s\n' '24000af983207d5f18aecb2aece5d1a3466741c1' > "$proof_dir/reviewed-source.txt"
          git diff --exit-code '24000af983207d5f18aecb2aece5d1a3466741c1' HEAD -- . ':!.github/workflows/qualification.yml'
          cat > "$proof_dir/value-at-one-ulp.patch" <<'PATCH_1670'
          --- a/crates/automation/src/evaluate.rs
          +++ b/crates/automation/src/evaluate.rs
          @@ -38,7 +38,10 @@
               let v1 = f64::from(segment.end_value);
               match segment.shape {
                   Shape::Step => segment.start_value,
          -        Shape::Linear => (v0 + (v1 - v0) * fraction(segment, t)) as f32,
          +        Shape::Linear => {
          +            let value = (v0 + (v1 - v0) * fraction(segment, t)) as f32;
          +            f32::from_bits(value.to_bits().wrapping_add(1))
          +        },
                   Shape::Exponential => (v0 * math::pow(v1 / v0, fraction(segment, t))) as f32,
               }
           }
          PATCH_1670
          cat > "$proof_dir/judge-arm-mutation.py" <<'JUDGE_1670'
          import pathlib
          import sys

          log = pathlib.Path(sys.argv[1]).read_text()
          status = int(sys.argv[2])
          mode = sys.argv[3] if len(sys.argv) > 3 else "targeted"
          assert mode in ("script", "targeted"), f"unknown proof mode {mode}"
          name = "tests::native_automation_timeline_digest_pins_the_wasm_parity"
          reason = "native and the pinned wasm automation-timeline digest must agree bit for bit"
          assert status == 101, f"cargo status {status}, expected executed test failure (101)"
          assert f"test {name} ... FAILED" in log, "the exact owner did not fail"
          passed = 3 if mode == "script" else 0
          assert f"test result: FAILED. {passed} passed; 1 failed;" in log, "unexpected test result"
          assert reason in log, "the failure was not the frozen native/browser automation digest"
          if mode == "script":
              for other in ("identity_session", "set_control_timeline", "observation_timeline"):
                  name = f"tests::native_{other}_digest_pins_the_wasm_parity"
                  assert f"test {name} ... ok" in log, f"other owner {name} did not pass"
          assert log.count("test result:") == 1, "the failing pin command must abort before other suites"
          print(f"{sys.argv[1]}: expected one-ulp {mode} digest failure confirmed")
          JUDGE_1670
          pins=(
            tests::native_identity_session_digest_pins_the_wasm_parity
            tests::native_set_control_timeline_digest_pins_the_wasm_parity
            tests::native_observation_timeline_digest_pins_the_wasm_parity
            tests::native_automation_timeline_digest_pins_the_wasm_parity
          )
          for mode in debug release; do
            profile=()
            [[ $mode == release ]] && profile=(--release)
            cargo test --locked "${profile[@]}" -p host-web --features test-support --lib -- \
              --exact "${pins[@]}" 2>&1 | tee "$proof_dir/green-$mode.log"
            python3 - "$proof_dir/green-$mode.log" <<'GREEN_1670'
          import pathlib, sys
          log = pathlib.Path(sys.argv[1]).read_text()
          assert 'test result: ok. 4 passed; 0 failed;' in log, log
          print(sys.argv[1] + ': all four existing pins executed and passed')
          GREEN_1670
          done
          git apply --check "$proof_dir/value-at-one-ulp.patch"
          git apply "$proof_dir/value-at-one-ulp.patch"
          git diff -- crates/automation/src/evaluate.rs > "$proof_dir/applied-mutation.patch"
          restore_source() { git apply -R "$proof_dir/value-at-one-ulp.patch"; }
          trap restore_source EXIT
          for mode in debug release; do
            status=0
            bash scripts/run-aarch64-tests.sh "$mode" > "$proof_dir/one-ulp-$mode.log" 2>&1 || status=$?
            python3 "$proof_dir/judge-arm-mutation.py" "$proof_dir/one-ulp-$mode.log" "$status" script
          done
          restore_source
          trap - EXIT
          git diff --exit-code
          printf '%s\n' 'Native Arm green controls and both real mutated legs: PASS' | tee "$proof_dir/verdict.txt"
      - name: Preserve controls, mutation, and results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-1670-native-arm-proof
          path: ${{ runner.temp }}/issue-1670-arm-proof
          if-no-files-found: error
