name: qualification

# Design #359 WP-4: one PR workflow, one required status context (the `verdict` job, whose own
# `name:` is `qualification`), eighteen leaf jobs behind one router, one aggregate (#1017 added the
# two AArch64 jobs, #1061 `artifact-identity` and `artifact-record`, #1043 `gate-self-tests`).
# Stage 3 (§12) retired the four workflows this one replaced -- ci.yml, sdk.yml,
# browser-qualification.yml and release-build.yml -- once this workflow had reported on >= 10 PRs
# and agreed with them; this is now the sole required PR workflow. See design §4/§5/§7/§12.
#
# No `paths:`/`paths-ignore:` anywhere in this file, by design and by policy check: a required
# workflow that can be skipped by a path filter leaves a PR pending forever. Every job below is
# itself gated by the router's `route` output instead, and the verdict enforces that every job's
# result matches a static expectation table -- a leaf `if:` that drifts from the table fails the
# verdict in both directions.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: qualification-${{ github.event.pull_request.number || github.ref }}
  # S9: cancelling a main push here (cancel-in-progress: true, unconditionally) races the next
  # main push's superseding run against every rust-cache's `save-if: github.ref == main` post
  # step. A push run cancelled mid-cache-save writes nothing, so under frequent merges to main the
  # caches every PR depends on may never be written. PR runs still want unconditional cancellation
  # (a superseded PR run's work is worthless the moment a new commit lands), so cancel only on
  # pull_request; a main push always runs to completion and its caches always save.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.97.1

jobs:
  route:
    name: classify qualification paths and step conditions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      route: ${{ steps.classify.outputs.route }}
      math_closure: ${{ steps.classify.outputs.math_closure }}
      release_inputs: ${{ steps.classify.outputs.release_inputs }}
      self_tests: ${{ steps.classify.outputs.self_tests }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Validate path-routing policy and mutations
        run: |
          python3 -B scripts/check-ci-path-routing.py
          python3 -B scripts/test-ci-path-routing.py
      - id: classify
        name: Select fail-safe qualification route and step conditions
        run: |
          # pipefail: without it a router crash leaves an empty GITHUB_OUTPUT and the step exits 0,
          # and the failure only surfaces as "unknown route" in the verdict a full cycle later.
          set -o pipefail
          python3 -B scripts/ci-path-router.py --flags \
            --event "${{ github.event_name }}" \
            --base "${{ github.event.pull_request.base.sha || github.event.before }}" \
            --head "${{ github.event.pull_request.head.sha || github.sha }}" \
            | tail -n 4 >> "$GITHUB_OUTPUT"

  docs-gates:
    name: docs and research evidence gates
    needs: route
    # Runs on the evidence route and on the full route (a mixed docs+code PR routes full; the
    # research and listening-packet validators must not disappear for it).
    if: needs.route.outputs.route == 'evidence' || needs.route.outputs.route == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install ripgrep (not on the runner image; every policy script greps with rg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
      # dsp-research/**/*.md joined the evidence family (design §2); its own validators move here
      # so a research-note edit does not ride the full route. Hermetic: no cargo, no clock. The
      # research gate's mutation tests run in gate-self-tests when a file they read changes (#1043).
      - name: DSP research corpus and listening-evidence packet validators
        run: |
          bash scripts/check-dsp-research.sh
          bash scripts/check-builtins-listening.sh

  artifact:
    name: shipped AudioWorklet artifact
    needs: route
    if: needs.route.outputs.route == 'sdk' || needs.route.outputs.route == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      sha256: ${{ steps.build.outputs.sha256 }}
      rustc: ${{ steps.build.outputs.rustc }}
      closure_sha256: ${{ steps.build.outputs.closure_sha256 }}
      named_sha256: ${{ steps.build.outputs.named_sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: artifact
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install pinned Rust toolchain and Wasm standard library
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup target add --toolchain 1.97.1 wasm32-unknown-unknown
      # Built exactly once here; every consumer downloads it and checks it against this job's
      # `sha256` output, so every artifact gate in the run reads exactly these bytes. #1044: the
      # parameter metadata and ABI layout are generated exactly once too, here, and `closure_sha256`
      # (one digest over every file's sha256, in byte order of name) is what every consumer checks
      # the whole directory against, so none of them runs the generator again. Issue #1061
      # (owner decision 5): no comparison with the committed pin here. The pin is the release
      # fingerprint; `artifact-identity` reports whether these bytes changed and holds a release
      # change to the pin (docs/RELEASE.md). Issue #1109: the same build writes the named twin, the
      # shipped module plus its `name` section, outside the delivery closure; `named_sha256` is what
      # artifact-gates checks its download against.
      - name: Build the exact shipped artifact
        id: build
        run: |
          # The build script refuses a non-empty output directory; never rely on the cache
          # action having pruned a previous run's loose files.
          rm -rf target/ci/qualification-artifacts target/ci/qualification-named-twin
          mkdir -p target/ci/qualification-artifacts target/ci/qualification-named-twin
          bash scripts/build-web-audioworklet.sh --named-twin target/ci/qualification-named-twin target/ci/qualification-artifacts
          sha256="$(sha256sum target/ci/qualification-artifacts/miso-engine-v1-audio-worklet.simd128.wasm | awk '{print $1}')"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          named_sha256="$(sha256sum target/ci/qualification-named-twin/miso-engine-v1-audio-worklet.simd128.named.wasm | awk '{print $1}')"
          echo "named_sha256=$named_sha256" >> "$GITHUB_OUTPUT"
          echo "rustc=$(rustc -vV | sed -n 's/^release: //p')" >> "$GITHUB_OUTPUT"
          closure="$(set -o pipefail; cd target/ci/qualification-artifacts && find . -type f -printf '%P\0' | LC_ALL=C sort -z | xargs -0 sha256sum -- | sha256sum | awk '{print $1}')"
          echo "closure_sha256=$closure" >> "$GITHUB_OUTPUT"
          echo "Shipped AudioWorklet module at \`$GITHUB_SHA\`: \`$sha256\` (the \`artifact-identity\` summary says whether it changed)" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload shipped artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: audioworklet-${{ github.sha }}
          path: target/ci/qualification-artifacts/
          if-no-files-found: error
          overwrite: true
      # Issue #1109: the named twin is not shipped. It is kept for the gates that find functions by
      # name (artifact-gates) and to symbolicate a production stack trace (docs/RELEASE.md).
      - name: Upload the named twin (not shipped)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: audioworklet-named-${{ github.sha }}
          path: target/ci/qualification-named-twin/
          if-no-files-found: error
          overwrite: true

  # Issue #1061 (owner decision 5): every PR says whether the shipped module changed against the
  # digest its base's own CI run recorded, proves the build reproducible, and holds only a release
  # change to the committed pin (docs/RELEASE.md). Its own job, so the twin build stays off the
  # path of `sdk`, `artifact-gates` and the browser legs, which start once `artifact` has uploaded.
  # scripts/web-audioworklet-identity.py has the rules.
  artifact-identity:
    name: shipped AudioWorklet artifact identity (changed or unchanged, reproducible, release pin)
    needs: [route, artifact]
    if: needs.route.outputs.route == 'sdk' || needs.route.outputs.route == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      statuses: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install pinned Rust toolchain and Wasm standard library
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup target add --toolchain 1.97.1 wasm32-unknown-unknown
      # The twin: this commit again, from another checkout path and with another CARGO_HOME, the
      # two roots rustc could embed. `artifact` built from $GITHUB_WORKSPACE with the runner's.
      - name: Rebuild the module from another checkout path and CARGO_HOME
        run: |
          git worktree add --detach "$RUNNER_TEMP/twin" HEAD
          mkdir "$RUNNER_TEMP/twin-module"
          CARGO_HOME="$RUNNER_TEMP/twin-cargo-home" bash "$RUNNER_TEMP/twin/scripts/build-web-audioworklet.sh" --module-only "$RUNNER_TEMP/twin-module"
      # The base is never rebuilt here: this run's workflow is the change's, and a base built in it
      # is built in the change's environment (#1061 attempts 1 and 2). The report reads the digest
      # the base's own run recorded instead, and says CANNOT TELL when there is none.
      - name: Report ARTIFACT CHANGED or UNCHANGED against the base's recorded digest, and hold a release change to its pin
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BUILT: ${{ needs.artifact.outputs.sha256 }}
          RUSTC: ${{ needs.artifact.outputs.rustc }}
        run: |
          set -o pipefail
          python3 -B scripts/web-audioworklet-identity.py --self-test
          python3 -B scripts/web-audioworklet-identity.py report --event "$EVENT" --before "$BEFORE" --repository "$GITHUB_REPOSITORY" --built "$BUILT" --rustc "$RUSTC" --twin "$RUNNER_TEMP/twin-module/miso-engine-v1-audio-worklet.simd128.wasm" | tee -a "$GITHUB_STEP_SUMMARY"

  # Issue #1061: main's own record of the module this commit's run built, as the commit status
  # `audioworklet-sha256` (`<sha256> rustc <release>`, linking the run). Later changes compare
  # with it (`artifact-identity`), so no change ever rebuilds its base inside its own, possibly
  # edited, workflow. Its own job, run only on a push to main, checking out nothing and running no
  # repository code: it is the only job holding a write token, and no pull request reaches it.
  artifact-record:
    name: record the shipped AudioWorklet module's digest on main
    needs: [route, artifact]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.route.outputs.route == 'sdk' || needs.route.outputs.route == 'full')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Record this commit's module for later changes to compare against
        env:
          GH_TOKEN: ${{ github.token }}
          SHA256: ${{ needs.artifact.outputs.sha256 }}
          RUSTC: ${{ needs.artifact.outputs.rustc }}
        run: |
          [[ "$SHA256" =~ ^[0-9a-f]{64}$ && "$RUSTC" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]] || { echo "malformed record: '$SHA256' rustc '$RUSTC'" >&2; exit 1; }
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state=success -f context=audioworklet-sha256 -f "description=$SHA256 rustc $RUSTC" -f "target_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  sdk:
    name: SDK package and generated-surface qualification
    needs: [route, artifact]
    if: needs.route.outputs.route == 'sdk' || needs.route.outputs.route == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: sdk
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      # check-sdk-generated.sh no longer runs the parameter-metadata generator (#1044): it compares
      # sdk/assets with the documents the artifact job generated, which the closure digest below
      # proves this job reads. The toolchain stays for check-sdk-headless.sh, whose evals cross-check
      # the SDK against native debug oracles (`cargo run -p parameter-metadata --bin
      # parameter_metadata_lattice_oracle`, `cargo run -p host-web --example sdk_render_oracle`).
      - name: Install pinned Rust toolchain and Wasm standard library
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup target add --toolchain 1.97.1 wasm32-unknown-unknown
      - name: Install SDK dependencies
        working-directory: sdk
        run: npm ci --no-audit --no-fund --prefer-offline
      - name: Download shipped artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: audioworklet-${{ github.sha }}
          path: target/ci/qualification-artifacts
      - name: Verify the downloaded artifact against the artifact job's digest
        env:
          BUILT: ${{ needs.artifact.outputs.sha256 }}
          CLOSURE: ${{ needs.artifact.outputs.closure_sha256 }}
        run: |
          actual="$(sha256sum target/ci/qualification-artifacts/miso-engine-v1-audio-worklet.simd128.wasm | awk '{print $1}')"
          [[ "$BUILT" =~ ^[0-9a-f]{64}$ && "$actual" == "$BUILT" ]] || { echo "downloaded artifact sha256 mismatch: the artifact job built $BUILT, got $actual" >&2; exit 1; }
          closure="$(set -o pipefail; cd target/ci/qualification-artifacts && find . -type f -printf '%P\0' | LC_ALL=C sort -z | xargs -0 sha256sum -- | sha256sum | awk '{print $1}')"
          [[ "$CLOSURE" =~ ^[0-9a-f]{64}$ && "$closure" == "$CLOSURE" ]] || { echo "downloaded artifact closure mismatch: the artifact job built $CLOSURE, got $closure" >&2; exit 1; }
      # check-sdk-deletions.py's --self-test (design §6.6, S7) runs in gate-self-tests
      # when the gate or the SDK tree it reads changes (#1043); the gate itself runs here.
      # test-sdk-artifact-builder-output-contract.sh (also design §6.6) is not added separately:
      # sdk-package.sh check already runs it as its own first step (see scripts/sdk-package.sh:29-30)
      # before the `sdk-package.sh check` call below, so adding it here again would be a duplicate
      # invocation, not a new gate.
      - name: Qualify the SDK package against the shared artifact
        run: |
          bash scripts/check-sdk-generated.sh target/ci/qualification-artifacts
          python3 -B scripts/check-sdk-deletions.py
          bash scripts/check-sdk-types.sh
          bash scripts/check-sdk-headless.sh target/ci/qualification-artifacts
          bash scripts/sdk-package.sh check target/ci/qualification-artifacts

  artifact-gates:
    name: AudioWorklet artifact gates
    needs: [route, artifact]
    if: needs.route.outputs.route == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: artifact-gates
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install pinned Rust toolchain and wabt
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          sudo apt-get update
          sudo apt-get install -y ripgrep wabt
      - name: Download shipped artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: audioworklet-${{ github.sha }}
          path: target/ci/qualification-artifacts
      - name: Verify the downloaded artifact against the artifact job's digest
        env:
          BUILT: ${{ needs.artifact.outputs.sha256 }}
          CLOSURE: ${{ needs.artifact.outputs.closure_sha256 }}
        run: |
          actual="$(sha256sum target/ci/qualification-artifacts/miso-engine-v1-audio-worklet.simd128.wasm | awk '{print $1}')"
          [[ "$BUILT" =~ ^[0-9a-f]{64}$ && "$actual" == "$BUILT" ]] || { echo "downloaded artifact sha256 mismatch: the artifact job built $BUILT, got $actual" >&2; exit 1; }
          closure="$(set -o pipefail; cd target/ci/qualification-artifacts && find . -type f -printf '%P\0' | LC_ALL=C sort -z | xargs -0 sha256sum -- | sha256sum | awk '{print $1}')"
          [[ "$CLOSURE" =~ ^[0-9a-f]{64}$ && "$closure" == "$CLOSURE" ]] || { echo "downloaded artifact closure mismatch: the artifact job built $CLOSURE, got $closure" >&2; exit 1; }
      # Issue #1109: the shipped module carries no `name` section, so the three gates below that find
      # functions by name -- the call graph (inside check-web-audioworklet.sh), scalar-oracle-absent
      # and the V8 spill gate -- read the named twin. Its download is checked against the artifact
      # job's digest, and then against the shipped module: the same sections, byte for byte, but
      # its `name` section, so what the gates prove of its code holds for the code that ships.
      - name: Download the named twin
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: audioworklet-named-${{ github.sha }}
          path: target/ci/qualification-named-twin
      - name: Verify the named twin against the artifact job's digest and the shipped module
        env:
          NAMED: ${{ needs.artifact.outputs.named_sha256 }}
        run: |
          actual="$(sha256sum target/ci/qualification-named-twin/miso-engine-v1-audio-worklet.simd128.named.wasm | awk '{print $1}')"
          [[ "$NAMED" =~ ^[0-9a-f]{64}$ && "$actual" == "$NAMED" ]] || { echo "downloaded named twin sha256 mismatch: the artifact job built $NAMED, got $actual" >&2; exit 1; }
          python3 -B scripts/strip-wasm-names.py --self-test
          python3 -B scripts/strip-wasm-names.py check target/ci/qualification-named-twin/miso-engine-v1-audio-worklet.simd128.named.wasm target/ci/qualification-artifacts/miso-engine-v1-audio-worklet.simd128.wasm
      # #106 E1/E2/E5/E7 and the F4 native<->simd128 session parity, over the artifact that ships.
      # check-web-audioworklet.sh asserts the frozen export set, no imports, no shared memory, no
      # atomics or relaxed SIMD, the render export's allocation-free/trap-free closure, and the
      # vector-kernel ratchet. check-browser-expected-resources.py --artifacts runs the same
      # direct-oracle.mjs digest parity and unconditionally self-tests before returning (design
      # §6.3: subsumes the retired web-audioworklet-browser-correctness.py --check and its own
      # --self-test step). #1044: `--without-metadata-regeneration` leaves out only the gate's
      # `parameter-metadata --check`, which here compared the generator with itself: the artifact
      # job generated these documents at this commit, and the closure digest was verified above.
      - name: Browser AudioWorklet artifact gates and native parity
        run: |
          bash scripts/check-web-audioworklet.sh --without-metadata-regeneration target/ci/qualification-artifacts target/ci/qualification-named-twin/miso-engine-v1-audio-worklet.simd128.named.wasm
          python3 -B scripts/check-browser-expected-resources.py --artifacts target/ci/qualification-artifacts
      # #1059: the whole-plan scalar renderer is a test-only oracle; the shipped module must not
      # contain it (owner ruling 2026-09-28, decision 3). Read from the named twin (#1109).
      - name: Shipped AudioWorklet module contains no whole-plan scalar path
        run: python3 -B scripts/check-scalar-oracle-absent.py --wasm target/ci/qualification-named-twin/miso-engine-v1-audio-worklet.simd128.named.wasm
      - name: Hermetic browser host and worklet tests
        run: bash scripts/test-web-audioworklet.sh
      # Issues #1000/#1009: V8's register allocation of the EQ's stationary cascade loops, read from
      # the downloaded, digest-verified named twin of the artifact (#1109; run-wasm-gates.sh
      # --without-v8-spill leaves it to this job). Register allocation belongs to one V8, so the Node version is exact and the
      # gate refuses any other. Last, so the steps above keep the runner's own Node.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.2
      - name: V8 spill gate over the shipped module's EQ cascade loops
        run: |
          python3 -B scripts/check-web-audioworklet-v8-spill.py --self-test
          python3 -B scripts/check-web-audioworklet-v8-spill.py target/ci/qualification-named-twin/miso-engine-v1-audio-worklet.simd128.named.wasm

  browser:
    name: ${{ matrix.browser }} — browser qualification gates
    needs: [route, artifact]
    if: needs.route.outputs.route == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hosts/host-web/qualification/package-lock.json
      - name: Download shipped artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: audioworklet-${{ github.sha }}
          path: target/ci/qualification-artifacts
      - name: Install SDK dependencies for the response Worker bundle
        working-directory: sdk
        run: npm ci --no-audit --no-fund --prefer-offline
      - name: Verify the downloaded artifact against the artifact job's digest
        env:
          BUILT: ${{ needs.artifact.outputs.sha256 }}
          CLOSURE: ${{ needs.artifact.outputs.closure_sha256 }}
        run: |
          actual="$(sha256sum target/ci/qualification-artifacts/miso-engine-v1-audio-worklet.simd128.wasm | awk '{print $1}')"
          [[ "$BUILT" =~ ^[0-9a-f]{64}$ && "$actual" == "$BUILT" ]] || { echo "downloaded artifact sha256 mismatch: the artifact job built $BUILT, got $actual" >&2; exit 1; }
          closure="$(set -o pipefail; cd target/ci/qualification-artifacts && find . -type f -printf '%P\0' | LC_ALL=C sort -z | xargs -0 sha256sum -- | sha256sum | awk '{print $1}')"
          [[ "$CLOSURE" =~ ^[0-9a-f]{64}$ && "$closure" == "$CLOSURE" ]] || { echo "downloaded artifact closure mismatch: the artifact job built $CLOSURE, got $closure" >&2; exit 1; }
      - name: Cache Playwright browser binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('hosts/host-web/qualification/package-lock.json') }}-${{ matrix.browser }}-${{ runner.os }}
      - name: Install pinned browser
        working-directory: hosts/host-web/qualification
        run: |
          npm ci
          npx playwright install "${{ matrix.browser }}"
          npx playwright install-deps "${{ matrix.browser }}"
          sudo apt-get install -y pulseaudio
      - name: ${{ matrix.browser }} — attestation, AudioWorklet, native digest, and stall gates
        working-directory: hosts/host-web/qualification
        run: |
          # A real AudioContext needs an output device even on a headless runner. Keep this
          # browser job's sink/socket private; qualification still renders the actual Worklet.
          qualification_audio_dir="$(mktemp -d "$RUNNER_TEMP/qualification-audio.XXXXXX")"
          export PULSE_SERVER="unix:$qualification_audio_dir/native"
          DBUS_SESSION_BUS_ADDRESS="unix:path=$qualification_audio_dir/no-session-bus" \
          pulseaudio --daemonize=no --exit-idle-time=-1 --use-pid-file=no --disable-shm=yes -n \
            --load="module-native-protocol-unix socket=$qualification_audio_dir/native auth-anonymous=1" \
            --load="module-null-sink sink_name=qualification rate=48000 channels=2" \
            --log-target="file:$qualification_audio_dir/pulse.log" &
          qualification_audio_pid=$!
          trap 'kill "$qualification_audio_pid" 2>/dev/null || true; wait "$qualification_audio_pid" 2>/dev/null || true; cat "$qualification_audio_dir/pulse.log"' EXIT
          for attempt in {1..50}; do
            [[ -S "$qualification_audio_dir/native" ]] && break
            sleep 0.1
          done
          [[ -S "$qualification_audio_dir/native" ]]
          pactl -s "$PULSE_SERVER" info
          npm run qualify -- --artifacts "$GITHUB_WORKSPACE/target/ci/qualification-artifacts" --sdk-root "$GITHUB_WORKSPACE/sdk" --browser "${{ matrix.browser }}" --check-matrix --self-test-mutations

  lint:
    name: fmt, clippy, doc, and hermetic policy gates
    needs: route
    if: needs.route.outputs.route == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # #1044: the hermetic host, worklet and qualification-boot suite (#288,
      # scripts/test-web-audioworklet.mjs) runs in artifact-gates, as the first line of
      # `bash scripts/test-web-audioworklet.sh`, on the same full route; it no longer runs here too.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - name: Hydrate locked Cargo dependencies
        run: cargo fetch --locked
      # fmt first: the fastest possible first failure.
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Documentation
        run: RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --no-deps
      - name: Workspace policy
        run: bash scripts/check-workspace-policy.sh
      - name: Workspace policy mutation tests
        run: bash scripts/test-workspace-policy.sh
      - name: Session dependency and compiler boundary policy
        run: |
          bash scripts/check-session-policy.sh
          bash scripts/test-session-policy.sh
      # #1043: this gate's mutation tests, and those of the benchmark-validator and conformance
      # gates below, run in gate-self-tests when a file they read changes; each gate runs here.
      - name: Environment and marker vocabulary policy
        run: bash scripts/check-env-vocabulary.sh
      - name: Bench harness duplication policy and mutation tests
        run: |
          bash scripts/check-bench-policy.sh
          bash scripts/test-bench-policy.sh
      - name: test-support CI coverage policy and mutation tests
        run: |
          python3 -B scripts/check-test-support-ci.py
          python3 -B scripts/test-test-support-ci.py
      # #1059: the reader and matcher of the shipped-artifact scalar-oracle gate, hermetically.
      # artifact-gates and audit-native run the gate itself on the built module and library.
      - name: Scalar-oracle-absent gate self-test
        run: python3 -B scripts/check-scalar-oracle-absent.py --self-test
      # #1027: every file under scripts/ outside scripts/operator/ is reached from a workflow.
      - name: Script reachability policy and mutation tests
        run: |
          python3 -B scripts/check-script-reachability.py
          python3 -B scripts/test-script-reachability.py
      - name: Console benchmark fixture integrity
        run: bash scripts/check-console-benchmark-fixture.sh
      # check-console-fixtures.sh and check-builtins-fixtures.sh (S1/S2): neither script has a
      # hermetic no-binary mode -- with no binary argument, check-console-fixtures.sh's
      # derive-intended-console-fixture.py falls back to `cargo run -q -p session-validator`
      # (debug) and check-builtins-fixtures.sh unconditionally falls back to
      # `cargo run --bin audit` whenever tools/audit exists on disk (it always does), so a bare
      # call here is a hidden debug cargo build, not a manifest-only check. Both invocations moved
      # entirely to audit-native, which already runs them a second time with the prebuilt release
      # binaries; only the hermetic mutation-test suite stays here.
      - name: Standing builtins fixture manifest mutation tests
        run: bash scripts/test-builtins-fixtures.sh
      - name: Benchmark preconditions
        run: bash scripts/check-bench-preconditions.sh
      - name: Shared host facade policy and mutation tests
        run: |
          bash scripts/check-host-core-policy.sh
          bash scripts/test-host-core-policy.sh
      - name: Protocol control typed-boundary policy and mutation tests
        run: |
          bash scripts/check-protocol-control-policy.sh
          bash scripts/test-protocol-control-policy.sh
      - name: Realtime source policy and mutation tests
        run: |
          bash scripts/check-realtime-policy.sh
          bash scripts/test-realtime-policy.sh
          bash scripts/check-realtime-audit-leak.sh
          bash scripts/test-realtime-audit-leak.sh
          bash scripts/check-artifact-evidence-leak.sh
          bash scripts/test-artifact-evidence-leak.sh
      - name: Realtime trace validator mutation tests
        run: bash scripts/test-realtime-trace-validator.sh
      - name: Lane numeric-boundary policy and mutation tests
        run: |
          bash scripts/check-lane-policy.sh
          bash scripts/test-lane-policy.sh
      - name: Unfused multiply-add seal and self-test
        run: |
          bash scripts/check-unfused-seal.sh
          bash scripts/check-unfused-seal.sh --self-test
      - name: Rack, builtins and graph dependency-boundary policy and mutation tests
        run: |
          bash scripts/check-rack-policy.sh
          bash scripts/test-rack-policy.sh
          bash scripts/check-builtins-policy.sh
          bash scripts/test-builtins-policy.sh
          bash scripts/check-graph-policy.sh
          bash scripts/test-graph-policy.sh
      - name: Effect runtime dependency-boundary and fixture policy and mutation tests
        run: |
          bash scripts/check-effect-runtime-policy.sh
          bash scripts/test-effect-runtime-policy.sh
          bash scripts/check-effect-runtime-fixtures.sh
          bash scripts/test-effect-runtime-fixtures.sh
      # check-effect-contract.sh has no hermetic no-binary mode either (S1): with no bench binary
      # argument it falls back to `cargo run --locked --release -q -p bench`, a full release build
      # inside the lint shard. audit-native runs the whole script (the factory-count grep and the
      # bench conformance record) once, with the prebuilt release bench binary. The step above is
      # the one run of the effect-runtime policy and fixture scripts; the contract script no longer
      # repeats them (#1044).
      - name: Conformance boundaries
        run: bash scripts/check-conformance-boundaries.sh
      # The rg half of the former parametric-eq target script (design §6.2/implementation issue
      # 5): a hermetic render-contract seal with no cargo build.
      - name: Parametric EQ render-contract seal
        run: bash scripts/check-parametric-eq-render-contract.sh
      - name: Release shape policy self-test
        run: python3 -B scripts/check-release-shape.py --self-test
      - name: npm publish mode reachability and trust gates
        run: python3 -B scripts/test-npm-publish-modes.py
      - name: Stem store V1 gate (mutation ledger moved to nightly)
        run: node scripts/check-stem-store-v1.mjs
      # The stem-identity corpus's only consumer in this repository (#1033): the release CLI copies
      # these frozen bytes, and the Rust oracle that used to read them is gone (#1035).
      - name: Stem identity corpus drift check
        run: python3 -B fixtures/stem-identity/v1/generate.py --check
      # x86-probes job folded in (design §6.2): three distinct sub-v3-refusal claims, dominated by
      # toolchain install, which lint already paid for.
      - name: Sub-v3 builds are refused by the lane guard (scalar)
        run: |
          ! CARGO_TARGET_DIR=target/ci/x86-scalar RUSTFLAGS='-C target-cpu=x86-64 -C target-feature=-avx2,-fma' cargo check --locked -p engine -p target-smoke -p math 2>/tmp/ci-scalar-probe.log
          grep -q 'requires x86-64-v3' /tmp/ci-scalar-probe.log
          ! rustc --print cfg -C target-cpu=x86-64 -C target-feature=-avx2,-fma | grep -qx 'target_feature="avx2"'
          ! rustc --print cfg -C target-cpu=x86-64 -C target-feature=-avx2,-fma | grep -qx 'target_feature="fma"'
      - name: Sub-v3 builds are refused by the lane guard (AVX2 without FMA)
        run: |
          ! CARGO_TARGET_DIR=target/ci/x86-avx2 RUSTFLAGS='-C target-cpu=x86-64 -C target-feature=+avx2,-fma' cargo check --locked -p engine -p target-smoke -p math 2>/tmp/ci-avx2-probe.log
          grep -q 'requires x86-64-v3' /tmp/ci-avx2-probe.log
          rustc --print cfg -C target-cpu=x86-64 -C target-feature=+avx2,-fma | grep -qx 'target_feature="avx2"'
          ! rustc --print cfg -C target-cpu=x86-64 -C target-feature=+avx2,-fma | grep -qx 'target_feature="fma"'
      - name: AVX2 with FMA compile probe and cfg assertion
        run: |
          CARGO_TARGET_DIR=target/ci/x86-avx2fma RUSTFLAGS='-C target-cpu=x86-64 -C target-feature=+avx2,+fma' cargo check --locked -p engine -p target-smoke -p math -p builtins -p builtins-compiler -p effect-runtime -p gate-expander -p multiband-compressor -p parametric-eq -p soft-clip
          rustc --print cfg -C target-cpu=x86-64 -C target-feature=+avx2,+fma | grep -qx 'target_feature="avx2"'
          rustc --print cfg -C target-cpu=x86-64 -C target-feature=+avx2,+fma | grep -qx 'target_feature="fma"'

  test-debug-a:
    name: workspace debug tests (minus DSP crates and evidence tools)
    needs: route
    if: needs.route.outputs.route == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test-debug-a
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      # Every DSP crate moves to test-debug-b; audit/bench/console-workload/wasm-* move to
      # audit-native and wasm-guests in release. Explicit --features (design §10 finding 1): a
      # local reproduction must name the same features to compile the same program. Dev-dependency
      # unification would turn on builtins-compiler and graph test-support anyway; nothing turns on
      # host-web, host-core, effect-compiler or protocol test-support, whose gated tests never ran
      # before #1021. scripts/check-test-support-ci.py (lint job) fails when a workspace
      # test-support feature is left out of every whole-package cargo test step.
      - name: Workspace debug tests (excluding DSP crates, audit, and wasm evidence tools)
        run: |
          cargo test --locked --workspace --all-targets \
            --exclude lane --exclude math --exclude effect-runtime --exclude delay \
            --exclude compressor --exclude multiband-compressor --exclude gate-expander \
            --exclude true-peak-limiter --exclude transient-shaper --exclude soft-clip \
            --exclude parametric-eq --exclude builtins --exclude dsp-reference \
            --exclude conformance --exclude audit --exclude bench --exclude console-workload \
            --exclude wasm-gates --exclude wasm-gate-guest \
            --exclude wasm-gate-corpus \
            --features builtins-compiler/test-support,graph/test-support,host-web/test-support,host-core/test-support,effect-compiler/test-support,protocol/test-support,engine/realtime-audit

  test-debug-b:
    name: DSP crates debug tests
    needs: route
    if: needs.route.outputs.route == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test-debug-b
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      # Explicit --features, as in test-debug-a: a local reproduction names the same features.
      # parametric-eq and builtins test-support turn on gated pass-count and peak-merge assertions
      # inside tests that run either way; nothing in this package set forwards them (#1021).
      # lane/test-support compiles the test-only `Backend::Scalar` oracle (#1059); the builtins
      # and compressor dev-dependencies unify it in anyway, and naming it keeps that explicit.
      - name: DSP crates debug tests (lane feature unification pinned explicitly)
        run: |
          cargo test --locked --all-targets \
            -p lane -p math -p effect-runtime -p delay -p compressor -p multiband-compressor \
            -p gate-expander -p true-peak-limiter -p transient-shaper -p soft-clip \
            -p parametric-eq -p builtins -p dsp-reference -p conformance \
            --features math/lane,parametric-eq/test-support,builtins/test-support,lane/test-support
      - name: Conformance research-fixture completeness
        run: cargo run --locked -p conformance --example conformance_fixtures -- --check

  test-release:
    name: release-mode lane, math, and wasm-gates digest gates
    needs: route
    if: needs.route.outputs.route == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: test-release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      # wasm-gates' G5 test `g5_native_digests_match_pins` is the one native owner of every
      # cross-target digest corpus (#1048); wasm-guests leaves the script's native leg to it.
      - name: Lane and math gates (G1-G4, G6, P1, M1-M3) and wasm-gates G5/G6 in release
        run: cargo test --locked --release -p lane -p math -p wasm-gates --features math/lane
      # #1044: the step above runs M3 (`m3_determinism`) with FMA on, because `.cargo/config.toml`
      # builds every x86-64 target with +avx2,+fma and `lane` refuses to compile without both. The
      # retired "Math M3 digests on an FMA-enabled build" step replaced those flags with +fma alone,
      # a build that ships nowhere. This prints the cfg cargo gives that step's `math` (no
      # dependency is built: `math` has none without `lane`), and fails without FMA.
      - name: M3's leg is built with FMA (cargo's cfg for math)
        run: cargo rustc --locked --release -p math --lib -- --print cfg | grep -x 'target_feature="fma"'
      # Own CARGO_TARGET_DIR per distinct RUSTFLAGS (design §8): a per-crate override must not
      # invalidate the shared release target dir's fingerprints for every step after it.
      - name: Realtime race model (engine SPSC loom leg)
        run: CARGO_TARGET_DIR=target/ci/loom RUSTFLAGS='--cfg loom --check-cfg=cfg(loom)' cargo test --locked --release -p engine --lib spsc_loom
      - name: Math M1 exhaustive sweep
        if: needs.route.outputs.math_closure == 'true'
        run: cargo test --locked --release -p math --features lane --test m1_exhaustive -- --ignored
      - name: Fast dB tier gate F1, exhaustive over both operating domains
        if: needs.route.outputs.math_closure == 'true'
        run: cargo test --locked --release -p math --features lane --test f1_fast_db_bounds -- --ignored

  audit-native:
    name: release audit, trace, and fixture gates
    needs: route
    if: needs.route.outputs.route == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: audit-native
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install pinned Rust toolchain and strace
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          sudo apt-get update
          sudo apt-get install -y ripgrep strace
      # One release build backs every audit/trace/probe/fixture/capi/determinism step below,
      # instead of each re-paying its own release compile (design §5: this is what moves 470s of
      # tools/audit unit-test execution and ~330s of per-crate release re-runs out of the debug
      # workspace run without losing their claims).
      - name: Build release audit, bench, capi, and session-validator binaries
        run: cargo build --locked --release -p audit -p bench -p capi -p session-validator
      - name: Audit and console-workload unit tests in release
        run: cargo test --locked --release -p audit -p bench -p console-workload
      - name: Issue-544 C ABI runtime caller audit
        run: |
          set -o pipefail
          set +e
          ./target/release/audit capi 2>target/issue544-capi-audit.stderr | tee target/issue544-capi-audit.json
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          if (( pipeline_status[0] != 0 )); then exit "${pipeline_status[0]}"; fi
          if (( pipeline_status[1] != 0 )); then exit "${pipeline_status[1]}"; fi
      - name: Validate Issue-544 runtime audit records
        run: |
          python3 -B - target/issue544-capi-audit.json <<'PY'
          import json
          import re
          import sys

          def record(path):
              text = open(path, "r", encoding="utf-8", newline="").read()
              lines = text.splitlines()
              if len(lines) != 1 or not lines[0].strip():
                  raise AssertionError(f"{path}: expected exactly one nonempty JSON record")

              def pairs(items):
                  result = {}
                  for key, value in items:
                      if key in result:
                          raise AssertionError(f"{path}: duplicate key {key}")
                      result[key] = value
                  return result

              value = json.loads(lines[0], object_pairs_hook=pairs)
              if type(value) is not dict:
                  raise AssertionError(f"{path}: record is not an object")
              return value

          def exact_keys(obj, expected, path):
              if set(obj) != set(expected):
                  raise AssertionError(f"{path}: keys differ: {sorted(obj)}")

          def integer(value, field, path):
              if type(value) is not int:
                  raise AssertionError(f"{path}: {field} is not an integer")
              return value

          (capi_path,) = sys.argv[1:]
          capi = record(capi_path)
          capi_expected = {
              "schema_version", "kind", "calls", "sample_rate_hz", "quantum_frames",
              "stable_output_address", "pcm_digest", "render_errors", "allocations",
              "deallocations", "locks", "feature_detection", "logs", "file_io",
              "network_io", "syscalls", "panic_unwinds", "total_violations",
          }
          exact_keys(capi, capi_expected, capi_path)
          if type(capi["schema_version"]) is not int or capi["schema_version"] != 1:
              raise AssertionError(f"{capi_path}: schema_version")
          if capi["kind"] != "issue022_capi_render_audit":
              raise AssertionError(f"{capi_path}: kind")
          for field, expected in {
              "calls": 100000, "sample_rate_hz": 48000, "quantum_frames": 128,
              "render_errors": 0, "allocations": 0, "deallocations": 0, "locks": 0,
              "feature_detection": 0, "logs": 0, "file_io": 0, "network_io": 0,
              "syscalls": 0, "panic_unwinds": 0, "total_violations": 0,
          }.items():
              if integer(capi[field], field, capi_path) != expected:
                  raise AssertionError(f"{capi_path}: {field} != {expected}")
          if type(capi["stable_output_address"]) is not bool or not capi["stable_output_address"]:
              raise AssertionError(f"{capi_path}: stable_output_address")
          if type(capi["pcm_digest"]) is not str or re.fullmatch(r"[0-9a-f]{16}", capi["pcm_digest"]) is None:
              raise AssertionError(f"{capi_path}: pcm_digest")
          PY
      - name: Delay realtime allocation and syscall audit
        run: ./target/release/audit delay --blocks 100000
      - name: Compressor realtime allocation and syscall audit
        run: ./target/release/audit compressor --blocks 100000
      - name: Parametric EQ realtime allocation and syscall audit
        run: ./target/release/audit parametric-eq --blocks 100000
      - name: Gate/expander realtime audit (100,000 blocks, W8 bank and connected scalar)
        run: |
          ./target/release/audit gate-expander | tee target/gate-expander-audit.json
          grep -q '"total_violations":0' target/gate-expander-audit.json
      - name: Builtins realtime audit (1,000,000 blocks, direct chain and graph)
        run: |
          bash scripts/trace-builtins-audit.sh target/release/audit
          bash scripts/trace-builtins-graph-audit.sh target/release/audit
      - name: Graph realtime audit
        run: bash scripts/trace-graph-audit.sh target/release/audit
      - name: Protocol caller-buffer allocation audit
        run: bash scripts/run-protocol-allocation-audit.sh target/release/audit
      - name: Realtime audit hooks and syscall trace
        run: |
          bash scripts/test-realtime-audit-probes.sh realtime target/release/audit
          timeout 120s bash scripts/trace-realtime-audit.sh target/release/audit 1000000
      - name: Builtins and builtins-graph audit probe mutation tests
        run: |
          bash scripts/test-realtime-audit-probes.sh builtins target/release/audit
          bash scripts/test-realtime-audit-probes.sh builtins-graph target/release/audit
      - name: Native effect one-million-call allocation and syscall audit
        run: timeout 180s bash scripts/trace-effect-contract-audit.sh target/release/bench 1000000
      # G1: compiles a C++17 header consumer and a C11 fixture at -Wall -Wextra -Werror
      # -pedantic, links the real libcapi.so, diffs its exported symbols against the frozen ABI V1
      # list, and executes the fixture. Builds capi in release itself (the shipped-crate link
      # proof, design §6.7); the release build above already primed the target dir.
      - name: C ABI linkage, frozen symbol set, native consumer smoke test, and self-test
        run: |
          bash scripts/check-capi-abi.sh
          bash scripts/check-capi-abi.sh --self-test
      # #1059: check-capi-abi.sh just built `-p capi` alone, which is the shipped feature set (the
      # shard's four-package build unifies audit's graph/test-support in, so it is not). That
      # library must contain no whole-plan scalar path.
      - name: Shipped C ABI library contains no whole-plan scalar path
        run: python3 -B scripts/check-scalar-oracle-absent.py --native target/release/libcapi.so
      # G2: HashMap iteration order is per-process, so this runs `graph_fixture` fresh 100 times.
      - name: Graph fresh-process determinism (100 fresh processes)
        run: bash scripts/check-graph-determinism.sh
      # Full audit half of the fixture checks (design §6.2 split): lint already ran the
      # manifest-only half; this half exercises the release audit/session-validator binaries.
      - name: Builtins fixture corpus audit
        run: bash scripts/check-builtins-fixtures.sh . target/release/audit
      - name: Standing console fixtures against the release session-validator
        run: bash scripts/check-console-fixtures.sh target/release/session_validator
      # check-effect-contract.sh's factory-count completeness grep and release conformance bench.
      # The effect-runtime policy and fixture scripts it used to re-run run once, in lint (#1044).
      - name: Native effect runtime conformance bench
        run: bash scripts/check-effect-contract.sh target/release/bench

  wasm-guests:
    name: wasm guest legs and cross-target wasm checks under wasmtime
    needs: route
    if: needs.route.outputs.route == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: wasm-guests
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install pinned Rust toolchain, Wasm standard library, and wabt
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup target add --toolchain 1.97.1 wasm32-unknown-unknown
          sudo apt-get update
          sudo apt-get install -y ripgrep wabt
      # Builds its own wasmtime runner rather than depending on test-release, so nothing
      # serializes between the two jobs (design deliverable B).
      - name: Build the wasmtime runner
        run: cargo build --locked --release -p wasm-gates
      # #1062 (owner ruling 2026-09-28, decision 7): the scalar (non-simd128) wasm build, its
      # atomics inspection and its evidence-crate, protocol-parity and G5 legs are retired; lane
      # refuses that build. docs/TARGET_MATRIX.md names the check that took over each claim.
      # SIMD128 18-package build deleted (design §6.3: host-web's simd128 closure is already built
      # by the artifact job); only the compile-probe claim over target-smoke/protocol survives.
      - name: SIMD128 compile probe (target-smoke and protocol)
        run: |
          CARGO_TARGET_DIR=target/ci/wasm-simd RUSTFLAGS='-C target-feature=+simd128' cargo check --locked --target wasm32-unknown-unknown -p target-smoke -p protocol
          rustc --print cfg --target wasm32-unknown-unknown -C target-feature=+simd128 | grep -qx 'target_feature="simd128"'
      - name: Evidence crates compile for Wasm (not an artifact)
        run: |
          CARGO_TARGET_DIR=target/ci/wasm-simd RUSTFLAGS='-C target-feature=+simd128' cargo check --locked --target wasm32-unknown-unknown -p dsp-reference -p conformance
      - name: Issue-005 simd128 protocol golden parity
        run: bash scripts/check-protocol-wasm-parity.sh
      # Gate G5's wasm leg: the frozen corpus (lane cases and every delegated family's pins)
      # replayed under wasmtime with simd128, plus the detector-residency and f64-lane
      # lowering pins. `--without-native` (#1048): the native leg is the Rust test
      # `g5_native_digests_match_pins` in `test-release`, in the shipping profile, so it is not run a
      # second time here. `--without-v8-spill` (#1009): the script's V8 spill leg runs in
      # `artifact-gates`, on the downloaded, digest-verified artifact, rather than on a second fat-LTO
      # build of it here. check-ci-path-routing.py refuses either flag without its pairing.
      - name: WebAssembly cross-target digest gates
        run: bash scripts/run-wasm-gates.sh --without-v8-spill --without-native
      - name: Upload cross-target gate evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wasm-gates
          path: target/ci/wasm-gates/wasm-gates.jsonl
          if-no-files-found: error
          overwrite: true

  cross-target:
    name: native, AArch64 and wasm cross-target checks
    needs: route
    if: needs.route.outputs.route == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: cross-target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # armv7-linux-androideabi is installed only so check-cross-targets.sh can prove lane refuses
      # it (#1041: mobile ships 64-bit only); nothing is built for it. aarch64-apple-ios and
      # aarch64-linux-android are the mobile product targets (#1017): the product crates are
      # checked and linted for both, and their iOS release assembly is scanned (#1018).
      - name: Install pinned Rust toolchain, cross targets, and ripgrep
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy
          rustup target add --toolchain 1.97.1 wasm32-unknown-unknown armv7-linux-androideabi aarch64-apple-ios aarch64-linux-android
          sudo apt-get update
          sudo apt-get install -y ripgrep
      # Replaces check-parametric-eq-targets.sh's and check-builtins-targets.sh's cargo halves with
      # one script, one cached target dir per triple (WP-3 contract). The render-contract rg half
      # moved to lint.
      - name: Cross-target cargo checks (AArch64 iOS/Android product crates, parametric-eq, builtins, effect-compiler)
        run: bash scripts/check-cross-targets.sh

  # Issue #1017: native AArch64 (iOS and Android arm64) is a product target, so its tests run on
  # arm64 hardware, where lane::Backend is Simd4 (NEON) and lane::fpenv pins FPCR. Two jobs in
  # parallel keep the wall time inside the x86 jobs'. scripts/run-aarch64-tests.sh owns the package
  # lists, the no-silent-skip gate and the known defects' expected failures, by name. `-D warnings`
  # makes an aarch64-only warning red here as well as in cross-target's clippy rows. The arm64
  # image is a partner image: rustup is installed if it is absent, before the cache (whose key
  # reads rustc).
  aarch64-debug:
    name: AArch64 product crate debug tests (NEON Simd4, FPCR)
    needs: route
    if: needs.route.outputs.route == 'full'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain and ripgrep
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install 1.97.1 --profile minimal
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: aarch64-debug
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Product crate debug tests on arm64, known defects as named expected failures
        run: bash scripts/run-aarch64-tests.sh debug

  aarch64-release:
    name: AArch64 release digest gates and realtime audits (NEON Simd4, FPCR)
    needs: route
    if: needs.route.outputs.route == 'full'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain and ripgrep
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup toolchain install 1.97.1 --profile minimal
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: aarch64-release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # #1048: g5_native_digests_match_pins is the one native owner of the cross-target digest
      # corpora; on arm64 it proves phones render the x86 and browser pins. Its own unfiltered
      # step, so no expected-failure row or skip can reach it.
      - name: G5 class-A corpus on arm64 (the native owner, #1048)
        run: cargo test --locked --release -p wasm-gates --features math/lane
      - name: Release lane and math gates, console digests and realtime audits on arm64, known defects as named expected failures
        run: bash scripts/run-aarch64-tests.sh release

  release-shape:
    name: release shape and panic-clobber policy
    needs: route
    if: needs.route.outputs.route == 'full' && needs.route.outputs.release_inputs == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install ripgrep (not on the runner image; every policy script greps with rg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: release-shape
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      # cargo-metadata asserts the cdylib/staticlib set is exactly {capi, host-web,
      # wasm-gate-guest} and [profile.release].panic == "abort".
      - name: Release shape policy
        run: python3 -B scripts/check-release-shape.py
      # The panic-variant filename clobber (docs/REALTIME_DEPENDENCY_POLICY.md) is prevented by
      # construction by the release panic=abort override; this proves the workspace still links
      # under the override, metadata-only + check-only, no fat-LTO link (design §6.7).
      - name: Workspace release check under the unwind override
        run: CARGO_PROFILE_RELEASE_PANIC=unwind cargo check --locked --release --workspace --all-targets

  # Issue #1043: a script gate's self-test suite can change its verdict only when a file it reads
  # changes, so each suite runs here only then -- its gate still runs on every change, in lint, sdk
  # or docs-gates -- and every night in nightly.yml. `self_tests` is the router's JSON list of the
  # suites whose key (scripts/ci-path-router.py SELF_TEST_INPUTS) a changed path hits; the verdict
  # expects this job to succeed exactly when that list is not empty.
  gate-self-tests:
    name: script-gate self-tests (a gate or a file its suite reads changed)
    needs: route
    if: needs.route.outputs.self_tests != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install ripgrep (not on the runner image; the conformance and research gates grep with rg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - name: Environment and marker vocabulary mutation tests
        if: contains(fromJSON(needs.route.outputs.self_tests), 'env-vocabulary')
        run: bash scripts/test-env-vocabulary.sh
      - name: Conformance boundary mutation tests
        if: contains(fromJSON(needs.route.outputs.self_tests), 'conformance-boundaries')
        run: bash scripts/test-conformance-boundaries.sh
      - name: Console benchmark validator and runner mutation tests
        if: contains(fromJSON(needs.route.outputs.self_tests), 'console-benchmark')
        run: bash scripts/test-console-benchmark.sh
      - name: SDK deletion gate self-test
        if: contains(fromJSON(needs.route.outputs.self_tests), 'sdk-deletions')
        run: python3 -B scripts/check-sdk-deletions.py --self-test
      - name: DSP research gate mutation tests
        if: contains(fromJSON(needs.route.outputs.self_tests), 'dsp-research')
        run: bash scripts/test-dsp-research.sh

  verdict:
    name: qualification
    if: always()
    needs: [route, docs-gates, artifact, artifact-identity, artifact-record, sdk, artifact-gates, browser, lint, test-debug-a, test-debug-b, test-release, audit-native, wasm-guests, cross-target, aarch64-debug, aarch64-release, release-shape, gate-self-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    env:
      ROUTE_RESULT: ${{ needs.route.result }}
      ROUTE: ${{ needs.route.outputs.route }}
      RELEASE_INPUTS: ${{ needs.route.outputs.release_inputs }}
      SELF_TESTS: ${{ needs.route.outputs.self_tests }}
      DOCS_GATES_RESULT: ${{ needs.docs-gates.result }}
      ARTIFACT_RESULT: ${{ needs.artifact.result }}
      ARTIFACT_IDENTITY_RESULT: ${{ needs.artifact-identity.result }}
      ARTIFACT_RECORD_RESULT: ${{ needs.artifact-record.result }}
      SDK_RESULT: ${{ needs.sdk.result }}
      ARTIFACT_GATES_RESULT: ${{ needs.artifact-gates.result }}
      BROWSER_RESULT: ${{ needs.browser.result }}
      LINT_RESULT: ${{ needs.lint.result }}
      TEST_DEBUG_A_RESULT: ${{ needs.test-debug-a.result }}
      TEST_DEBUG_B_RESULT: ${{ needs.test-debug-b.result }}
      TEST_RELEASE_RESULT: ${{ needs.test-release.result }}
      AUDIT_NATIVE_RESULT: ${{ needs.audit-native.result }}
      WASM_GUESTS_RESULT: ${{ needs.wasm-guests.result }}
      CROSS_TARGET_RESULT: ${{ needs.cross-target.result }}
      AARCH64_DEBUG_RESULT: ${{ needs.aarch64-debug.result }}
      AARCH64_RELEASE_RESULT: ${{ needs.aarch64-release.result }}
      RELEASE_SHAPE_RESULT: ${{ needs.release-shape.result }}
      GATE_SELF_TESTS_RESULT: ${{ needs.gate-self-tests.result }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # A static expectation table, not a leaf `if:` echoed back at itself: a leaf whose `if:`
      # drifts from this table fails the verdict in both directions -- a job that ran when it
      # should not have, and a job that was skipped when it should have run (design §7).
      - name: Enforce the qualification expectation table
        run: |
          set -euo pipefail
          [[ "$ROUTE_RESULT" == success ]] || { echo "router result: $ROUTE_RESULT" >&2; exit 1; }
          case "$ROUTE" in
            evidence|sdk|full) ;;
            *) echo "unknown route: $ROUTE" >&2; exit 1 ;;
          esac
          # Issue #1043: the router's compact JSON list of selected self-test suites; `[]` is none.
          [[ "$SELF_TESTS" =~ ^\[(\"[a-z-]+\"(,\"[a-z-]+\")*)?\]$ ]] || { echo "malformed self_tests: $SELF_TESTS" >&2; exit 1; }
          docs_expected=skipped
          artifact_expected=skipped
          full_expected=skipped
          release_shape_expected=skipped
          record_expected=skipped
          self_tests_expected=skipped
          case "$ROUTE" in
            evidence)
              docs_expected=success
              ;;
            sdk)
              artifact_expected=success
              ;;
            full)
              docs_expected=success
              artifact_expected=success
              full_expected=success
              [[ "$RELEASE_INPUTS" == "true" ]] && release_shape_expected=success
              ;;
          esac
          # Issue #1061: main's record is posted on a push to main that built the module, only.
          [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main && "$artifact_expected" == success ]] && record_expected=success
          # Issue #1043: the self-test suites run, on any route, exactly when the router selected one.
          [[ "$SELF_TESTS" != '[]' ]] && self_tests_expected=success
          failed=0
          check() {
            local name=$1 actual=$2 expected=$3
            [[ "$actual" == "$expected" ]] || { echo "$name: expected $expected, got $actual" >&2; failed=1; }
          }
          check docs-gates "$DOCS_GATES_RESULT" "$docs_expected"
          check artifact "$ARTIFACT_RESULT" "$artifact_expected"
          check artifact-identity "$ARTIFACT_IDENTITY_RESULT" "$artifact_expected"
          check artifact-record "$ARTIFACT_RECORD_RESULT" "$record_expected"
          check sdk "$SDK_RESULT" "$artifact_expected"
          check artifact-gates "$ARTIFACT_GATES_RESULT" "$full_expected"
          check browser "$BROWSER_RESULT" "$full_expected"
          check lint "$LINT_RESULT" "$full_expected"
          check test-debug-a "$TEST_DEBUG_A_RESULT" "$full_expected"
          check test-debug-b "$TEST_DEBUG_B_RESULT" "$full_expected"
          check test-release "$TEST_RELEASE_RESULT" "$full_expected"
          check audit-native "$AUDIT_NATIVE_RESULT" "$full_expected"
          check wasm-guests "$WASM_GUESTS_RESULT" "$full_expected"
          check cross-target "$CROSS_TARGET_RESULT" "$full_expected"
          check aarch64-debug "$AARCH64_DEBUG_RESULT" "$full_expected"
          check aarch64-release "$AARCH64_RELEASE_RESULT" "$full_expected"
          check release-shape "$RELEASE_SHAPE_RESULT" "$release_shape_expected"
          check gate-self-tests "$GATE_SELF_TESTS_RESULT" "$self_tests_expected"
          [[ "$failed" == 0 ]] || exit 1
      # Issue #1061: every PR says whether the shipped module changed. The artifact routes say it in
      # `artifact-identity`'s summary; the evidence route builds no module, because every path it
      # admits is documentation that no build reads.
      - name: Report the shipped artifact on the evidence route
        if: needs.route.outputs.route == 'evidence'
        run: |
          echo "ARTIFACT UNCHANGED: not built; the evidence route admits documentation only, which no build reads" >> "$GITHUB_STEP_SUMMARY"
      # Best-effort observability (design §11): never masks the verdict above, which has already
      # exited by the time this runs on a failing route.
      - name: Publish per-job CI telemetry
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100" > jobs.json
          python3 -B scripts/ci-telemetry.py --jobs jobs.json --route "$ROUTE" \
            --attempt "${{ github.run_attempt }}" --out ci-telemetry.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload CI telemetry artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-telemetry-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-telemetry.json
          if-no-files-found: ignore
          overwrite: true
