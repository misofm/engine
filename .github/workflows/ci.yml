name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.97.1

jobs:
  host:
    name: host quality and native shell
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --workspace --all-targets
      - name: Documentation
        run: RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --no-deps
      - name: Workspace policy
        run: bash scripts/check-workspace-policy.sh
      - name: Session dependency and compiler boundary policy
        run: bash scripts/check-session-policy.sh
      - name: Workspace policy mutation tests
        run: bash scripts/test-workspace-policy.sh
      # #104 phase C: one MISO_ENGINE_ prefix, one name per fact, documented in
      # docs/ENGINE_ENV_VOCABULARY.md. The checker is bidirectional -- an undocumented name and an
      # unused row both fail -- because #104 F2 was a runner and its binary agreeing on nothing.
      - name: Environment and marker vocabulary policy and mutation tests
        run: |
          bash scripts/check-env-vocabulary.sh
          bash scripts/test-env-vocabulary.sh
      # #104 F4/phase B: one audited allocator, one JSON escaper, one nearest-rank percentile and
      # one counted digest sink under tools/, and the ratchet listing the subjects already moved
      # onto the shared timer.
      - name: Bench harness duplication policy and mutation tests
        run: |
          bash scripts/check-bench-policy.sh
          bash scripts/test-bench-policy.sh
      # The fixture is the workload: a console record measured against a drifted fixture is
      # measuring something other than what it claims. The check previously ran only inside the
      # manual bench runner, so drift could not surface until the next authorised measurement --
      # which is exactly the one run that must not discover a broken input. It is a pure grep
      # gate over a committed fixture, so it belongs with the cheap policy gates.
      - name: Console benchmark fixture integrity
        run: bash scripts/check-console-benchmark-fixture.sh
      # The #163 phase 2 wasm console arm's validator, exercised by mutation. Hermetic: it never
      # instantiates a guest, never holds a clock and never touches the one-shot artifacts, so it
      # belongs with the cheap gates rather than behind the runner that consumes the measurement.
      - name: Wasm console benchmark validator mutation tests
        run: bash scripts/test-wasm-console-benchmark.sh
      - name: Shared host facade policy and mutation tests
        run: |
          bash scripts/check-host-core-policy.sh
          bash scripts/test-host-core-policy.sh
      - name: Protocol control typed-boundary policy and mutation tests
        run: |
          bash scripts/check-protocol-control-policy.sh
          bash scripts/test-protocol-control-policy.sh
      - name: Realtime source policy and mutation tests
        run: |
          bash scripts/check-realtime-policy.sh
          bash scripts/test-realtime-policy.sh
          bash scripts/check-realtime-audit-leak.sh
          bash scripts/test-realtime-audit-leak.sh
          bash scripts/check-artifact-evidence-leak.sh
          bash scripts/test-artifact-evidence-leak.sh
      - name: Lane numeric-boundary policy and mutation tests
        run: |
          bash scripts/check-lane-policy.sh
          bash scripts/test-lane-policy.sh
      - name: Lane gates G1-G4, G6, P1 and the issue-146 FP-environment guard on the AVX2+FMA runner
        run: cargo test --locked --release -p miso-engine-lane
      - name: Deterministic math policy and mutation tests
        run: |
          bash scripts/check-math-policy.sh
          bash scripts/test-math-policy.sh
      - name: Math gates M1, M2 and M3 in release
        run: cargo test --locked --release -p miso-engine-math --features lane
      - name: Math M3 digests on an FMA-enabled build
        run: RUSTFLAGS='-C target-feature=+fma' cargo test --locked --release -p miso-engine-math --test m3_determinism
      - name: Math M1 exhaustive sweep
        run: cargo test --locked --release -p miso-engine-math --features lane --test m1_exhaustive -- --ignored
      - name: Fast dB tier seal and mutation tests
        run: |
          bash scripts/check-fast-db-seal.sh
          bash scripts/test-fast-db-seal.sh
      - name: Fast dB tier gate F1, exhaustive over both operating domains
        run: cargo test --locked --release -p miso-engine-math --features lane --test f1_fast_db_bounds -- --ignored
      - name: Effect runtime gates (lane identity, partition invariance, D1 digests) in release
        run: cargo test --locked --release -p miso-engine-effect-runtime
      - name: Delay gates (partition invariance, oracle bound, G5 digests) in release
        run: cargo test --locked --release -p miso-engine-delay --all-targets
      - name: Delay realtime allocation and syscall audit
        run: |
          cargo build --locked --release -p miso-engine-audit --bin miso_engine_audit
          ./target/release/miso_engine_audit delay --blocks 100000
      - name: Multiband compressor gates in release (audit #94)
        run: cargo test --locked --release -p miso-engine-multiband-compressor
      - name: Soft-clip gates (polyphase identity, lane identity, partitions, digests) in release
        run: cargo test --locked --release -p miso-engine-soft-clip
      - name: Parametric EQ gates (oracle grid, impulses, lane identity, partitions, digests) in release
        run: cargo test --locked --release -p miso-engine-parametric-eq
      - name: Parametric EQ target and render-contract seal
        run: |
          rustup target add --toolchain 1.97.1 wasm32-unknown-unknown aarch64-linux-android aarch64-apple-ios
          bash scripts/check-parametric-eq-targets.sh
      - name: Parametric EQ realtime allocation and syscall audit
        run: |
          cargo build --locked --release -p miso-engine-audit --bin miso_engine_audit
          ./target/release/miso_engine_audit parametric-eq --blocks 100000
      - name: Gate/expander gates (oracle bound, lane identity, partition, state, digests) in release
        run: cargo test --locked --release -p miso-engine-gate-expander
      - name: Gate/expander realtime audit (100,000 blocks, W8 bank and connected scalar)
        run: |
          cargo build --locked --release -p miso-engine-audit --bin miso_engine_audit
          ./target/release/miso_engine_audit gate-expander | tee target/gate-expander-audit.json
          grep -q '"total_violations":0' target/gate-expander-audit.json
      - name: Builtins gates (reference recurrence, lane identity, partitions, digests) in release
        run: cargo test --locked --release -p miso-engine-builtins
      - name: Builtins realtime audit (1,000,000 blocks, direct chain and graph)
        run: |
          bash scripts/trace-builtins-audit.sh
          bash scripts/trace-builtins-graph-audit.sh
      - name: Native effect runtime policy, fixtures, conformance, and mutations
        run: bash scripts/check-effect-contract.sh
      - name: Protocol caller-buffer allocation audit
        run: bash scripts/run-protocol-allocation-audit.sh
      - name: Protocol benchmark runner build and negative argument checks (no benchmark)
        run: |
          cargo check --locked -p miso-engine-bench --all-targets
          bash scripts/test-protocol-benchmark.sh
      - name: Realtime race model
        run: RUSTFLAGS='--cfg loom --check-cfg=cfg(loom)' cargo test --locked --release -p miso-engine-core spsc_loom
      - name: Realtime audit hooks and syscall trace
        run: |
          cargo build --locked --release -p miso-engine-audit
          bash scripts/test-realtime-audit-hooks.sh target/release/miso_engine_audit
          timeout 120s bash scripts/trace-realtime-audit.sh target/release/miso_engine_audit 1000000
      - name: Native effect one-million-call allocation and syscall audit
        run: |
          cargo build --locked --release -p miso-engine-bench
          timeout 180s bash scripts/trace-effect-contract-audit.sh target/release/miso_engine_bench 1000000
      - name: Conformance boundaries and research corpus
        run: |
          bash scripts/check-conformance-boundaries.sh
          bash scripts/check-dsp-research.sh
          cargo run --locked -p miso-engine-conformance --example miso_engine_conformance_fixtures -- --check
      - name: Feature-resolution tree
        run: cargo tree --locked --workspace -e features
      - name: Metadata report
        run: cargo metadata --locked --format-version 1 --no-deps
      - name: Native host smoke
        run: cargo run --locked -p miso-engine-host-native

  release-workspace:
    name: workspace release build
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      # D12 puts `panic = "abort"` on `[profile.release]`, so ONE workspace-wide release
      # invocation builds both panic variants of every crate, and the three packages whose lib
      # units carry a cdylib/staticlib crate-type emit un-hashed filenames the two variants
      # clobber. A downstream unit then links whichever variant landed last and fails with a
      # misleading `E0463: can't find crate for ...`. The runner pins a single panic variant for
      # this run; it builds no shipped artifact, so no artifact digest depends on it. See the
      # "Panic behaviour by profile" section of docs/REALTIME_DEPENDENCY_POLICY.md, and the
      # header of the script itself.
      #
      # This is its own job rather than another step on `host` so the long fat-LTO link runs in
      # parallel with the rest of CI instead of extending the critical path.
      #
      # `--no-run` is deliberate: it gates exactly the thing that rotted. The clobber is a BUILD
      # failure, it happens while compiling every test target, and `--no-run` catches it
      # deterministically -- verified both ways from clean target directories, twice green with
      # the override and still red without it.
      #
      # Running the tests is the intended end state and is NOT done yet, because repairing the
      # build made two release-only failures reachable for the first time and both predate this
      # job. No CI leg has ever run these tests in release, and the workspace release build did
      # not compile, so nothing could have run them. Both fail on `main`, with and without the
      # panic override, and both pass in debug:
      #
      #   * `observation_cost_classes_are_what_they_claim (#159)` (#143,
      #     crates/miso-engine-host-core/tests/effect_observation.rs) -- deterministic. Arming
      #     costs nothing (AllArmed sits at or below ConsoleNoCapacity), but the assertion
      #     subtracts the NoConsole baseline and so charges observation for a console existing.
      #   * `a_million_windows_are_read_whole_and_in_order (#160)` (#143,
      #     crates/miso-engine-core/tests/observation_transport.rs) -- intermittent: it failed
      #     three of five full-workspace release runs while passing 20 of 20 standalone release
      #     reruns, so it is timing-dependent rather than a plain red.
      #
      # Both are questions about what those gates assert, so they belong to their owner rather
      # than to a --skip list here. Turn this step into the full `cargo test` run once they are
      # resolved; the script already runs the tests by default.
      - name: Workspace release build (single panic variant)
        run: bash scripts/run-release-workspace-tests.sh --no-run

  x86-probes:
    name: x86 scalar and SIMD compile probes
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      # #84 phase A made core (and so every production crate) depend on miso-engine-lane, whose
      # master-plan D4 guard refuses any build below x86-64-v3 — there is no scalar fallback to
      # compile-probe any more (W2-D1 retired the sub-v3 legs). These steps now assert the guard
      # DISCRIMINATES: a sub-v3 build must fail with the pinned message, at both feature levels.
      - name: Sub-v3 builds are refused by the lane guard (scalar)
        run: |
          ! CARGO_TARGET_DIR=target/ci/x86-scalar RUSTFLAGS='-C target-cpu=x86-64 -C target-feature=-avx2,-fma' cargo check --locked -p miso-engine-core -p miso-engine-target-smoke -p miso-engine-math 2>/tmp/ci-scalar-probe.log
          grep -q 'requires x86-64-v3' /tmp/ci-scalar-probe.log
          ! rustc --print cfg -C target-cpu=x86-64 -C target-feature=-avx2,-fma | grep -qx 'target_feature="avx2"'
          ! rustc --print cfg -C target-cpu=x86-64 -C target-feature=-avx2,-fma | grep -qx 'target_feature="fma"'
      - name: Sub-v3 builds are refused by the lane guard (AVX2 without FMA)
        run: |
          ! CARGO_TARGET_DIR=target/ci/x86-avx2 RUSTFLAGS='-C target-cpu=x86-64 -C target-feature=+avx2,-fma' cargo check --locked -p miso-engine-core -p miso-engine-target-smoke -p miso-engine-math 2>/tmp/ci-avx2-probe.log
          grep -q 'requires x86-64-v3' /tmp/ci-avx2-probe.log
          rustc --print cfg -C target-cpu=x86-64 -C target-feature=+avx2,-fma | grep -qx 'target_feature="avx2"'
          ! rustc --print cfg -C target-cpu=x86-64 -C target-feature=+avx2,-fma | grep -qx 'target_feature="fma"'
      - name: AVX2 with FMA compile probe and cfg assertion
        run: |
          CARGO_TARGET_DIR=target/ci/x86-avx2fma RUSTFLAGS='-C target-cpu=x86-64 -C target-feature=+avx2,+fma' cargo check --locked -p miso-engine-core -p miso-engine-target-smoke -p miso-engine-math -p miso-engine-builtins -p miso-engine-builtins-compiler -p miso-engine-effect-runtime -p miso-engine-gate-expander -p miso-engine-multiband-compressor -p miso-engine-parametric-eq -p miso-engine-soft-clip
          rustc --print cfg -C target-cpu=x86-64 -C target-feature=+avx2,+fma | grep -qx 'target_feature="avx2"'
          rustc --print cfg -C target-cpu=x86-64 -C target-feature=+avx2,+fma | grep -qx 'target_feature="fma"'

  native-vectorization-report:
    name: native production-kernel release-probe report (non-blocking)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain and disassembler
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          sudo apt-get update
          sudo apt-get install -y llvm
      # Issue #144 item 3 starts as evidence, not a merge gate. Both the live report and its red
      # mutations are allowed to fail this step while the uploaded receipt remains inspectable.
      - name: Generate report and run red mutations
        continue-on-error: true
        run: |
          bash scripts/run-native-vectorization-report.sh
          bash scripts/test-native-vectorization-report.sh \
            target/release/miso_engine_audit
      - name: Upload native vectorization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-vectorization-report
          path: target/ci/native-vectorization/report.json

  wasm:
    name: browser Wasm artifact probes
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain and Wasm standard library
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup target add --toolchain 1.97.1 wasm32-unknown-unknown
          sudo apt-get update
          sudo apt-get install -y wabt
      - name: Browser-local realtime path has no atomic opcodes
        run: bash scripts/check-wasm-realtime-atomics.sh
      # #105 phase 2 C2: an artifact invocation names no evidence crate. Cargo unifies features
      # across the packages selected by ONE invocation, so building `miso-engine-conformance`
      # alongside `miso-engine-host-web` put core's `realtime-audit` instrumentation into the wasm
      # module that ships. The evidence crates keep their cross-target compile coverage in the
      # separate step below. `scripts/check-artifact-evidence-leak.sh` gates both halves.
      - name: Scalar Wasm release artifact
        run: |
          CARGO_TARGET_DIR=target/ci/wasm-scalar RUSTFLAGS='-C target-feature=-simd128' cargo build --locked --release --target wasm32-unknown-unknown -p miso-engine-core -p miso-engine-session -p miso-engine-effect-contract -p miso-engine-effect-compiler -p miso-engine-protocol -p miso-engine-target-smoke -p miso-engine-host-core -p miso-engine-host-web -p miso-engine-lane -p miso-engine-math -p miso-engine-builtins -p miso-engine-builtins-compiler -p miso-engine-effect-runtime -p miso-engine-gate-expander -p miso-engine-delay -p miso-engine-multiband-compressor -p miso-engine-parametric-eq -p miso-engine-soft-clip
          ! rustc --print cfg --target wasm32-unknown-unknown -C target-feature=-simd128 | grep -qx 'target_feature="simd128"'
      - name: SIMD128 Wasm release artifact
        run: |
          CARGO_TARGET_DIR=target/ci/wasm-simd RUSTFLAGS='-C target-feature=+simd128' cargo build --locked --release --target wasm32-unknown-unknown -p miso-engine-core -p miso-engine-session -p miso-engine-effect-contract -p miso-engine-effect-compiler -p miso-engine-protocol -p miso-engine-target-smoke -p miso-engine-host-core -p miso-engine-host-web -p miso-engine-lane -p miso-engine-math -p miso-engine-builtins -p miso-engine-builtins-compiler -p miso-engine-effect-runtime -p miso-engine-gate-expander -p miso-engine-delay -p miso-engine-multiband-compressor -p miso-engine-parametric-eq -p miso-engine-soft-clip
          rustc --print cfg --target wasm32-unknown-unknown -C target-feature=+simd128 | grep -qx 'target_feature="simd128"'
      # The #163 phase 2 console guest. It is dev/tooling and never ships, but it is the subject of
      # a recorded measurement family, and a guest that stopped building for wasm32 would not
      # surface until the next authorised run -- which is exactly the run that must not discover a
      # broken input.
      - name: Wasm console benchmark guest compiles for Wasm (not an artifact)
        run: |
          CARGO_TARGET_DIR=target/ci/wasm-console RUSTFLAGS='-C target-feature=+simd128' cargo build --locked --release --target wasm32-unknown-unknown -p miso-engine-wasm-console-guest -p miso-engine-console-workload
      - name: Evidence crates compile for Wasm (not an artifact)
        run: |
          CARGO_TARGET_DIR=target/ci/wasm-scalar RUSTFLAGS='-C target-feature=-simd128' cargo build --locked --release --target wasm32-unknown-unknown -p miso-engine-dsp-reference -p miso-engine-conformance
          CARGO_TARGET_DIR=target/ci/wasm-simd RUSTFLAGS='-C target-feature=+simd128' cargo build --locked --release --target wasm32-unknown-unknown -p miso-engine-dsp-reference -p miso-engine-conformance
      # #106 E1/E2/E5/E7 and the F4 native<->simd128 session parity, over the artifact that ships.
      # `build-web-audioworklet.sh` produces the one stripped simd128 module (#083 W4-D1);
      # `check-web-audioworklet.sh` asserts the frozen 28-export set, no imports, no shared memory,
      # no atomics or relaxed SIMD, the render export's allocation-free and trap-free call closure,
      # and the vector-kernel ratchet. The Python `--check` runs the raw-Wasm oracle, whose parity
      # assertion compares the artifact's rendered PCM against the digest the native test pins.
      - name: Browser AudioWorklet artifact gates and native parity
        run: |
          artifacts=$(mktemp -d)
          bash scripts/build-web-audioworklet.sh "$artifacts"
          bash scripts/check-web-audioworklet.sh "$artifacts"
          python3 -B scripts/web-audioworklet-browser-correctness.py --check --artifacts "$artifacts"
          ls -l "$artifacts"
      - name: Hermetic browser host and worklet tests
        run: bash scripts/test-web-audioworklet.sh
      - name: Issue-005 scalar and SIMD protocol golden parity
        run: bash scripts/check-protocol-wasm-parity.sh
      - name: Issue-005 protocol benchmark corpus Wasm parity (no timings)
        run: bash scripts/check-protocol-benchmark-wasm-parity.sh

  wasm-gates:
    name: cross-target digest gates under wasmtime
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain and Wasm standard library
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup target add --toolchain 1.97.1 wasm32-unknown-unknown
      # Gate G5 (master plan #83 section 3.6) and the wasm replay of gates M3 and D1: the frozen
      # corpus of tools/miso-engine-wasm-gate-corpus is run natively at Scalar/Simd4/Simd8 and
      # inside both browser artifacts (with and without simd128) under wasmtime 47.0.3, and every
      # digest is compared against pins the owning crate generated from the scalar Lane oracle.
      # A mismatch is never fixed by re-pinning: it means a target stopped agreeing with the oracle.
      - name: Native and WebAssembly cross-target digest gates
        run: bash scripts/run-wasm-gates.sh
      # Issue #146 E1. G6 over the full corpus is a standing gate, not a reproducer: with the
      # caller's MXCSR carrying FTZ+DAZ, a render that goes through an entry's canonical
      # floating-point environment lands on the frozen pins, and the unguarded control arm still
      # shows the 70 diverging rows #144 measured. Run in release, because that is the profile the
      # divergence was measured in and the one a host ships.
      - name: Gate G6 over the full corpus in release
        run: cargo test --locked --release -p miso-engine-wasm-gates
      - name: Upload cross-target gate evidence
        uses: actions/upload-artifact@v4
        with:
          name: wasm-gates
          path: target/ci/wasm-gates/wasm-gates.jsonl

  session-fuzz:
    name: bounded session parser and compiler fuzzing
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup toolchain install nightly-2026-08-20 --profile minimal
          cargo +1.97.1 install cargo-fuzz --locked --version 0.13.2
      - name: Build both fuzz targets
        run: cargo check --locked --manifest-path fuzz/Cargo.toml --bins
      - name: Run bounded parser fuzz target
        run: |
          mkdir -p target/ci/session-fuzz/parse
          export RUSTFLAGS='-C target-feature=+avx2,+fma'  # lane D4 guard; cargo-fuzz prepends this to its sanitizer flags
          cargo +nightly-2026-08-20 fuzz run session_parse target/ci/session-fuzz/parse -- -runs=10000 -seed=557074001 -seed_inputs=fixtures/session/v1/canonical.toml
      - name: Run bounded compiler fuzz target
        run: |
          mkdir -p target/ci/session-fuzz/compile
          export RUSTFLAGS='-C target-feature=+avx2,+fma'
          cargo +nightly-2026-08-20 fuzz run session_compile target/ci/session-fuzz/compile -- -runs=10000 -seed=557074002 -seed_inputs=fixtures/session/v1/canonical.toml

  protocol-fuzz:
    name: bounded issue-005 protocol decoder fuzzing
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust and cargo-fuzz toolchains
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup toolchain install nightly-2026-08-20 --profile minimal
          cargo +1.97.1 install cargo-fuzz --locked --version 0.13.2
      - name: Build bounded protocol fuzz targets
        run: cargo check --locked --manifest-path fuzz/Cargo.toml --bins
      - name: Run fixed-count native sanitizer fuzzing
        run: bash scripts/run-protocol-fuzz.sh
      - name: Upload protocol fuzz evidence
        uses: actions/upload-artifact@v4
        with:
          name: protocol-fuzz-evidence
          path: target/ci/protocol-fuzz/evidence.json

  benchmark:
    name: bounded descriptive benchmarks
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Run one descriptive two-round benchmark
        run: |
          set -o pipefail
          mkdir -p target
          bash scripts/run-conformance-benchmark.sh 2 | tee target/conformance-benchmark.jsonl
          test -f target/conformance-benchmark.jsonl && test -s target/conformance-benchmark.jsonl
      - name: Build issue-003 audit harness
        run: cargo build --locked --release -p miso-engine-audit
      - name: Run one descriptive two-round realtime benchmark
        run: |
          set -o pipefail
          mkdir -p target
          bash scripts/run-realtime-benchmark.sh 2 1000000 | tee target/realtime-benchmark.jsonl
          test -f target/realtime-benchmark.jsonl && test -s target/realtime-benchmark.jsonl
      - name: Run session benchmark once with two internal rounds
        run: |
          set -o pipefail
          mkdir -p target
          bash scripts/run-session-benchmark.sh | tee target/session-benchmark.jsonl
          test -f target/session-benchmark.jsonl && test -s target/session-benchmark.jsonl
      - name: Run native effect benchmark once with two internal rounds
        run: bash scripts/run-effect-contract-benchmark.sh
      # Issue #146 E5: what pinning the floating-point environment costs a 128-frame block.
      # Descriptive only -- the record carries no threshold and nothing gates on it.
      - name: Run one descriptive two-round FP-environment guard benchmark
        run: |
          set -o pipefail
          mkdir -p target
          bash scripts/run-fp-environment-benchmark.sh 2 1000000 | tee target/fp-environment-benchmark.jsonl
          test -s target/fp-environment-benchmark.jsonl
      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: conformance-benchmark
          path: |
            target/conformance-benchmark.jsonl
            target/realtime-benchmark.jsonl
            target/session-benchmark.jsonl
