name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.97.1

jobs:
  host:
    name: host quality and native shell
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy --component rustfmt
          sudo apt-get update
          sudo apt-get install -y ripgrep wabt
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --workspace --all-targets
      - name: Documentation
        run: RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --no-deps
      - name: Workspace policy
        run: bash scripts/check-workspace-policy.sh
      - name: Session dependency and compiler boundary policy
        run: bash scripts/check-session-policy.sh
      - name: Workspace policy mutation tests
        run: bash scripts/test-workspace-policy.sh
      # #104 phase C: one MISO_ENGINE_ prefix, one name per fact, documented in
      # docs/ENGINE_ENV_VOCABULARY.md. The checker is bidirectional -- an undocumented name and an
      # unused row both fail -- because #104 F2 was a runner and its binary agreeing on nothing.
      - name: Environment and marker vocabulary policy and mutation tests
        run: |
          bash scripts/check-env-vocabulary.sh
          bash scripts/test-env-vocabulary.sh
      # #104 F4/phase B: one audited allocator, one JSON escaper, one nearest-rank percentile and
      # one counted digest sink under tools/, and the ratchet listing the subjects already moved
      # onto the shared timer.
      - name: Bench harness duplication policy and mutation tests
        run: |
          bash scripts/check-bench-policy.sh
          bash scripts/test-bench-policy.sh
      # The fixture is the workload: a console record measured against a drifted fixture is
      # measuring something other than what it claims. The check previously ran only inside the
      # manual bench runner, so drift could not surface until the next authorised measurement --
      # which is exactly the one run that must not discover a broken input. It is a pure grep
      # gate over a committed fixture, so it belongs with the cheap policy gates.
      - name: Console benchmark fixture integrity
        run: bash scripts/check-console-benchmark-fixture.sh
      # Issue #175: the standing 64-track intended-placement and mono-collapse fixtures are
      # exactly what their generators produce -- a hand-edit would break the chain-shape and
      # collapse-witness row-pairs that depend on them silently. Previously reachable only from
      # scripts/sweep.sh, which nobody runs.
      - name: Standing console fixtures are exactly their generators' output
        run: bash scripts/check-console-fixtures.sh
      # The #163 phase 2 wasm console arm's validator, exercised by mutation. Hermetic: it never
      # instantiates a guest, never holds a clock and never touches the one-shot artifacts, so it
      # belongs with the cheap gates rather than behind the runner that consumes the measurement.
      - name: Wasm console benchmark validator mutation tests
        run: bash scripts/test-wasm-console-benchmark.sh
      - name: Shared host facade policy and mutation tests
        run: |
          bash scripts/check-host-core-policy.sh
          bash scripts/test-host-core-policy.sh
      - name: Protocol control typed-boundary policy and mutation tests
        run: |
          bash scripts/check-protocol-control-policy.sh
          bash scripts/test-protocol-control-policy.sh
      - name: Realtime source policy and mutation tests
        run: |
          bash scripts/check-realtime-policy.sh
          bash scripts/test-realtime-policy.sh
          bash scripts/check-realtime-audit-leak.sh
          bash scripts/test-realtime-audit-leak.sh
          bash scripts/check-artifact-evidence-leak.sh
          bash scripts/test-artifact-evidence-leak.sh
      - name: Lane numeric-boundary policy and mutation tests
        run: |
          bash scripts/check-lane-policy.sh
          bash scripts/test-lane-policy.sh
      # The unfused multiply-add contract's container (issue #163 phase 2). Four of its six rules
      # cannot be expressed as a clippy.toml disallowed-methods entry -- a positive-presence check
      # that both `Lane::fma` dispatch points literally contain `(self * b) + c`, a ban on `cfg`
      # inside that function body, an exact tree-wide count of 8 fused calls counted two
      # independent ways, and a refusal of the retired software-FMA *definitions* rather than
      # calls to them -- so it stays a script. Previously ran only from `scripts/sweep.sh`, which
      # nobody runs. `--self-test` is the former `scripts/test-unfused-seal.sh`, folded in so the
      # gate and its own mutation proof cannot drift apart or be wired in separately.
      - name: Unfused multiply-add seal and self-test
        run: |
          bash scripts/check-unfused-seal.sh
          bash scripts/check-unfused-seal.sh --self-test
      - name: Lane gates G1-G4, G6, P1 and the issue-146 FP-environment guard on the AVX2+FMA runner
        run: cargo test --locked --release -p lane
      - name: Math gates M1, M2 and M3 in release
        run: cargo test --locked --release -p math --features lane
      - name: Math M3 digests on an FMA-enabled build
        run: RUSTFLAGS='-C target-feature=+fma' cargo test --locked --release -p math --test m3_determinism
      - name: Math M1 exhaustive sweep
        run: cargo test --locked --release -p math --features lane --test m1_exhaustive -- --ignored
      - name: Fast dB tier gate F1, exhaustive over both operating domains
        run: cargo test --locked --release -p math --features lane --test f1_fast_db_bounds -- --ignored
      - name: Effect runtime gates (lane identity, partition invariance, D1 digests) in release
        run: cargo test --locked --release -p effect-runtime
      - name: Delay gates (partition invariance, oracle bound, G5 digests) in release
        run: cargo test --locked --release -p delay --all-targets
      - name: Delay realtime allocation and syscall audit
        run: |
          cargo build --locked --release -p audit --bin audit
          ./target/release/audit delay --blocks 100000
      - name: Multiband compressor gates in release (audit #94)
        run: cargo test --locked --release -p multiband-compressor
      # #163 phase 3: compressor, true-peak-limiter and transient-shaper are three of the ten
      # shipped native effects (AGENTS.md's initial effect library) but, unlike their siblings
      # above and below, carried no `-p`-named release-mode step -- their digest/lane-identity/
      # partition tests only ever ran under the workspace-wide debug `cargo test --workspace`.
      # Debug and release can disagree exactly where P1/P2 matter (vectorizer codegen), which is
      # why every sibling effect gets this line. `audit compressor` mirrors delay/parametric-eq's
      # realtime allocation and syscall audit; true-peak-limiter and transient-shaper have no
      # `tools/audit` subject of their own (only their own release-mode allocation.rs tests).
      - name: Compressor gates (oracle bound, lane identity, partitions, digests) in release
        run: cargo test --locked --release -p compressor
      - name: Compressor realtime allocation and syscall audit
        run: |
          cargo build --locked --release -p audit --bin audit
          ./target/release/audit compressor --blocks 100000
      - name: True-peak limiter gates (gain law, mono-collapse, determinism, allocation) in release
        run: cargo test --locked --release -p true-peak-limiter
      - name: Transient shaper gates (oracle bound, bank identity, partitions, allocation) in release
        run: cargo test --locked --release -p transient-shaper
      - name: Soft-clip gates (polyphase identity, lane identity, partitions, digests) in release
        run: cargo test --locked --release -p soft-clip
      - name: Parametric EQ gates (oracle grid, impulses, lane identity, partitions, digests) in release
        run: cargo test --locked --release -p parametric-eq
      - name: Parametric EQ target and render-contract seal
        run: |
          rustup target add --toolchain 1.97.1 wasm32-unknown-unknown aarch64-linux-android aarch64-apple-ios
          bash scripts/check-parametric-eq-targets.sh
      # Issue-007 and Issue-081's own cross-target matrices, the same shape as the parametric EQ
      # seal above. Both were previously reachable only from scripts/sweep.sh, which nobody runs
      # -- meaning builtins and the effect-interchange descriptor had no cross-target proof in CI
      # at all, only the parametric-eq sibling effect did.
      - name: Builtins and effect-interchange target matrices
        run: |
          bash scripts/check-builtins-targets.sh
          bash scripts/check-effect-interchange-targets.sh
      - name: Parametric EQ realtime allocation and syscall audit
        run: |
          cargo build --locked --release -p audit --bin audit
          ./target/release/audit parametric-eq --blocks 100000
      - name: Gate/expander gates (oracle bound, lane identity, partition, state, digests) in release
        run: cargo test --locked --release -p gate-expander
      - name: Gate/expander realtime audit (100,000 blocks, W8 bank and connected scalar)
        run: |
          cargo build --locked --release -p audit --bin audit
          ./target/release/audit gate-expander | tee target/gate-expander-audit.json
          grep -q '"total_violations":0' target/gate-expander-audit.json
      - name: Builtins gates (reference recurrence, lane identity, partitions, digests) in release
        run: cargo test --locked --release -p builtins
      - name: Builtins realtime audit (1,000,000 blocks, direct chain and graph)
        run: |
          bash scripts/trace-builtins-audit.sh
          bash scripts/trace-builtins-graph-audit.sh
      # The independent builtins fixture corpus manifest and its expected-output digests.
      # Previously reachable only from scripts/sweep.sh, which nobody runs.
      - name: Builtins fixture corpus integrity and mutation tests
        run: |
          bash scripts/check-builtins-fixtures.sh .
          bash scripts/test-builtins-fixtures.sh
      # Issue #243 eval 6: the SDK's generated TypeScript surface is a byte-for-byte re-derivation
      # from the Rust parameter-metadata registry, and the pre-boot-v2 SDK's retired spellings stay
      # deleted rather than relocated. Both are hermetic (no npm/network); the typecheck half that
      # needs `tsc` is check-sdk-types.sh, in the new `sdk` job below, and the behavioural half that
      # needs the shipped module is check-sdk-headless.sh, in the `wasm` job below. All four SDK
      # gates were previously reachable only from scripts/sweep.sh, which nobody runs; one of them
      # (check-sdk-types.sh) could not run there at all -- it exits 2 without `sdk/node_modules`,
      # which the sweep's hermetic charter cannot provide.
      - name: SDK generated-surface drift and retired-spelling deletion gates
        run: |
          bash scripts/check-sdk-generated.sh
          python3 -B scripts/check-sdk-deletions.py
      # The hermetic half of the FLAC delivery pipeline: builds the shipped decoder sidecar,
      # checks its artifact/provenance/vectors and a red mutation, and bans decodeAudioData from
      # the delivery pipeline (PCM-only per AGENTS.md). The expensive half -- real browser decode
      # over Playwright -- is browser-qualification.yml's `npm run flac-decoder`, a different
      # script entirely; this one needs no browser. Previously reachable only from
      # scripts/sweep.sh, which nobody runs.
      - name: FLAC decoder artifact, provenance and delivery-pipeline gates
        run: |
          bash scripts/check-flac-decoder.sh
          bash scripts/test-flac-decoder.sh
      # Issue #097: the independent canonical effect-package V1 corpus plus its native and
      # scalar-Wasm inspection surfaces. Previously reachable only from scripts/sweep.sh, which
      # nobody runs. It re-runs check-workspace-policy.sh/check-realtime-policy.sh and their
      # mutation suites as its own preconditions (already separate steps above); left as-is rather
      # than edited apart under this change, since the redundant re-run is cheap and correct, just
      # not maximally efficient.
      - name: Effect package V1 corpus and inspection surface
        run: bash scripts/check-effect-package-v1.sh
      # Issue #082: the independent canonical effect-descriptor V1 corpus plus its native and
      # scalar-Wasm inspection surfaces (folds in test-effect-descriptor-capi.sh, which it already
      # calls as its own precondition). Previously reachable only from scripts/sweep.sh.
      - name: Effect descriptor V1 corpus and inspection surface
        run: bash scripts/check-effect-descriptor-v1.sh
      # The stem store's cold-open-latency and pump budgets, and its core/pump correctness gates.
      # Previously reachable only from scripts/sweep.sh, which nobody runs.
      - name: Stem store V1 gate
        run: node scripts/check-stem-store-v1.mjs
      - name: Native effect runtime policy, fixtures, conformance, and mutations
        run: bash scripts/check-effect-contract.sh
      - name: Protocol caller-buffer allocation audit
        run: bash scripts/run-protocol-allocation-audit.sh
      - name: Protocol benchmark runner build and negative argument checks (no benchmark)
        run: |
          cargo check --locked -p bench --all-targets
          bash scripts/test-protocol-benchmark.sh
      - name: Realtime race model
        run: RUSTFLAGS='--cfg loom --check-cfg=cfg(loom)' cargo test --locked --release -p engine --lib spsc_loom
      - name: Realtime audit hooks and syscall trace
        run: |
          cargo build --locked --release -p audit
          bash scripts/test-realtime-audit-probes.sh realtime target/release/audit
          timeout 120s bash scripts/trace-realtime-audit.sh target/release/audit 1000000
      # Mutation tests for scripts/validate-realtime-trace.sh, the strace-output parser
      # trace-realtime-audit.sh and its siblings depend on above. Previously sweep-only.
      - name: Realtime trace validator mutation tests
        run: bash scripts/test-realtime-trace-validator.sh
      # One harness, three subjects (scripts/test-realtime-audit-probes.sh): the realtime leg
      # above, plus builtins and builtins-graph, whose nine probes each were previously reachable
      # only from scripts/sweep.sh, which nobody runs.
      - name: Builtins and builtins-graph audit probe mutation tests
        run: |
          bash scripts/test-realtime-audit-probes.sh builtins target/release/audit
          bash scripts/test-realtime-audit-probes.sh builtins-graph target/release/audit
      - name: Native effect one-million-call allocation and syscall audit
        run: |
          cargo build --locked --release -p bench
          timeout 180s bash scripts/trace-effect-contract-audit.sh target/release/bench 1000000
      # Dependency-boundary and unsafe-code policy for rack, builtins and graph -- distinct from
      # the MAX_TRACKS ban (which moved to check-workspace-policy.sh above, P12), and previously
      # reachable only from scripts/sweep.sh, which nobody runs.
      - name: Rack, builtins and graph dependency-boundary policy and mutation tests
        run: |
          bash scripts/check-rack-policy.sh
          bash scripts/test-rack-policy.sh
          bash scripts/check-builtins-policy.sh
          bash scripts/test-builtins-policy.sh
          bash scripts/check-graph-policy.sh
      # The Issue-073/Issue-116 native PCM C-ABI runner's static seal (tool surface, dependency
      # boundary, and the cross-platform rename-publication contract). Previously reachable only
      # from scripts/sweep.sh, which nobody runs.
      - name: Native PCM runner static seal and mutation tests
        run: |
          bash scripts/check-native-pcm-runner.sh
          bash scripts/test-native-pcm-runner-v1-policy.sh
          bash scripts/test-native-pcm-runner-portability-v1-policy.sh
      - name: Conformance boundaries and research corpus
        run: |
          bash scripts/check-conformance-boundaries.sh
          bash scripts/check-dsp-research.sh
          cargo run --locked -p conformance --example conformance_fixtures -- --check
      - name: Feature-resolution tree
        run: cargo tree --locked --workspace -e features
      - name: Metadata report
        run: cargo metadata --locked --format-version 1 --no-deps
      # G1: the strongest single gate in the repo -- compiles a C++17 header consumer and a C11
      # fixture at -Wall -Wextra -Werror -pedantic, links the real libcapi.so, diffs its exported
      # miso_engine_v1_* symbols against the frozen 14-name ABI V1 list, and executes the fixture.
      # It previously ran only from `scripts/sweep.sh`, which nobody runs; a header/impl drift or
      # an accidental symbol addition was invisible to every PR until it broke a downstream build.
      - name: C ABI linkage, frozen symbol set and native consumer smoke test
        run: bash scripts/check-capi-abi.sh
      # G2: Rust randomises HashMap iteration order per process, so a same-process comparison
      # cannot catch it. This runs `graph_fixture` fresh 100 times and diffs the output; it caught
      # an injected HashMap nondeterminism in a prior audit and, like check-capi-abi.sh, previously
      # ran only from the sweep.
      - name: Graph fresh-process determinism (100 fresh processes)
        run: bash scripts/check-graph-determinism.sh
      - name: Native host smoke
        run: cargo run --locked -p host-native

  x86-probes:
    name: x86 scalar and SIMD compile probes
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      # #84 phase A made core (and so every production crate) depend on lane, whose
      # master-plan D4 guard refuses any build below x86-64-v3 — there is no scalar fallback to
      # compile-probe any more (W2-D1 retired the sub-v3 legs). These steps now assert the guard
      # DISCRIMINATES: a sub-v3 build must fail with the pinned message, at both feature levels.
      - name: Sub-v3 builds are refused by the lane guard (scalar)
        run: |
          ! CARGO_TARGET_DIR=target/ci/x86-scalar RUSTFLAGS='-C target-cpu=x86-64 -C target-feature=-avx2,-fma' cargo check --locked -p engine -p target-smoke -p math 2>/tmp/ci-scalar-probe.log
          grep -q 'requires x86-64-v3' /tmp/ci-scalar-probe.log
          ! rustc --print cfg -C target-cpu=x86-64 -C target-feature=-avx2,-fma | grep -qx 'target_feature="avx2"'
          ! rustc --print cfg -C target-cpu=x86-64 -C target-feature=-avx2,-fma | grep -qx 'target_feature="fma"'
      - name: Sub-v3 builds are refused by the lane guard (AVX2 without FMA)
        run: |
          ! CARGO_TARGET_DIR=target/ci/x86-avx2 RUSTFLAGS='-C target-cpu=x86-64 -C target-feature=+avx2,-fma' cargo check --locked -p engine -p target-smoke -p math 2>/tmp/ci-avx2-probe.log
          grep -q 'requires x86-64-v3' /tmp/ci-avx2-probe.log
          rustc --print cfg -C target-cpu=x86-64 -C target-feature=+avx2,-fma | grep -qx 'target_feature="avx2"'
          ! rustc --print cfg -C target-cpu=x86-64 -C target-feature=+avx2,-fma | grep -qx 'target_feature="fma"'
      - name: AVX2 with FMA compile probe and cfg assertion
        run: |
          CARGO_TARGET_DIR=target/ci/x86-avx2fma RUSTFLAGS='-C target-cpu=x86-64 -C target-feature=+avx2,+fma' cargo check --locked -p engine -p target-smoke -p math -p builtins -p builtins-compiler -p effect-runtime -p gate-expander -p multiband-compressor -p parametric-eq -p soft-clip
          rustc --print cfg -C target-cpu=x86-64 -C target-feature=+avx2,+fma | grep -qx 'target_feature="avx2"'
          rustc --print cfg -C target-cpu=x86-64 -C target-feature=+avx2,+fma | grep -qx 'target_feature="fma"'

  wasm:
    name: browser Wasm artifact probes
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain and Wasm standard library
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup target add --toolchain 1.97.1 wasm32-unknown-unknown
          sudo apt-get update
          sudo apt-get install -y ripgrep wabt
      - name: Browser-local realtime path has no atomic opcodes
        run: bash scripts/check-wasm-realtime-atomics.sh
      # #105 phase 2 C2: an artifact invocation names no evidence crate. Cargo unifies features
      # across the packages selected by ONE invocation, so building `conformance`
      # alongside `host-web` put core's `realtime-audit` instrumentation into the wasm
      # module that ships. The evidence crates keep their cross-target compile coverage in the
      # separate step below. `scripts/check-artifact-evidence-leak.sh` gates both halves.
      - name: Scalar Wasm release artifact
        run: |
          CARGO_TARGET_DIR=target/ci/wasm-scalar RUSTFLAGS='-C target-feature=-simd128' cargo build --locked --release --target wasm32-unknown-unknown -p engine -p session -p effect-contract -p effect-compiler -p protocol -p target-smoke -p host-core -p host-web -p lane -p math -p builtins -p builtins-compiler -p effect-runtime -p gate-expander -p delay -p multiband-compressor -p parametric-eq -p soft-clip
          ! rustc --print cfg --target wasm32-unknown-unknown -C target-feature=-simd128 | grep -qx 'target_feature="simd128"'
      - name: SIMD128 Wasm release artifact
        run: |
          CARGO_TARGET_DIR=target/ci/wasm-simd RUSTFLAGS='-C target-feature=+simd128' cargo build --locked --release --target wasm32-unknown-unknown -p engine -p session -p effect-contract -p effect-compiler -p protocol -p target-smoke -p host-core -p host-web -p lane -p math -p builtins -p builtins-compiler -p effect-runtime -p gate-expander -p delay -p multiband-compressor -p parametric-eq -p soft-clip
          rustc --print cfg --target wasm32-unknown-unknown -C target-feature=+simd128 | grep -qx 'target_feature="simd128"'
      # The #163 phase 2 console guest. It is dev/tooling and never ships, but it is the subject of
      # a recorded measurement family, and a guest that stopped building for wasm32 would not
      # surface until the next authorised run -- which is exactly the run that must not discover a
      # broken input.
      - name: Wasm console benchmark guest compiles for Wasm (not an artifact)
        run: |
          CARGO_TARGET_DIR=target/ci/wasm-console RUSTFLAGS='-C target-feature=+simd128' cargo build --locked --release --target wasm32-unknown-unknown -p wasm-console-guest -p console-workload
      - name: Evidence crates compile for Wasm (not an artifact)
        run: |
          CARGO_TARGET_DIR=target/ci/wasm-scalar RUSTFLAGS='-C target-feature=-simd128' cargo build --locked --release --target wasm32-unknown-unknown -p dsp-reference -p conformance
          CARGO_TARGET_DIR=target/ci/wasm-simd RUSTFLAGS='-C target-feature=+simd128' cargo build --locked --release --target wasm32-unknown-unknown -p dsp-reference -p conformance
      # #106 E1/E2/E5/E7 and the F4 native<->simd128 session parity, over the artifact that ships.
      # `build-web-audioworklet.sh` produces the one stripped simd128 module (#083 W4-D1);
      # `check-web-audioworklet.sh` asserts the frozen 28-export set, no imports, no shared memory,
      # no atomics or relaxed SIMD, the render export's allocation-free and trap-free call closure,
      # and the vector-kernel ratchet. The Python `--check` runs the raw-Wasm oracle, whose parity
      # assertion compares the artifact's rendered PCM against the digest the native test pins.
      - name: Browser AudioWorklet artifact gates and native parity
        run: |
          artifacts=$(mktemp -d)
          bash scripts/build-web-audioworklet.sh "$artifacts"
          bash scripts/check-web-audioworklet.sh "$artifacts"
          python3 -B scripts/web-audioworklet-browser-correctness.py --check --artifacts "$artifacts"
          # Issue #217: the resource-report rows the digest gates above do not cover, pinned
          # against the same shipped artifact. Issue #243 eval 6: the SDK's behavioural evals
          # against that same module, under Node's native TS stripping (no node_modules needed).
          # Both were previously reachable only from scripts/sweep.sh, which nobody runs.
          python3 -B scripts/check-browser-expected-resources.py --artifacts "$artifacts"
          bash scripts/check-sdk-headless.sh "$artifacts"
          ls -l "$artifacts"
      - name: Browser expected-resources tripwire self-test
        run: python3 -B scripts/check-browser-expected-resources.py --self-test
      - name: Hermetic browser host and worklet tests
        run: bash scripts/test-web-audioworklet.sh
      - name: Issue-005 scalar and SIMD protocol golden parity
        run: bash scripts/check-protocol-wasm-parity.sh
      - name: Issue-005 protocol benchmark corpus Wasm parity (no timings)
        run: bash scripts/check-protocol-benchmark-wasm-parity.sh

  wasm-gates:
    name: cross-target digest gates under wasmtime
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      # wabt is not optional here. #198 gave `run-wasm-gates.sh` the detector-residency pin, which
      # disassembles both guest modules with `wasm-objdump`, and the script hard-exits when the
      # binary is absent -- so from 12ae81f7 onwards this job died after the native leg printed and
      # before either wasm leg ran. The `wasm` job already installs the same package for
      # `check-wasm-realtime-atomics.sh`; this job needs it for the same reason.
      - name: Install pinned Rust toolchain, Wasm standard library and wabt
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup target add --toolchain 1.97.1 wasm32-unknown-unknown
          sudo apt-get update
          sudo apt-get install -y wabt
      # Gate G5 (master plan #83 section 3.6) and the wasm replay of gates M3 and D1: the frozen
      # corpus of tools/wasm-gate-corpus is run natively at Scalar/Simd4/Simd8 and
      # inside both browser artifacts (with and without simd128) under wasmtime 47.0.3, and every
      # digest is compared against pins the owning crate generated from the scalar Lane oracle.
      # A mismatch is never fixed by re-pinning: it means a target stopped agreeing with the oracle.
      - name: Native and WebAssembly cross-target digest gates
        run: bash scripts/run-wasm-gates.sh
      # Issue #146 E1. G6 over the full corpus is a standing gate, not a reproducer: with the
      # caller's MXCSR carrying FTZ+DAZ, a render that goes through an entry's canonical
      # floating-point environment lands on the frozen pins, and the unguarded control arm still
      # shows the 70 diverging rows #144 measured. Run in release, because that is the profile the
      # divergence was measured in and the one a host ships.
      - name: Gate G6 over the full corpus in release
        run: cargo test --locked --release -p wasm-gates
      - name: Upload cross-target gate evidence
        uses: actions/upload-artifact@v4
        with:
          name: wasm-gates
          path: target/ci/wasm-gates/wasm-gates.jsonl


  sdk:
    name: SDK typecheck and shipped-host mirror pin
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Issue #243 eval 6, the static half. The behavioural/generated-surface/deletion evals are
      # hermetic and already run in the host job (check-sdk-{headless,generated}.sh,
      # check-sdk-deletions.py); `tsc` needs `npm ci`, which needs the network, which is why this
      # one alone was excluded from scripts/sweep.sh's hermetic charter and, as a result, never ran
      # anywhere -- check-sdk-types.sh exits 2 on a clean checkout with no node_modules. This job
      # gives it the one thing it needs and nothing else.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - name: Install SDK dependencies
        working-directory: sdk
        run: npm ci
      - name: SDK typecheck and shipped-host mirror pin
        run: bash scripts/check-sdk-types.sh
