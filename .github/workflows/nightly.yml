name: nightly

# Everything here used to be a job on `ci`, running on every push to main and every pull request.
# None of it gates a merge:
#
#   * `native production-kernel release-probe report (non-blocking)` is not a required check -- it
#     cannot fail a build. It produces a report; a red report fails the job, which `failure-notice`
#     then reports (issue #1481).
#   * the two bounded fuzz jobs stayed per-PR, behind a `paths:` filter, in `fuzz.yml`. What moved
#     here is DEPTH: 10,000 executions per target is a smoke test, and running it on every pull
#     request buys breadth over diffs that mostly cannot affect a decoder. This job trades that for
#     a budget three to four orders of magnitude larger, once a day, over every target.
#
# ONE FILE, THREE JOBS -- and why that is not a shared failure mode. The concern with putting three
# unrelated things in one workflow is that one failure hides another. That happens when they are
# steps in one job; it does not happen here, because these are three independent jobs with no
# `needs:` edge between them. They start together, run to completion independently, and each
# reports its own conclusion. `failure-notice` then reports ALL of their results in one place. The
# alternative -- three files, three schedules, three notification streams -- gives a solo
# maintainer three things to notice instead of one, which is the failure mode that actually matters
# for a nightly.
#
# NOTIFICATION. GitHub's own notification for a failed scheduled run is weak: it is an Actions
# notification addressed to "the user who created the workflow", which in practice means whoever
# last touched the cron expression -- so it can silently re-point at whoever edited this file last,
# it is off unless that user has Actions notifications enabled, and it lands in a stream most
# people already filter. A nightly nobody sees is a deleted nightly. So failure is reported as a
# GitHub issue in this repository instead: `failure-notice` opens one, or comments on the open one
# if a previous night already did, naming which jobs failed and linking the run. That lands in the
# same issue list this repository is already driven from, and it does not depend on any per-user
# notification setting being right.

on:
  schedule:
    # 03:17 UTC. Off the hour, because the top of the hour is when GitHub's scheduler is most
    # loaded and `schedule` events are most likely to be delayed or dropped.
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  # No `cancel-in-progress`: a nightly that is cancelled by the next nightly has produced nothing.
  group: nightly-${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.97.1

jobs:
  native-vectorization-report:
    name: native production-kernel release-probe report (non-blocking)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain and disassembler
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          sudo apt-get update
          sudo apt-get install -y llvm
      # Issue #144 item 3 is evidence, not a merge gate: the nightly gates no merge. A red report or
      # red mutation run fails this job, so failure-notice reports it (issue #1481); the upload
      # step below still runs, so the receipt stays inspectable.
      - name: Generate report and run red mutations
        run: |
          bash scripts/run-native-vectorization-report.sh
          bash scripts/test-native-vectorization-report.sh \
            target/release/audit
      - name: Upload native vectorization evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-vectorization-report
          path: target/ci/native-vectorization/report.json
          overwrite: true


  deep-fuzz:
    name: deep fuzzing over every target
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust and cargo-fuzz toolchains
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup toolchain install nightly-2026-08-20 --profile minimal
          cargo +1.97.1 install cargo-fuzz --locked --version 0.13.2
      - name: Build every fuzz target
        run: cargo check --locked --manifest-path fuzz/Cargo.toml --bins
      # THE BUDGET, and why it is this number.
      #
      # Per PR each target gets `-runs=10000`. Measured on the runner this replaces, that entire
      # execution finishes in well under a second per target -- the 16-18 second CI steps were
      # sanitizer builds, not fuzzing. 180 seconds of wall clock per target is therefore on the
      # order of 10^6-10^7 executions, three to four orders of magnitude deeper than the per-PR
      # count, which is the point of trading breadth-on-every-PR for depth-once-a-day.
      #
      # `-max_total_time` rather than a bigger `-runs`: the budget is then bounded in the unit the
      # bill is denominated in, and does not drift with runner speed.
      #
      # Six targets x 180 s = 18 minutes of fuzzing, ~20 job-minutes with setup, once a night.
      # The move that created this file removes ~58 job-minutes per 25 pull-request and push runs,
      # so this stays well inside what it saves. (#1037 removed the `effect_package` and
      # `effect_state` targets with the effect-package crate.)
      #
      # No fixed `-seed`. The per-PR jobs pin seeds so a red is reproducible from the log; a
      # nightly wants a different walk each night, and any crash it finds is reproducible from the
      # uploaded artifact instead.
      #
      # Every target runs even after one fails, and the job fails at the end, so one crashing
      # target does not hide the other five.
      - name: Deep fuzz every target
        env:
          # lane's D4 guard requires x86-64-v3; cargo-fuzz rebuilds RUSTFLAGS and would drop the
          # workspace pin, so thread it through explicitly (#84).
          RUSTFLAGS: '-C target-feature=+avx2,+fma'
          BUDGET_SECONDS: '180'
        run: |
          set -uo pipefail
          root="$PWD/target/ci/nightly-fuzz"
          status=0
          for target in session_parse session_compile \
                        protocol_command protocol_session_transaction protocol_event protocol_response; do
            corpus="$root/corpus/$target"
            mkdir -p "$corpus" "$root/artifacts/$target"
            if compgen -G "fuzz/corpus/$target/*" > /dev/null; then
              cp "fuzz/corpus/$target"/* "$corpus/"
            fi
            seed_arguments=()
            case "$target" in
              session_*) seed_arguments=(-seed_inputs=fixtures/session/v1/canonical.json) ;;
            esac
            echo "::group::$target"
            cargo "+nightly-2026-08-20" fuzz run "$target" "$corpus" -- \
              "-max_total_time=$BUDGET_SECONDS" \
              "-artifact_prefix=$root/artifacts/$target/" \
              ${seed_arguments[@]+"${seed_arguments[@]}"} || status=1
            echo "::endgroup::"
          done
          exit "$status"
      - name: Upload crash reproducers and the accumulated corpus
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-fuzz
          path: target/ci/nightly-fuzz
          if-no-files-found: ignore
          overwrite: true

  release-link-proof:
    name: workspace release link proof (moved off the per-PR path)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      # The former release-build.yml's unconditional main-push leg (design §6.7/§12 stage 4):
      # release-build.yml was retired once qualification.yml carried the required context, and
      # qualification.yml's release-shape job's cargo check --release --workspace --all-targets
      # (metadata-only + check-only, no link) is not a substitute for actually linking every
      # test/bench/example target in release. This is that link proof, at full 21-minute cost,
      # once a day instead of on every PR and every main push.
      - name: Workspace release build (single panic variant, --no-run)
        run: bash scripts/run-release-workspace-tests.sh --no-run
      # Issue #1051: every committed randomized differential at 100 times its per-PR seeds, on the
      # build above -- the same panic override and `--workspace` feature set, so nothing is rebuilt.
      # A failing seed prints the one command that replays it; PROBE_966_COUNT is graph-compiler's
      # #966 probe's own seed count (64 per PR).
      - name: Randomized differentials at 100x the per-PR seeds
        env:
          CARGO_PROFILE_RELEASE_PANIC: unwind
          MISO_ENGINE_RANDOMIZED_SCALE: '100'
          PROBE_966_COUNT: '6400'
        run: |
          set -euo pipefail
          cargo test --locked --release --workspace --test randomized
          cargo test --locked --release --workspace --lib -- randomized_differential witness_tests \
            randomized_scenarios_render_exactly_the_unmodified_kernel randomized_restores
          cargo test --locked --release --workspace --test bank_levels -- --exact \
            randomized_consoles_compile_bind_and_render_the_scalar_bits

  math-sweeps:
    name: math exhaustive sweeps
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      # M1 exhaustive and F1 exhaustive run PR-side only when the diff touches math's tiny
      # reverse closure (math_closure, design §2); nightly runs both unconditionally so a
      # closure-missed regression is still found within a day.
      - name: Math M1 exhaustive sweep
        run: cargo test --locked --release -p math --features lane --test m1_exhaustive -- --ignored
      - name: Fast dB tier gate F1, exhaustive over both operating domains
        run: cargo test --locked --release -p math --features lane --test f1_fast_db_bounds -- --ignored
      # Issue #1045: per PR the session's canonical f32 spelling round-trips one million patterns;
      # this is all 2^32, about six minutes on four cores.
      - name: Session canonical f32 spelling, exhaustive round trip
        run: cargo test --locked --release -p session --lib -- --ignored value::tests::exhaustive_f32_round_trip

  # design §6.2 moved these ledgers off the per-PR lint job. #1026 retired the builtins and graph
  # benchmark-lifecycle suites with their benchmarks. #1043 moved the script-gate self-test suites
  # here too: on a pull request each runs only when a file it reads changes (qualification.yml's
  # `gate-self-tests`), so every one runs here every night, and a gate edit the router misses is
  # found within a day. Every step runs even after another fails, so one red suite hides no other.
  moved-mutation-suites:
    name: stem-store mutation ledger and script-gate self-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install ripgrep (not on the runner image; the conformance and research gates grep with rg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep
      - name: Stem store V1 mutation ledger
        if: ${{ !cancelled() }}
        run: node scripts/check-stem-store-v1.mjs --self-test --budgets
      - name: Environment and marker vocabulary mutation tests
        if: ${{ !cancelled() }}
        run: bash scripts/test-env-vocabulary.sh
      - name: Conformance boundary mutation tests
        if: ${{ !cancelled() }}
        run: bash scripts/test-conformance-boundaries.sh
      - name: Console benchmark validator and runner mutation tests
        if: ${{ !cancelled() }}
        run: bash scripts/test-console-benchmark.sh
      - name: SDK deletion gate self-test
        if: ${{ !cancelled() }}
        run: python3 -B scripts/check-sdk-deletions.py --self-test
      - name: DSP research gate mutation tests
        if: ${{ !cancelled() }}
        run: bash scripts/test-dsp-research.sh

  release-budgets:
    name: release-mode wall-clock budgets (host-web, host-core, graph-compiler, builtins-compiler)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      # design §10 finding 3: the deterministic half of each wall-clock test stays blocking on
      # PRs; the timing half becomes `#[ignore]` and runs here, in release, once a day, with the
      # number recorded against a product budget instead of a debug-build guess.
      #
      # Exact selectors keep unrelated opt-in timing tests out of this product-budget job.
      #
      # Issue #1045 moved the 65,537-track gates here off the per-PR debug job, which keeps a
      # constrained compile at that size: graph-compiler's compile and bind under its own 60 s
      # bound (the only guard of #962's linear compile and bind), then builtin preparation and the
      # phase-two allocation row at the same size. Overflow checks are on for these three, so a
      # narrowed track counter panics instead of wrapping.
      - name: Release-mode wall-clock budget tests
        run: |
          set -euo pipefail
          cargo test --locked --release -p host-web --lib -- --ignored --exact tests::maximum_document_dense_invalid_boot_finishes_under_one_second_in_release
          cargo test --locked --release -p host-web --lib -- --ignored --exact tests::a_vca_batch_at_the_bound_fits_a_quantum_in_release
          cargo test --locked --release -p host-core --test effect_observation -- --ignored --exact observation_cost_classes_are_separated_from_a_computed_scan_in_release
          cargo test --locked --release -p host-core --test prepare -- --ignored --exact dense_refusal_diagnostics_finish_under_one_second_in_release
          cargo test --locked --release --config profile.release.overflow-checks=true -p graph-compiler --test scale -- --ignored --exact compiles_and_binds_65_537_tracks_with_builtins
          cargo test --locked --release --config profile.release.overflow-checks=true -p builtins-compiler --features test-support --test scale -- --ignored --exact prepares_65_537_tracks_or_rejects_only_the_configured_resource
          cargo test --locked --release --config profile.release.overflow-checks=true -p builtins-compiler --features test-support --test allocation_tracker -- --ignored --exact phase_two_allocator_layouts_match_the_checked_resource_report_at_65_537_tracks

  full-size-tests:
    # Issue #1049 shrank these tests per PR -- a quarter of the Simd4/Simd8 ramping-elision
    # scenarios, four of the 48 million-sample EQ sequences, 10,000 of the million mutated protocol
    # frames, and the bank meter pass on an 8-track console -- and moved their full size here.
    # Each is an `#[ignore]`d test selected by its exact name, in a dev build (the per-PR debug
    # jobs' profile, overflow checks and debug assertions on), with the per-PR features its
    # package uses.
    name: full-size debug test sweeps (a share of each runs per PR)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Full-size debug test sweeps
        run: |
          set -euo pipefail
          cargo test --locked -p parametric-eq --lib --features math/lane,parametric-eq/test-support -- --ignored --exact ramping_elision::the_vector_differentials_render_their_bits_at_the_full_scenario_count
          cargo test --locked -p parametric-eq --test time_domain --features math/lane,parametric-eq/test-support -- --ignored --exact forty_eight_frozen_million_sample_sequences_remain_valid_without_recovery
          cargo test --locked -p conformance --test mutation_million -- --ignored --exact one_million_deterministic_mutations_cover_complete_schema_closed_dispatch
          cargo test --locked -p graph-compiler --lib --features builtins-compiler/test-support,graph/test-support,effect-compiler/test-support,engine/realtime-audit -- --ignored --exact tests::the_full_meter_pass_renders_without_an_audited_event_on_sixty_four_tracks

  failure-notice:
    name: report nightly failure as an issue
    needs: [native-vectorization-report, deep-fuzz, release-link-proof, math-sweeps,
            moved-mutation-suites, release-budgets, full-size-tests]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      # GitHub's scheduled-run notification goes to whoever last touched the cron expression and is
      # off by default unless that user has Actions notifications enabled, so it is not a reliable
      # signal for a solo maintainer. An open issue in this repository is: it appears in the issue
      # list the project is already run from, and it survives an unread email.
      #
      # One issue, not one per night: if the previous night already opened one and it is still
      # open, this comments on it instead. Closing the issue is the acknowledgement -- the next
      # failure after that opens a fresh one.
      - name: Open or update the nightly failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # Set the `NIGHTLY_ASSIGNEE` repository variable to route the issue at someone other than
          # the default. An unset or wrong value must not fail the notice, so assignment is a
          # best-effort second step.
          ASSIGNEE: ${{ vars.NIGHTLY_ASSIGNEE || 'tamashi095' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPORT_RESULT: ${{ needs.native-vectorization-report.result }}
          DEEP_FUZZ_RESULT: ${{ needs.deep-fuzz.result }}
          RELEASE_LINK_PROOF_RESULT: ${{ needs.release-link-proof.result }}
          MATH_SWEEPS_RESULT: ${{ needs.math-sweeps.result }}
          MOVED_MUTATION_SUITES_RESULT: ${{ needs.moved-mutation-suites.result }}
          RELEASE_BUDGETS_RESULT: ${{ needs.release-budgets.result }}
          FULL_SIZE_TESTS_RESULT: ${{ needs.full-size-tests.result }}
        run: |
          set -euo pipefail
          title='nightly workflow is failing'
          body=$(printf 'The scheduled nightly workflow failed.\n\n| job | result |\n| --- | --- |\n| native production-kernel release-probe report | %s |\n| deep fuzzing over every target | %s |\n| workspace release link proof | %s |\n| math exhaustive sweeps | %s |\n| stem-store mutation ledger and script-gate self-tests | %s |\n| release-mode wall-clock budgets | %s |\n| full-size debug test sweeps | %s |\n\nRun: %s\n\nClose this issue once the failure is dealt with. The next failing night after that opens a fresh one; while it is open, further failures are added as comments.\n' \
            "$REPORT_RESULT" "$DEEP_FUZZ_RESULT" "$RELEASE_LINK_PROOF_RESULT" \
            "$MATH_SWEEPS_RESULT" "$MOVED_MUTATION_SUITES_RESULT" "$RELEASE_BUDGETS_RESULT" \
            "$FULL_SIZE_TESTS_RESULT" "$RUN_URL")
          existing=$(gh issue list --state open --search "$title in:title" --json number,title \
            --jq "[.[] | select(.title == \"$title\") | .number] | first // empty")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            number=$(gh issue create --title "$title" --body "$body" | sed 's#.*/##')
            gh issue edit "$number" --add-assignee "$ASSIGNEE" || \
              echo "could not assign issue $number to $ASSIGNEE; leaving it unassigned"
          fi
