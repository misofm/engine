name: release build

# The workspace release build used to be a job on `ci`, which runs on every push to main and every
# pull request against it. At ~5 minutes on an 8-vCPU runner it was the single most expensive job
# in the workflow, and it is the only one whose trigger can be narrowed without losing an assertion
# outright -- it is always green, and it builds no artifact anything else consumes.
#
# The policy this file implements:
#
#   push to main   -- ALWAYS. Main is verified in full on every merge, unfiltered, exactly as
#                     before. A release-only break can therefore reach main, but it is caught by
#                     the run that the merge itself starts, within about five minutes of landing.
#   pull request   -- only when the diff touches something that can plausibly break a release
#                     build in a way `ci`'s debug `cargo test --workspace --all-targets` cannot
#                     already see. That is the `paths:` list below, and it is deliberately short.
#   dispatch       -- `gh workflow run release-build.yml --ref <branch>` for anyone who wants the
#                     full pre-merge check on a branch the filter skipped.
#
# What the filter is derived from, rather than guessed at. The failure this job exists to catch is
# the panic-variant filename clobber described at length in scripts/run-release-workspace-tests.sh:
# it is a property of which packages carry a `cdylib`/`staticlib` crate-type and of
# `[profile.release]`, so it can only be introduced by a manifest. Beyond that, rustc exposes no
# profile-dependent cfg other than `debug_assertions`/`overflow_checks`, so the only OTHER way a
# source-only change can compile in debug and fail in release is a `cfg(debug_assertions)` item --
# of which this workspace has eight, one of them a `#[cfg(any(debug_assertions, test))]` fn in
# crates/miso-engine-multiband-compressor/src/lib.rs. That class is the coverage this trade gives
# up pre-merge, and it is the reason the push leg stays unfiltered.
#
# Over the 60 most recent non-merge commits on main, 4 touched a Cargo manifest, so the filter is
# expected to skip roughly nine pull requests in ten.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'scripts/run-release-workspace-tests.sh'
      - '.github/workflows/release-build.yml'
  workflow_dispatch:

concurrency:
  group: release-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: 1.97.1

jobs:
  release-workspace:
    name: workspace release build
    runs-on: blacksmith-8vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      # TIER 2 of the caching policy documented at the top of ci.yml, and the only place in the
      # repository that restores a compiled artifact of any kind.
      #
      # This job is the one job that can take it. It asserts no digest, renders no audio, times
      # nothing and produces no shipped artifact -- the comment above already records that "it
      # builds no shipped artifact, so no artifact digest depends on it". `--no-run` asks exactly
      # one question, whether the release profile still compiles, and the answer is a build
      # outcome rather than a byte comparison. Nothing here can be quietly wrong: a stale
      # dependency either compiles or it does not.
      #
      # Two independent properties keep it honest anyway. The action deletes every
      # workspace-member artifact from `target/` before saving, so all 48 `miso-engine-*` crates
      # -- the ones whose source actually changes commit to commit -- are compiled from the
      # checked-out tree on every single run, and only the 158 external packages are restored.
      # Those are immutable for a given name, version and `Cargo.lock` checksum, and cargo
      # re-fingerprints each of them against the current rustc version, profile and flags before
      # reusing it. A restore-key fallback from an older lockfile can therefore leave unused
      # rlibs on the disk; it cannot link one.
      #
      # Measured on run 33381962189: the external half of this build is about 33 s of its 5 min 01 s.
      - name: Cache the cargo registry and compiled dependencies
        uses: useblacksmith/rust-cache@v3
        with:
          prefix-key: v1-deps
          cache-targets: true
      # D12 puts `panic = "abort"` on `[profile.release]`, so ONE workspace-wide release
      # invocation builds both panic variants of every crate, and the three packages whose lib
      # units carry a cdylib/staticlib crate-type emit un-hashed filenames the two variants
      # clobber. A downstream unit then links whichever variant landed last and fails with a
      # misleading `E0463: can't find crate for ...`. The runner pins a single panic variant for
      # this run; it builds no shipped artifact, so no artifact digest depends on it. See the
      # "Panic behaviour by profile" section of docs/REALTIME_DEPENDENCY_POLICY.md, and the
      # header of the script itself.
      #
      # This is its own job rather than another step on `host` so the long fat-LTO link runs in
      # parallel with the rest of CI instead of extending the critical path. It is now its own
      # workflow as well, so the `paths:` filter above can skip it without leaving a check that
      # never reports.
      #
      # `--no-run` is deliberate: it gates exactly the thing that rotted. The clobber is a BUILD
      # failure, it happens while compiling every test target, and `--no-run` catches it
      # deterministically -- verified both ways from clean target directories, twice green with
      # the override and still red without it.
      #
      # Running the tests is the intended end state and is NOT done yet, because repairing the
      # build made two release-only failures reachable for the first time and both predate this
      # job. No CI leg has ever run these tests in release, and the workspace release build did
      # not compile, so nothing could have run them. Both fail on `main`, with and without the
      # panic override, and both pass in debug:
      #
      #   * `observation_cost_classes_are_what_they_claim (#159)` (#143,
      #     crates/miso-engine-host-core/tests/effect_observation.rs) -- deterministic. Arming
      #     costs nothing (AllArmed sits at or below ConsoleNoCapacity), but the assertion
      #     subtracts the NoConsole baseline and so charges observation for a console existing.
      #   * `a_million_windows_are_read_whole_and_in_order (#160)` (#143,
      #     crates/miso-engine-core/tests/observation_transport.rs) -- intermittent: it failed
      #     three of five full-workspace release runs while passing 20 of 20 standalone release
      #     reruns, so it is timing-dependent rather than a plain red.
      #
      # Both are questions about what those gates assert, so they belong to their owner rather
      # than to a --skip list here. Turn this step into the full `cargo test` run once they are
      # resolved; the script already runs the tests by default.
      - name: Workspace release build (single panic variant)
        run: bash scripts/run-release-workspace-tests.sh --no-run
