name: browser qualification

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/ISSUE_SPECS/**'
      - 'docs/**'
      - 'README.md'
      - 'sdk/**'
      - 'scripts/check-sdk-deletions.py'
      - 'scripts/check-sdk-generated.sh'
      - 'scripts/check-sdk-headless.sh'
      - 'scripts/check-sdk-types.sh'
      - 'scripts/sdk-package.sh'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: browser-qualification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: 1.97.1

jobs:
  route:
    name: classify qualification paths
    runs-on: ubuntu-24.04
    outputs:
      route: ${{ steps.classify.outputs.route }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate path-routing policy and mutations
        run: |
          python3 -B scripts/check-ci-path-routing.py
          python3 -B scripts/test-ci-path-routing.py
      - id: classify
        name: Select fail-safe qualification route
        run: |
          route=$(python3 -B scripts/ci-path-router.py \
            --event "${{ github.event_name }}" \
            --base "${{ github.event.pull_request.base.sha || github.event.before }}" \
            --head "${{ github.event.pull_request.head.sha || github.sha }}")
          printf 'route=%s\n' "$route" >> "$GITHUB_OUTPUT"

  artifact:
    name: shipped AudioWorklet artifact
    needs: route
    if: needs.route.outputs.route == 'full'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain and Wasm standard library
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup target add --toolchain 1.97.1 wasm32-unknown-unknown
      - name: Build the exact shipped artifact
        run: |
          mkdir -p target/ci/browser-qualification-artifacts
          bash scripts/build-web-audioworklet.sh target/ci/browser-qualification-artifacts
          mkdir -p target/ci/flac-decoder-artifacts
          bash scripts/build-flac-decoder.sh target/ci/flac-decoder-artifacts
      - name: Upload shipped artifact
        uses: actions/upload-artifact@v4
        with:
          name: browser-qualification-artifact
          path: target/ci/browser-qualification-artifacts/
          if-no-files-found: error
      - name: Upload shipped FLAC decoder artifact
        uses: actions/upload-artifact@v4
        with:
          name: flac-decoder-artifact
          path: target/ci/flac-decoder-artifacts/
          if-no-files-found: error

  browser:
    name: ${{ matrix.browser }} — browser qualification gates
    needs: [route, artifact]
    if: needs.route.outputs.route == 'full'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hosts/host-web/qualification/package-lock.json
      - name: Download shipped artifact
        uses: actions/download-artifact@v4
        with:
          name: browser-qualification-artifact
          path: target/ci/browser-qualification-artifacts
      - name: Install pinned browser
        working-directory: hosts/host-web/qualification
        run: |
          npm ci
          npx playwright install --with-deps "${{ matrix.browser }}"
      - name: Download shipped FLAC decoder artifact
        uses: actions/download-artifact@v4
        with:
          name: flac-decoder-artifact
          path: target/ci/flac-decoder-artifacts
      - name: ${{ matrix.browser }} — attestation, AudioWorklet, native digest, and stall gates
        working-directory: hosts/host-web/qualification
        run: npm run qualify -- --artifacts "$GITHUB_WORKSPACE/target/ci/browser-qualification-artifacts" --browser "${{ matrix.browser }}" --check-matrix --self-test-mutations
      - name: Generated deployment matrix is current
        working-directory: hosts/host-web/qualification
        run: npm run matrix -- --check
      - name: ${{ matrix.browser }} — bit-exact FLAC Worker and provenance gates
        working-directory: hosts/host-web/qualification
        run: npm run flac-decoder -- --decoder-artifacts "$GITHUB_WORKSPACE/target/ci/flac-decoder-artifacts" --browser "${{ matrix.browser }}"

  qualification:
    name: browser qualification
    if: always()
    needs: [route, artifact, browser]
    runs-on: ubuntu-24.04
    env:
      ROUTE_RESULT: ${{ needs.route.result }}
      ROUTE: ${{ needs.route.outputs.route }}
      ARTIFACT_RESULT: ${{ needs.artifact.result }}
      BROWSER_RESULT: ${{ needs.browser.result }}
    steps:
      - name: Enforce browser qualification route
        run: |
          set -euo pipefail
          [[ "$ROUTE_RESULT" == success ]] || { echo "router result: $ROUTE_RESULT" >&2; exit 1; }
          case "$ROUTE" in
            full) expected=success ;;
            sdk|evidence) expected=skipped ;;
            *) echo "unknown route: $ROUTE" >&2; exit 1 ;;
          esac
          for result in "$ARTIFACT_RESULT" "$BROWSER_RESULT"; do
            [[ "$result" == "$expected" ]] || { echo "expected $expected heavy result, got $result" >&2; exit 1; }
          done
